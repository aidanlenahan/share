erties; matter is purely particulate."]], "ans": "C", "exp": "<p>Matter and energy are not distinct. Large pieces of matter behave mainly as particles, photons mainly as waves (no rest mass), and electrons clearly show both.<\/p>"}]}, {"title": "The Atomic Spectrum of Hydrogen", "qs": [{"n": 26, "stem": "<p>The hydrogen emission spectrum is a line spectrum rather than a continuous spectrum. This shows that<\/p>", "opts": [["A", "the electron in hydrogen can have any energy"], ["B", "only certain energies are allowed for the electron in the hydrogen atom (its energy is quantized)"], ["C", "hydrogen atoms emit all wavelengths of visible light"], ["D", "hydrogen absorbs light but never emits it"]], "ans": "B", "exp": "<p>A line spectrum contains only a few discrete wavelengths, which result from changes between discrete (quantized) energy levels. If any energy were allowed, the spectrum would be continuous.<\/p>"}, {"n": 27, "stem": "<p>Which of the following produces a continuous spectrum?<\/p>", "opts": [["A", "White light passed through a prism"], ["B", "Excited hydrogen atoms in a discharge tube"], ["C", "Sodium atoms emitting at 589 nm"], ["D", "A hydrogen atom whose electron falls from n = 6 to n = 1"]], "ans": "A", "exp": "<p>White light (like a rainbow) contains all wavelengths of visible light, giving a continuous spectrum. Excited atoms give line spectra.<\/p>"}]}, {"title": "The Bohr Model", "qs": [{"n": 28, "stem": "<p>Using the Bohr model, what is the energy of the electron in the n = 3 level of a hydrogen atom? (Eₙ = −2.178 × 10⁻¹⁸ J (Z²/n²))<\/p>", "opts": [["A", "−2.42 × 10⁻¹⁹ J"], ["B", "2.42 × 10⁻¹⁹ J"], ["C", "−1.96 × 10⁻¹⁷ J"], ["D", "−7.26 × 10⁻¹⁹ J"]], "ans": "A", "exp": "<p>E₃ = −2.178 × 10⁻¹⁸ J (1²/3²) = −2.42 × 10⁻¹⁹ J. The negative sign means the bound electron is lower in energy than at n = ∞ (E = 0).<\/p>"}, {"n": 29, "stem": "<p>An electron in a hydrogen atom falls from n = 5 to n = 2. What is the wavelength of the emitted photon? (ΔE = −2.178 × 10⁻¹⁸ J (1/n_final² − 1/n_initial²), h = 6.626 × 10⁻³⁴ J·s, c = 2.9979 × 10⁸ m/s)<\/p>", "opts": [["A", "304 nm"], ["B", "314 nm"], ["C", "95.0 nm"], ["D", "434 nm"]], "ans": "D", "exp": "<p>ΔE = −2.178 × 10⁻¹⁸ J (1/2² − 1/5²) = −4.574 × 10⁻¹⁹ J. λ = hc/|ΔE| = (6.626 × 10⁻³⁴)(2.9979 × 10⁸)/(4.574 × 10⁻¹⁹ J) = 4.343 × 10⁻⁷ m = 434 nm (visible, violet).<\/p>"}, {"n": 30, "stem": "<p>How much energy must a hydrogen atom absorb to move its electron from n = 2 to n = 4? (ΔE = −2.178 × 10⁻¹⁸ J (1/n_final² − 1/n_initial²))<\/p>", "opts": [["A", "−4.08 × 10⁻¹⁹ J"], ["B", "6.81 × 10⁻¹⁹ J"], ["C", "5.45 × 10⁻¹⁹ J"], ["D", "4.08 × 10⁻¹⁹ J"]], "ans": "D", "exp": "<p>ΔE = −2.178 × 10⁻¹⁸ J (1/4² − 1/2²) = −2.178 × 10⁻¹⁸ J (0.0625 − 0.2500) = 4.08 × 10⁻¹⁹ J. The positive sign shows energy is absorbed (λ = hc/ΔE = 486 nm).<\/p>"}, {"n": 31, "stem": "<p>What is the minimum energy needed to remove the electron from one mole of ground-state hydrogen atoms? (E = −2.178 × 10⁻¹⁸ J (Z²/n²), Nᴀ = 6.022 × 10²³ mol⁻¹)<\/p>", "opts": [["A", "1312 kJ/mol"], ["B", "2623 kJ/mol"], ["C", "2.178 × 10⁻¹⁸ kJ/mol"], ["D", "328 kJ/mol"]], "ans": "A", "exp": "<p>Removing the electron means n_final = ∞: ΔE = −2.178 × 10⁻¹⁸ J (1/∞ − 1/1²) = 2.178 × 10⁻¹⁸ J per atom. Per mole: (2.178 × 10⁻¹⁸ J)(6.022 × 10²³ mol⁻¹) = 1.312 × 10⁶ J/mol = 1312 kJ/mol.<\/p>"}, {"n": 32, "stem": "<p>What is the minimum energy required to remove the electron from a hydrogen atom that is in the n = 3 excited state? (ΔE = −2.178 × 10⁻¹⁸ J (1/n_final² − 1/n_initial²))<\/p>", "opts": [["A", "2.42 × 10⁻¹⁹ J"], ["B", "7.26 × 10⁻¹⁹ J"], ["C", "1.94 × 10⁻¹⁸ J"], ["D", "2.178 × 10⁻¹⁸ J"]], "ans": "A", "exp": "<p>n_initial = 3, n_final = ∞: ΔE = −2.178 × 10⁻¹⁸ J (0 − 1/3²) = 2.42 × 10⁻¹⁹ J.<\/p>"}, {"n": 33, "stem": "<p>Equation (12.1) applies to all one-electron species. What is the energy of the electron in the ground state (n = 1) of He⁺? (E = −2.178 × 10⁻¹⁸ J (Z²/n²))<\/p>", "opts": [["A", "−4.356 × 10⁻¹⁸ J"], ["B", "−8.712 × 10⁻¹⁸ J"], ["C", "−2.178 × 10⁻¹⁸ J"], ["D", "−5.445 × 10⁻¹⁹ J"]], "ans": "B", "exp": "<p>For He⁺, Z = 2: E₁ = −2.178 × 10⁻¹⁸ J (2²/1²) = −8.712 × 10⁻¹⁸ J.<\/p>"}, {"n": 34, "stem": "<p>The electron in a Li²⁺ ion (Z = 3) falls from n = 3 to n = 2. What is the wavelength of the emitted photon? (E = −2.178 × 10⁻¹⁸ J (Z²/n²), h = 6.626 × 10⁻³⁴ J·s, c = 2.9979 × 10⁸ m/s)<\/p>", "opts": [["A", "657 nm"], ["B", "219 nm"], ["C", "73.0 nm"], ["D", "24.3 nm"]], "ans": "C", "exp": "<p>ΔE = −2.178 × 10⁻¹⁸ J (3²)(1/2² − 1/3²) = −2.722 × 10⁻¹⁸ J. λ = hc/|ΔE| = (6.626 × 10⁻³⁴)(2.9979 × 10⁸)/(2.722 × 10⁻¹⁸ J) = 7.296 × 10⁻⁸ m = 73.0 nm. (Forgetting the Z² = 9 factor gives a wavelength 9 times too long, 657 nm.)<\/p>"}, {"n": 35, "stem": "<p>In the Bohr model, a calculated ΔE for an electron transition comes out negative. This means that<\/p>", "opts": [["A", "the atom has absorbed a photon"], ["B", "the atom has lost energy, which is carried away by an emitted photon"], ["C", "the wavelength of the photon is negative"], ["D", "the electron has moved to a level with a larger n"]], "ans": "B", "exp": "<p>ΔE = E_final − E_initial &lt; 0 means the atom lost energy and is now more stable; a photon is emitted. Use |ΔE| in λ = hc/ΔE, since a negative wavelength is meaningless.<\/p>"}, {"n": 36, "stem": "<p>Which statement about the Bohr model is correct?<\/p>", "opts": [["A", "It shows that electrons move in elliptical orbits around the nucleus."], ["B", "It fits the energy levels of hydrogen but fails for other atoms and is fundamentally incorrect."], ["C", "It correctly predicts the energy levels of all atoms."], ["D", "It is the basis from which the current theory of atomic structure is derived."]], "ans": "B", "exp": "<p>Bohr's model reproduced hydrogen's energy levels but did not work for other atoms. It was historically important, but modern theory is not derived from it, and electrons do not move in circular orbits.<\/p>"}, {"n": 37, "stem": "<p>In the hydrogen emission spectrum, the lines in the visible region correspond to transitions from higher levels down to which level?<\/p>", "opts": [["A", "n = 3"], ["B", "n = 1"], ["C", "n = 2"], ["D", "n = ∞"]], "ans": "C", "exp": "<p>The visible lines of hydrogen come from electrons falling from higher levels to n = 2. Transitions to n = 1 release more energy and lie in the ultraviolet.<\/p>"}]}], "count": 37, "cards": 58}, {"slug": "ch13", "name": "Chapter 13", "title": "Bond energies, Lewis structures, resonance, octet exceptions, formal charge and VSEPR", "intro": "<h4>Formulas<\/h4><ul class='flist'><li>ΔH = ΣD(bonds broken) − ΣD(bonds formed)<\/li><li>Formal charge = valence e⁻ on free atom − valence e⁻ assigned in the molecule<\/li><li>Valence e⁻ assigned = lone-pair electrons + ½(shared electrons)<\/li><li>Sum of formal charges = overall charge of the molecule or ion<\/li><\/ul><h4>Rules<\/h4><ul class='flist'><li>Bond breaking is endothermic (+); bond forming is exothermic (−)<\/li><li>Bond energies give approximate ΔH, for gas-phase reactions only<\/li><li>Lewis step 1: sum all valence electrons<\/li><li>Lewis step 2: one electron pair per bond between bound atoms<\/li><li>Lewis step 3: place remaining electrons to satisfy the duet rule (H) and octet rule (second row)<\/li><li>B and Be are often electron-deficient; second-row elements never exceed an octet<\/li><li>Third-row and heavier elements may exceed an octet<\/li><li>Extra electrons go on the central atom<\/li><li>Best structure (second row): formal charges near zero, negative charge on the most electronegative atom<\/li><li>Lone pairs need more room than bonding pairs and compress bond angles<\/li><li>Multiple bonds count as one effective electron pair in VSEPR<\/li><\/ul><h4>VSEPR geometries<\/h4><ul class='flist'><li>2 pairs: linear, 180°<\/li><li>3 pairs: trigonal planar, 120°<\/li><li>4 pairs: tetrahedral, 109.5° (AB₃ trigonal pyramidal, AB₂ V-shaped)<\/li><li>5 pairs: trigonal bipyramidal, 90° and 120° (AB₄ see-saw, AB₃ T-shaped, AB₂ linear)<\/li><li>6 pairs: octahedral, 90° (AB₄ with 2 lone pairs: square planar)<\/li><li>Bond angles: CH₄ 109.5°, NH₃ 107°, H₂O 104.5°<\/li><\/ul>", "sections": [{"title": "Bond Energy and Enthalpy", "qs": [{"n": 1, "stem": "<p>Using D(H—H) = 432 kJ/mol, D(F—F) = 154 kJ/mol, and D(H—F) = 565 kJ/mol, estimate ΔH for H₂(g) + F₂(g) → 2HF(g).<\/p>", "opts": [["A", "+544 kJ"], ["B", "−544 kJ"], ["C", "−1130 kJ"], ["D", "+21 kJ"]], "ans": "B", "exp": "<p>Bonds broken: 1(432) + 1(154) = 586 kJ. Bonds formed: 2(565) = 1130 kJ. ΔH = 586 − 1130 = −544 kJ. (+544 has the wrong sign; −1130 ignores bond breaking.)<\/p>"}, {"n": 2, "stem": "<p>Using D(H—H) = 432 kJ/mol, D(Cl—Cl) = 239 kJ/mol, and D(H—Cl) = 427 kJ/mol, estimate ΔH for H₂(g) + Cl₂(g) → 2HCl(g).<\/p>", "opts": [["A", "−854 kJ"], ["B", "+244 kJ"], ["C", "−183 kJ"], ["D", "+183 kJ"]], "ans": "C", "exp": "<p>Broken: 432 + 239 = 671 kJ. Formed: 2(427) = 854 kJ. ΔH = 671 − 854 = −183 kJ.<\/p>"}, {"n": 3, "stem": "<p>Using D(C—H) = 413, D(Cl—Cl) = 239, D(C—Cl) = 339, and D(H—Cl) = 427 kJ/mol, estimate ΔH for CH₄(g) + Cl₂(g) → CH₃Cl(g) + HCl(g).<\/p>", "opts": [["A", "+114 kJ"], ["B", "−766 kJ"], ["C", "−1418 kJ"], ["D", "−114 kJ"]], "ans": "D", "exp": "<p>Only one C—H and one Cl—Cl bond break: 413 + 239 = 652 kJ. Formed: one C—Cl + one H—Cl = 339 + 427 = 766 kJ. ΔH = 652 − 766 = −114 kJ.<\/p>"}, {"n": 4, "stem": "<p>Using D(N≡N) = 941, D(H—H) = 432, and D(N—H) = 391 kJ/mol, estimate ΔH for N₂(g) + 3H₂(g) → 2NH₃(g).<\/p>", "opts": [["A", "−109 kJ"], ["B", "+109 kJ"], ["C", "−1564 kJ"], ["D", "+982 kJ"]], "ans": "A", "exp": "<p>Broken: 941 + 3(432) = 2237 kJ. Formed: 6 N—H = 6(391) = 2346 kJ. ΔH = 2237 − 2346 = −109 kJ.<\/p>"}, {"n": 5, "stem": "<p>Using D(C—H) = 413, D(O═O) = 495, D(C═O in CO₂) = 799, and D(O—H) = 467 kJ/mol, estimate ΔH for CH₄(g) + 2O₂(g) → CO₂(g) + 2H₂O(g).<\/p>", "opts": [["A", "+824 kJ"], ["B", "−2642 kJ"], ["C", "−824 kJ"], ["D", "−329 kJ"]], "ans": "C", "exp": "<p>Broken: 4(413) + 2(495) = 1652 + 990 = 2642 kJ. Formed: 2(799) + 4(467) = 1598 + 1868 = 3466 kJ. ΔH = 2642 − 3466 = −824 kJ.<\/p>"}, {"n": 6, "stem": "<p>Using D(C—H) = 413, D(Cl—Cl) = 239, D(F—F) = 154, D(C—F) = 485, D(C—Cl) = 339, D(H—F) = 565, and D(H—Cl) = 427 kJ/mol, estimate ΔH for CH₄(g) + 2Cl₂(g) + 2F₂(g) → CF₂Cl₂(g) + 2HF(g) + 2HCl(g).<\/p>", "opts": [["A", "−3632 kJ"], ["B", "+1194 kJ"], ["C", "−2438 kJ"], ["D", "−1194 kJ"]], "ans": "D", "exp": "<p>Broken: 4(413) + 2(239) + 2(154) = 1652 + 478 + 308 = 2438 kJ. Formed: 2(485) + 2(339) + 2(565) + 2(427) = 970 + 678 + 1130 + 854 = 3632 kJ. ΔH = 2438 − 3632 = −1194 kJ (Example 13.5; the value from enthalpies of formation is −1126 kJ).<\/p>"}, {"n": 7, "stem": "<p>In the expression ΔH = ΣD(bonds broken) − ΣD(bonds formed), which statement is correct?<\/p>", "opts": [["A", "D is negative for bonds formed and positive for bonds broken."], ["B", "D always has a positive sign; breaking bonds requires energy (endothermic) and forming bonds releases energy (exothermic)."], ["C", "Bond breaking is exothermic, so it contributes a negative term."], ["D", "The method applies equally well to reactions in solution, because bond energies include intermolecular interactions."]], "ans": "B", "exp": "<p>D (bond energy per mole of bonds) is always positive. Bond breaking requires energy (endothermic, + terms); bond formation releases energy, handled by the minus sign. The method should be limited to gas-phase reactions because bond energies don't include intermolecular interactions.<\/p>"}, {"n": 8, "stem": "<p>Using bond energies, ΔH for H₂(g) + F₂(g) → 2HF(g) is −544 kJ, while enthalpies of formation give −542 kJ. Why are bond-energy estimates not expected to match exactly?<\/p>", "opts": [["A", "Bond energies are averages taken from many different compounds."], ["B", "Bond energies include the energy of intermolecular forces in liquids."], ["C", "Enthalpies of formation are always less accurate than bond energies."], ["D", "Bond energies are only defined for ionic compounds."]], "ans": "A", "exp": "<p>Bond energies are averages from several compounds, so ΔH from bond energies only approximates the value from enthalpies of formation, here 2(−271) = −542 kJ.<\/p>"}]}, {"title": "The Localized Electron Model and Lewis Structures", "qs": [{"n": 9, "stem": "<p>In the localized electron (LE) model, electron pairs found in the space between two atoms are called:<\/p>", "opts": [["A", "lone pairs"], ["B", "core electrons"], ["C", "bonding pairs"], ["D", "resonance pairs"]], "ans": "C", "exp": "<p>Pairs in the space between two atoms are bonding pairs. Pairs localized on one atom are lone pairs.<\/p>"}, {"n": 10, "stem": "<p>How many valence electrons are in the Lewis structure of CF₄, and how many lone pairs does the full structure contain?<\/p>", "opts": [["A", "32 valence electrons; 12 lone pairs"], ["B", "36 valence electrons; 12 lone pairs"], ["C", "32 valence electrons; 16 lone pairs"], ["D", "28 valence electrons; 10 lone pairs"]], "ans": "A", "exp": "<p>Valence electrons: 4 + 4(7) = 32. Four C—F bonds use 8, leaving 24 electrons = 12 lone pairs (three on each F).<\/p>"}, {"n": 11, "stem": "<p>In drawing the Lewis structure of CO₂, how many electrons remain after the two C—O single bonds are drawn, and what is the correct final structure?<\/p>", "opts": [["A", "14 electrons; O—C≡O with one lone pair on C"], ["B", "12 electrons; each O has three lone pairs and C has none (O—C—O)"], ["C", "12 electrons; O═C═O with two lone pairs on each O"], ["D", "16 electrons; O═C═O with one lone pair on C"]], "ans": "C", "exp": "<p>CO₂ has 4 + 2(6) = 16 valence electrons; 16 − 4 = 12 remain. Three lone pairs on each O leaves C with only 4 electrons. The correct structure is O═C═O with two lone pairs on each O, so every atom has an octet.<\/p>"}, {"n": 12, "stem": "<p>What is the correct Lewis structure of the cyanide ion, CN⁻?<\/p>", "opts": [["A", "[:C≡N:]⁻, 10 valence electrons"], ["B", "[C═N]⁻ with two lone pairs on each atom, 8 valence electrons"], ["C", "C—N with three lone pairs on each atom, 14 valence electrons"], ["D", "[:C≡N:]⁻, 9 valence electrons"]], "ans": "A", "exp": "<p>4 + 5 + 1 = 10 valence electrons (the −1 charge adds one). C≡N uses 6 electrons, and one lone pair on each atom gives both atoms octets.<\/p>"}, {"n": 13, "stem": "<p>Which statement about the NO⁺ ion is correct?<\/p>", "opts": [["A", "It has 12 valence electrons and an N═O double bond."], ["B", "It has 11 valence electrons and is an odd-electron species."], ["C", "It has 9 valence electrons and an N—O single bond."], ["D", "It has 10 valence electrons and an N≡O triple bond with one lone pair on each atom."]], "ans": "D", "exp": "<p>5 + 6 − 1 = 10 valence electrons, giving [:N≡O:]⁺ with one lone pair on each atom (Example 13.6f).<\/p>"}, {"n": 14, "stem": "<p>Which rule describes hydrogen in Lewis structures?<\/p>", "opts": [["A", "Hydrogen follows the octet rule."], ["B", "Hydrogen follows the duet rule, sharing two electrons."], ["C", "Hydrogen can exceed the octet rule using d orbitals."], ["D", "Hydrogen always carries one lone pair."]], "ans": "B", "exp": "<p>Hydrogen follows the duet rule: it is stable sharing two electrons (a filled 1s shell).<\/p>"}, {"n": 15, "stem": "<p>How many valence electrons are in PCl₄⁺?<\/p>", "opts": [["A", "34"], ["B", "33"], ["C", "32"], ["D", "31"]], "ans": "C", "exp": "<p>5 + 4(7) − 1 = 32 valence electrons (the + charge removes one).<\/p>"}]}, {"title": "Resonance", "qs": [{"n": 16, "stem": "<p>Experiments show that all three N—O bonds in the nitrate ion (NO₃⁻) are identical. Which description is correct?<\/p>", "opts": [["A", "The ion rapidly flips among three structures, each with one double bond."], ["B", "The actual structure is the average (superposition) of three resonance structures; each N—O bond is intermediate between a single and a double bond."], ["C", "The ion has three N═O double bonds."], ["D", "The ion has three N—O single bonds and a lone pair on N."]], "ans": "B", "exp": "<p>No single Lewis structure is correct. NO₃⁻ (24 electrons) is the average of three resonance structures, so all N—O bonds are equivalent and intermediate between single and double. The molecule does not flip between them.<\/p>"}, {"n": 17, "stem": "<p>How many valence electrons does the nitrite ion (NO₂⁻) have, and how many equivalent resonance structures are needed to describe it?<\/p>", "opts": [["A", "17 electrons; one structure"], ["B", "18 electrons; three structures"], ["C", "18 electrons; two structures"], ["D", "16 electrons; two structures"]], "ans": "C", "exp": "<p>5 + 2(6) + 1 = 18 valence electrons. After two N—O bonds, 14 remain. Two equivalent resonance structures (the double bond on either O) are needed, so each N—O bond is intermediate.<\/p>"}, {"n": 18, "stem": "<p>Which species requires resonance structures to describe its bonding?<\/p>", "opts": [["A", "O₃"], ["B", "CH₄"], ["C", "H₂O"], ["D", "NH₃"]], "ans": "A", "exp": "<p>O₃ (18 electrons) has two equivalent resonance structures, with the double bond on either side. CH₄, H₂O and NH₃ each have one Lewis structure.<\/p>"}, {"n": 19, "stem": "<p>Which statement about resonance structures is correct?<\/p>", "opts": [["A", "Resonance structures differ in the positions of the nuclei."], ["B", "Resonance is needed because the LE model assumes electrons are localized, while in reality electrons are delocalized."], ["C", "Equivalent Lewis structures contain different numbers of single and multiple bonds."], ["D", "The double-headed arrow shows the molecule switching back and forth between structures."]], "ans": "B", "exp": "<p>Resonance compensates for the LE model's assumption that electrons are localized. The nuclei stay in the same positions, only the electron placement differs. Equivalent structures have the same numbers of single and multiple bonds.<\/p>"}]}, {"title": "Exceptions to the Octet Rule", "qs": [{"n": 20, "stem": "<p>Why does BF₃ react very energetically with NH₃?<\/p>", "opts": [["A", "Boron has 10 electrons around it and must lose a pair."], ["B", "Fluorine has an incomplete octet in BF₃."], ["C", "Boron has only 6 electrons around it (electron-deficient) and accepts the lone pair on N to form H₃NBF₃."], ["D", "BF₃ is an odd-electron molecule."]], "ans": "C", "exp": "<p>BF₃ has 24 valence electrons. In the preferred structure B has only 6 electrons, so it is electron-deficient. It accepts nitrogen's lone pair to form H₃NBF₃, in which B has an octet.<\/p>"}, {"n": 21, "stem": "<p>Which element should always be assumed to obey (and never exceed) the octet rule?<\/p>", "opts": [["A", "N"], ["B", "P"], ["C", "S"], ["D", "Xe"]], "ans": "A", "exp": "<p>C, N, O and F (second row) always obey the octet rule. Their 2s and 2p orbitals hold only 8 electrons, so they never exceed it. P, S and Xe can exceed it.<\/p>"}, {"n": 22, "stem": "<p>In the Lewis structure of SF₆ (48 valence electrons), how many electrons surround the sulfur atom?<\/p>", "opts": [["A", "8"], ["B", "10"], ["C", "14"], ["D", "12"]], "ans": "D", "exp": "<p>Six S—F bonds use 12 electrons, and the six F octets use the other 36. S has 6 bonding pairs = 12 electrons, so it exceeds the octet rule.<\/p>"}, {"n": 23, "stem": "<p>The triiodide ion, I₃⁻, has 22 valence electrons. According to the text's rule, where are the extra electrons placed, and how many lone pairs are on the central I?<\/p>", "opts": [["A", "On a terminal I; 2 lone pairs on the central I"], ["B", "On the central I; 3 lone pairs on the central I"], ["C", "On the central I; 2 lone pairs on the central I"], ["D", "Split evenly between the terminal atoms; no lone pairs on the central I"]], "ans": "B", "exp": "<p>When one of several third-row-or-heavier atoms must exceed the octet, the text places the extra electrons on the central atom. 22 − 4 (bonds) − 12 (terminal lone pairs) = 6 electrons = 3 lone pairs on the central I.<\/p>"}, {"n": 24, "stem": "<p>Which molecule is an odd-electron molecule that the LE model does not handle in a natural way?<\/p>", "opts": [["A", "CO₂"], ["B", "N₂"], ["C", "O₃"], ["D", "NO"]], "ans": "D", "exp": "<p>NO has 5 + 6 = 11 valence electrons, an odd number. The LE model is based on electron pairs, so it does not handle odd-electron molecules naturally. (NO₂, with 17 electrons, is another example.)<\/p>"}, {"n": 25, "stem": "<p>In the hyperconjugation description of SF₆, four electron-pair bonds are spread over six S—F interactions. How much covalent bond does each S—F interaction have?<\/p>", "opts": [["A", "1/2 bond"], ["B", "3/2 bond"], ["C", "1 bond"], ["D", "2/3 bond"]], "ans": "D", "exp": "<p>4 electron-pair bonds ÷ 6 S—F interactions = 2/3 covalent bond per S—F interaction, plus ionic contributions (S +2, two F at −1 in each resonance structure).<\/p>"}, {"n": 26, "stem": "<p>In BeCl₂ (16 valence electrons), how many electrons surround the beryllium atom?<\/p>", "opts": [["A", "6"], ["B", "4"], ["C", "8"], ["D", "2"]], "ans": "B", "exp": "<p>BeCl₂ has 2 + 2(7) = 16 electrons. Two Be—Cl bonds (4 e⁻) plus three lone pairs on each Cl (12 e⁻) use all 16, leaving Be with 4 electrons. Be is electron-deficient.<\/p>"}]}, {"title": "Formal Charge", "qs": [{"n": 27, "stem": "<p>In the sulfate ion Lewis structure with four S—O single bonds (32 valence electrons), what are the formal charges on S and on each O?<\/p>", "opts": [["A", "S = 0; each O = −1/2"], ["B", "S = +2; each O = −1"], ["C", "S = −2; each O = 0"], ["D", "S = +6; each O = −2"]], "ans": "B", "exp": "<p>Formal charge = valence electrons − (lone-pair electrons + ½ shared electrons). S: 6 − (0 + ½·8) = +2. O: 6 − (6 + ½·2) = −1. Check: +2 + 4(−1) = −2, the ion's charge.<\/p>"}, {"n": 28, "stem": "<p>In the sulfate structure with two S═O double bonds and two S—O single bonds, what is the formal charge on S?<\/p>", "opts": [["A", "0"], ["B", "+2"], ["C", "+1"], ["D", "−2"]], "ans": "A", "exp": "<p>S: 6 − (0 + ½·12) = 0. Double-bonded O: 6 − (4 + 2) = 0. Single-bonded O: −1. Sum = 0 + 0 + 0 − 1 − 1 = −2. This structure has minimum formal charges but puts 12 electrons on S. The text notes that whether it or the octet structure is better is still disputed for third-row atoms.<\/p>"}, {"n": 29, "stem": "<p>In the Lewis structure [:N≡O:]⁺, what are the formal charges on N and O?<\/p>", "opts": [["A", "N = +1, O = 0"], ["B", "N = 0, O = 0"], ["C", "N = −1, O = +2"], ["D", "N = 0, O = +1"]], "ans": "D", "exp": "<p>N: 5 − (2 + ½·6) = 0. O: 6 − (2 + ½·6) = +1. Sum = +1, the ion's charge.<\/p>"}, {"n": 30, "stem": "<p>In the Lewis structure of XeO₃ with three Xe—O single bonds and one lone pair on Xe (26 valence electrons), what is the formal charge on Xe?<\/p>", "opts": [["A", "+3"], ["B", "0"], ["C", "+6"], ["D", "−1"]], "ans": "A", "exp": "<p>Xe: 8 − (2 + ½·6) = +3. Each O (three lone pairs, one bond): 6 − (6 + 1) = −1. Sum = +3 − 3 = 0. Check: 6 + 18 + 2 = 26 electrons.<\/p>"}, {"n": 31, "stem": "<p>Why is CO₂ arranged as O—C—O rather than C—O—O?<\/p>", "opts": [["A", "In O═C═O, the central carbon has a lone pair that stabilizes it."], ["B", "Structures with C—O—O can't hold 16 valence electrons."], ["C", "Carbon is more electronegative than oxygen, so it must be terminal."], ["D", "In O═C═O all formal charges are 0, while every C—O—O structure gives unreasonable formal charges, such as negative C next to positive O."]], "ans": "D", "exp": "<p>O═C═O: C = 4 − (0 + 4) = 0 and O = 6 − (4 + 2) = 0. C—O—O arrangements give unreasonable formal charges (e.g., C═O═O gives C −2, central O +2). A negative carbon next to a positive oxygen contradicts oxygen's greater electronegativity.<\/p>"}, {"n": 32, "stem": "<p>According to the text, which statement about choosing among nonequivalent Lewis structures using formal charge is correct?<\/p>", "opts": [["A", "For all molecules, including those with third-row central atoms, the structure with minimum formal charges is definitely the correct one."], ["B", "Formal charges are the actual charges on atoms and can be measured directly."], ["C", "For second-row atoms, the best structures have formal charges as close to zero as possible with any negative formal charges on the most electronegative atoms; for third-row and heavier atoms the situation is still unclear."], ["D", "Oxidation states are better than formal charges for judging Lewis structures."]], "ans": "C", "exp": "<p>The text's rules: for second-row atoms, formal charges should be as close to zero as possible, with any negative formal charges on the most electronegative atoms. For third-row or heavier atoms (e.g., sulfate) it says the dispute is unresolved. Formal charges are only estimates. Oxidation states exaggerate charge and are unsuitable for this.<\/p>"}]}, {"title": "Molecular Structure: The VSEPR Model", "qs": [{"n": 33, "stem": "<p>What is the molecular structure of NH₃?<\/p>", "opts": [["A", "Tetrahedral"], ["B", "Trigonal planar"], ["C", "T-shaped"], ["D", "Trigonal pyramid"]], "ans": "D", "exp": "<p>N has 3 bonding pairs and 1 lone pair: a tetrahedral arrangement of pairs. The name comes from the positions of the atoms, so the structure is a trigonal pyramid (bond angle 107°).<\/p>"}, {"n": 34, "stem": "<p>The bond angles in CH₄, NH₃, and H₂O are 109.5°, 107°, and 104.5°, respectively. What explains this trend?<\/p>", "opts": [["A", "Lone pairs require more room than bonding pairs and compress the angles between bonding pairs."], ["B", "Bonding pairs require more room than lone pairs."], ["C", "Hydrogen atoms repel each other more strongly in H₂O."], ["D", "Lone pairs occupy less space because they are attached to only one nucleus."]], "ans": "A", "exp": "<p>Lone pairs (0, 1, 2) increase from CH₄ to H₂O. A lone pair is held near only one nucleus, so it takes more space and squeezes the bonding pairs together.<\/p>"}, {"n": 35, "stem": "<p>What is the molecular structure of XeF₄, and does it have a dipole moment?<\/p>", "opts": [["A", "Octahedral; no dipole moment"], ["B", "Tetrahedral; dipole moment"], ["C", "Square planar; no dipole moment"], ["D", "See-saw; dipole moment"]], "ans": "C", "exp": "<p>Xe: 8 + 4(7) = 36 electrons. 36 − 8 − 24 = 4, so 2 lone pairs. Six pairs give an octahedral arrangement, and the lone pairs sit 180° apart, so the structure is square planar. The polar Xe—F bonds cancel, so there is no dipole moment.<\/p>"}, {"n": 36, "stem": "<p>What is the molecular structure of SO₂, and does it have a dipole moment?<\/p>", "opts": [["A", "Linear (180°); no dipole moment"], ["B", "V-shaped (about 120°); dipole moment"], ["C", "Trigonal planar; no dipole moment"], ["D", "V-shaped (about 104.5°); no dipole moment"]], "ans": "B", "exp": "<p>SO₂ has 18 electrons. S has one lone pair, one single bond and one double bond (counted as one pair), so 3 effective pairs in a trigonal planar arrangement. The molecule is V-shaped, about 120° (no distortion at 120°). The bond dipoles don't cancel, so it has a dipole moment.<\/p>"}, {"n": 37, "stem": "<p>ClF₃ has 28 valence electrons. What is its molecular structure?<\/p>", "opts": [["A", "Trigonal planar"], ["B", "Trigonal pyramid"], ["C", "See-saw"], ["D", "T-shaped"]], "ans": "D", "exp": "<p>Cl: 28 − 6 (bonds) − 18 (F lone pairs) = 4, so 2 lone pairs on Cl. 5 pairs give a trigonal bipyramid. Three bonded atoms and two lone pairs (equatorial) give a T shape.<\/p>"}, {"n": 38, "stem": "<p>SF₄ has 34 valence electrons. What is its molecular structure?<\/p>", "opts": [["A", "See-saw"], ["B", "Tetrahedral"], ["C", "Square planar"], ["D", "Trigonal pyramid"]], "ans": "A", "exp": "<p>34 − 8 − 24 = 2, so 1 lone pair on S. 5 pairs (4 bonding + 1 lone) in a trigonal bipyramid give a see-saw (AB₄) structure.<\/p>"}, {"n": 39, "stem": "<p>In the solid state, PCl₅ exists as PCl₄⁺ and PCl₆⁻ ions. What are their molecular structures?<\/p>", "opts": [["A", "PCl₄⁺ square planar; PCl₆⁻ trigonal prismatic"], ["B", "PCl₄⁺ see-saw; PCl₆⁻ trigonal bipyramidal"], ["C", "PCl₄⁺ trigonal pyramid; PCl₆⁻ square pyramid"], ["D", "PCl₄⁺ tetrahedral; PCl₆⁻ octahedral"]], "ans": "D", "exp": "<p>PCl₄⁺: 5 + 28 − 1 = 32 electrons, 4 bonding pairs and no lone pairs on P, so tetrahedral. PCl₆⁻: 5 + 42 + 1 = 48 electrons, 6 bonding pairs, so octahedral (Example 13.12).<\/p>"}, {"n": 40, "stem": "<p>In VSEPR, how is a double bond in NO₃⁻ counted, and what shape results?<\/p>", "opts": [["A", "As one effective pair; trigonal planar with 120° bond angles"], ["B", "As two pairs; trigonal bipyramidal"], ["C", "As two pairs; tetrahedral with 109.5° angles"], ["D", "As one effective pair; trigonal pyramid with 107° angles"]], "ans": "A", "exp": "<p>Multiple bonds count as one effective pair. N in NO₃⁻ has 3 effective pairs, so it is trigonal planar with 120° angles, as observed. Any one resonance structure can be used.<\/p>"}, {"n": 41, "stem": "<p>The text says a trigonal bipyramidal arrangement of electron pairs has two different angles between adjacent pairs. What are they?<\/p>", "opts": [["A", "109.5° only"], ["B", "90° only"], ["C", "90° and 120°"], ["D", "109.5° and 180°"]], "ans": "C", "exp": "<p>A trigonal bipyramid (five pairs) has two different angles between adjacent pairs, 90° (axial–equatorial) and 120° (equatorial–equatorial). (The two axial pairs are 180° apart, but they are not adjacent.)<\/p>"}, {"n": 42, "stem": "<p>Phosphine (PH₃) has a Lewis structure like that of NH₃. What does experiment show, and what does it illustrate?<\/p>", "opts": [["A", "The H—P—H angles are about 107°, confirming VSEPR exactly."], ["B", "The H—P—H angles are 94°, a case where the simple VSEPR model fails."], ["C", "PH₃ is trigonal planar with 120° angles."], ["D", "PH₃ is tetrahedral with 109.5° angles."]], "ans": "B", "exp": "<p>VSEPR predicts about 107° (like NH₃), but the measured angle is 94°. This is an example of a simple model having exceptions.<\/p>"}]}], "count": 42, "cards": 68}];
const COLORS = [1,2,3,4,5].map(k => [`var(--g${k})`, `var(--g${k}-soft)`]);
const QUIZLET = {
  '7-8':   'https://quizlet.com/1167794903/mya-chem-lectures-7-8-flash-cards/',
  '9-10':  'https://quizlet.com/1226874419/mya-chem-lectures-9-10-flash-cards/',
  '11':    'https://quizlet.com/1226999150/mya-chem-lecture-11-flash-cards/',
  'ch12':  'https://quizlet.com/1227000035/mya-chem-chapter-12-flash-cards/',
  'ch13':  'https://quizlet.com/1227000552/mya-chem-chapter-13-flash-cards/'
};
const icon = (id, cls='i') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const state = store.get('mya-chem-v2', null) || store.get('chem713', {tab:0, mode:'instant', groups:{}});
if(!(state.tab >= 0 && state.tab < DATA.length)) state.tab = 0;
state.groups ||= {};
DATA.forEach(g => { state.groups[g.slug] ??= {answers:{}, submitted:false, filter:'all', order:null}; });
const save = () => store.set('mya-chem-v2', state);
let fresh = null; // question number whose explanation was just revealed

const themeBtn = document.getElementById('theme');
const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
const applyTheme = t => {
  if(t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  themeBtn.innerHTML = icon(isDark() ? 'sun' : 'moon');
};
applyTheme(store.get('mya-chem-theme', store.get('chem713-theme', null)));
themeBtn.onclick = () => { const next = isDark() ? 'light' : 'dark'; applyTheme(next); store.set('mya-chem-theme', next); };

const tabs = document.getElementById('tabs');
DATA.forEach((g, i) => {
  const b = document.createElement('button');
  b.setAttribute('role','tab'); b.style.setProperty('--gc', COLORS[i][0]);
  const short = g.name.replace(/^Lectures? /, 'L ').replace(/^Chapter /, 'Ch ');
  b.innerHTML = `<span class="dot"></span><span class="full">${g.name}</span><span class="short">${short}</span><small>${g.count}</small>`;
  b.onclick = () => {
    if(state.tab === i) return;
    state.scroll ||= {}; state.scroll[DATA[state.tab].slug] = Math.round(scrollY);
    state.tab = i; save(); fresh = null; render();
    scrollTo(0, state.scroll[g.slug] || 0);
  };
  tabs.appendChild(b);
});

const allQs = g => g.sections.flatMap(s => s.qs);
function graded(gs, q){
  const a = gs.answers[q.n];
  if(!a || (state.mode === 'exam' && !gs.submitted)) return null;
  return a === q.ans;
}
const subtitle = g => g.title.replace(/^Lectures?\s[\d–-]+\s*(Practice Problems)?[:\s–-]*/i,'') || 'Practice problems';

function render(){
  const i = state.tab, g = DATA[i], gs = state.groups[g.slug];
  [...tabs.children].forEach((b, j) => b.setAttribute('aria-selected', j === i));
  tabs.children[i].scrollIntoView({block:'nearest', inline:'nearest'});
  const root = document.documentElement;
  root.style.setProperty('--gc', COLORS[i][0]); root.style.setProperty('--gc-soft', COLORS[i][1]);
  const exam = state.mode === 'exam';
  const main = document.getElementById('main');
  main.innerHTML = `
    <section class="intro">
      <h2 class="serif">${g.name}</h2>
      <p>${subtitle(g)}</p>
      <div class="meta">
        <a class="quizlet" href="${QUIZLET[g.slug]}" target="_blank" rel="noopener">${icon('book')}Study flashcards on Quizlet${icon('ext')}</a>
        <span class="counts"><b>${g.cards}</b> flashcards · <b>${g.count}</b> practice problems</span>
      </div>
      ${g.intro.trim() ? `<details class="ref"><summary>Formulas and constants${icon('chev','i chev')}</summary><div class="body">${g.intro}</div></details>` : ''}
    </section>
    <div class="bar">
      <div class="controls">
        <div class="seg" role="group" aria-label="Quiz mode">
          <button data-mode="instant" aria-pressed="${!exam}">Instant feedback</button>
          <button data-mode="exam" aria-pressed="${exam}">Exam mode</button>
        </div>
        <div class="seg" role="group" aria-label="Filter questions">
          <button data-f="all" aria-pressed="${gs.filter==='all'}">All</button>
          <button data-f="open" aria-pressed="${gs.filter==='open'}">Unanswered</button>
          <button data-f="missed" aria-pressed="${gs.filter==='missed'}">Missed</button>
        </div>
        <div class="tools">
          <button class="tool" id="shuffle" aria-pressed="${!!gs.order}" title="Shuffle question order">${icon('shuffle')}<span>Shuffle</span></button>
          <button class="tool" id="reset" title="Clear answers for this group">${icon('reset')}<span>Reset</span></button>
        </div>
      </div>
      <div class="prog" id="prog"></div>
      <div class="stats" id="stats"></div>
    </div>
    <div id="qs"></div>
    ${exam && !gs.submitted ? `<div class="submit"><button class="quizlet" id="submit">Submit and grade</button></div>` : ''}`;
  root.style.setProperty('--hh', document.querySelector('header').offsetHeight + 'px');

  main.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    if(state.mode === b.dataset.mode) return;
    state.mode = b.dataset.mode;
    DATA.forEach(x => { state.groups[x.slug].submitted = false; });
    fresh = null; save(); render();
  });
  main.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { gs.filter = b.dataset.f; fresh = null; save(); render(); });
  main.querySelector('#reset').onclick = () => {
    if(!confirm(`Clear all answers for ${g.name}?`)) return;
    gs.answers = {}; gs.submitted = false; fresh = null; save(); render();
  };
  main.querySelector('#shuffle').onclick = () => {
    if(gs.order) gs.order = null;
    else { const ns = allQs(g).map(q => q.n); for(let k = ns.length - 1; k > 0; k--){ const r = Math.floor(Math.random()*(k+1)); [ns[k], ns[r]] = [ns[r], ns[k]]; } gs.order = ns; }
    fresh = null; save(); render();
  };
  const sub = main.querySelector('#submit');
  if(sub) sub.onclick = () => {
    const left = g.count - Object.keys(gs.answers).length;
    if(left && !confirm(`${left} question${left > 1 ? 's' : ''} unanswered. Submit anyway?`)) return;
    gs.submitted = true; fresh = null; save(); render(); scrollTo({top:0, behavior:'smooth'});
  };
  drawQs(g, gs); drawStats(g, gs);
}

function drawStats(g, gs){
  let right = 0, wrong = 0;
  allQs(g).forEach(q => { const r = graded(gs, q); if(r === true) right++; else if(r === false) wrong++; });
  const answered = Object.keys(gs.answers).length, p = document.getElementById('prog'), s = document.getElementById('stats');
  if(state.mode === 'exam' && !gs.submitted){
    p.innerHTML = `<i class="a" style="width:${answered/g.count*100}%"></i>`;
    s.innerHTML = `<span><b>${answered}</b> of ${g.count} answered</span><span>Graded when you submit</span>`;
  } else {
    p.innerHTML = `<i class="g" style="width:${right/g.count*100}%"></i><i class="b" style="width:${wrong/g.count*100}%"></i>`;
    const pct = right + wrong ? Math.round(right/(right+wrong)*100) : 0;
    s.innerHTML = `<span><b class="s-good">${right}</b> correct · <b class="s-bad">${wrong}</b> missed · <b>${g.count - right - wrong}</b> left</span>`
      + `<span>${gs.submitted ? `Final <b>${right}/${g.count}</b> · ` : ''}Accuracy <b>${pct}%</b></span>`;
  }
}

function drawQs(g, gs){
  const box = document.getElementById('qs');
  const secs = gs.order
    ? [{title:'Shuffled order', qs: gs.order.map(n => allQs(g).find(q => q.n === n)).filter(Boolean)}]
    : g.sections;
  let html = '';
  secs.forEach(s => {
    const qs = s.qs.filter(q => gs.filter === 'open' ? !gs.answers[q.n] : gs.filter === 'missed' ? graded(gs, q) === false : true);
    if(!qs.length) return;
    if(s.title) html += `<h3 class="sec serif">${s.title}</h3>`;
    qs.forEach(q => { html += qHTML(gs, q); });
  });
  box.innerHTML = html || `<div class="empty">${gs.filter === 'missed' ? 'No missed questions in this group.' : 'Every question in this group is answered.'}</div>`;
  box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const n = +b.dataset.n;
    if(state.mode === 'instant' ? gs.answers[n] : gs.submitted) return;
    gs.answers[n] = b.dataset.l; fresh = n; save();
    const y = b.getBoundingClientRect().top;
    drawQs(g, gs); drawStats(g, gs);
    const nb = box.querySelector(`.opt[data-n="${n}"]`);
    if(nb) scrollBy(0, nb.getBoundingClientRect().top - y);
  });
}

function qHTML(gs, q){
  const a = gs.answers[q.n], r = graded(gs, q), done = r !== null;
  const locked = state.mode === 'instant' ? !!a : gs.submitted;
  const showExp = done || (state.mode === 'exam' && gs.submitted);
  const opts = q.opts.map(([L, t]) => {
    let c = '', mk = '';
    if(showExp){ if(L === q.ans){ c = 'ok'; mk = icon('check','i mk'); } else if(L === a){ c = 'no'; mk = icon('x','i mk'); } }
    else if(L === a) c = 'sel';
    return `<button class="opt ${c}" data-n="${q.n}" data-l="${L}" ${locked ? 'disabled' : ''}><span class="L">${L}</span><span class="t">${t}</span>${mk}</button>`;
  }).join('');
  const verdict = r === true ? 'Correct.' : r === false ? `Not quite. The answer is ${q.ans}.` : `Answer: ${q.ans}.`;
  const exp = showExp ? `<div class="exp${fresh === q.n ? ' fresh' : ''}"><span class="v">${verdict}</span>${q.exp.replace(/^<p>/, '<p style="display:inline">')}</div>` : '';
  return `<article class="q ${r === true ? 'right' : r === false ? 'wrong' : ''}"><div class="stem"><span class="qn">${q.n}.</span>${q.stem}</div><div class="opts">${opts}</div>${exp}</article>`;
}

render();
// Remember where you were in each tab, so a reopened page lands in the same spot.
state.scroll ||= {};
requestAnimationFrame(() => scrollTo(0, state.scroll[DATA[state.tab].slug] || 0));
let scrollTimer;
addEventListener('scroll', () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => { state.scroll[DATA[state.tab].slug] = Math.round(scrollY); save(); }, 200);
}, {passive:true});
</script>
</body>
</html>
