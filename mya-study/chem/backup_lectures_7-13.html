<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chem Lectures 7–13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(97.6% 0.006 85); --surface:oklch(99.4% 0.003 85); --sunken:oklch(94.6% 0.008 85);
  --text:oklch(23% 0.012 260); --muted:oklch(48% 0.014 260); --line:oklch(89% 0.009 85); --line-strong:oklch(80% 0.012 85);
  --good:oklch(50% 0.12 155); --good-soft:oklch(95% 0.035 155);
  --bad:oklch(52% 0.16 25); --bad-soft:oklch(95.5% 0.03 25);
  --g1:oklch(48% 0.11 250); --g1-soft:oklch(94.5% 0.025 250);
  --g2:oklch(48% 0.12 305); --g2-soft:oklch(94.5% 0.03 305);
  --g3:oklch(52% 0.12 55);  --g3-soft:oklch(95% 0.03 55);
  --on-accent:oklch(99% 0.003 85);
  --shadow:0 1px 2px oklch(30% 0.02 260 / .06), 0 4px 14px oklch(30% 0.02 260 / .05);
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:oklch(18.5% 0.01 260); --surface:oklch(22% 0.011 260); --sunken:oklch(16% 0.01 260);
    --text:oklch(93% 0.006 85); --muted:oklch(70% 0.012 260); --line:oklch(29% 0.012 260); --line-strong:oklch(38% 0.014 260);
    --good:oklch(76% 0.13 155); --good-soft:oklch(29% 0.05 155);
    --bad:oklch(74% 0.13 25); --bad-soft:oklch(30% 0.06 25);
    --g1:oklch(76% 0.1 250); --g1-soft:oklch(29% 0.045 250);
    --g2:oklch(76% 0.1 305); --g2-soft:oklch(29% 0.05 305);
    --g3:oklch(79% 0.11 60);  --g3-soft:oklch(30% 0.045 60);
    --on-accent:oklch(18% 0.01 260);
    --shadow:0 1px 2px oklch(0% 0 0 / .3), 0 6px 18px oklch(0% 0 0 / .25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:oklch(18.5% 0.01 260); --surface:oklch(22% 0.011 260); --sunken:oklch(16% 0.01 260);
  --text:oklch(93% 0.006 85); --muted:oklch(70% 0.012 260); --line:oklch(29% 0.012 260); --line-strong:oklch(38% 0.014 260);
  --good:oklch(76% 0.13 155); --good-soft:oklch(29% 0.05 155);
  --bad:oklch(74% 0.13 25); --bad-soft:oklch(30% 0.06 25);
  --g1:oklch(76% 0.1 250); --g1-soft:oklch(29% 0.045 250);
  --g2:oklch(76% 0.1 305); --g2-soft:oklch(29% 0.05 305);
  --g3:oklch(79% 0.11 60);  --g3-soft:oklch(30% 0.045 60);
  --on-accent:oklch(18% 0.01 260);
  --shadow:0 1px 2px oklch(0% 0 0 / .3), 0 6px 18px oklch(0% 0 0 / .25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scrollbar-color:var(--line-strong) transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 "Instrument Sans",ui-sans-serif,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:var(--gc-soft,var(--g1-soft));color:var(--text)}
:focus-visible{outline:2px solid var(--gc,var(--g1));outline-offset:2px;border-radius:8px}
.serif{font-family:Newsreader,Georgia,serif}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}

header{position:sticky;top:0;z-index:5;background:color-mix(in oklch,var(--bg) 92%,transparent);backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
.brand{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.iconbtn:hover{color:var(--text);border-color:var(--line-strong)}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;margin-bottom:12px;background:var(--sunken);border-radius:12px}
nav button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:8px 6px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .25s var(--ease),color .25s var(--ease)}
nav button:hover{color:var(--text)}
nav button .dot{width:8px;height:8px;border-radius:50%;background:var(--gc)}
nav button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
nav small{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}

main{padding:36px 0 96px}
.intro h2{font-size:clamp(30px,6vw,42px);line-height:1.1;letter-spacing:-.02em;margin:0 0 8px;font-weight:600}
.intro p{margin:0;color:var(--muted);max-width:62ch;font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:22px 0 0}
.quizlet{display:inline-flex;align-items:center;gap:8px;background:var(--gc);color:var(--on-accent);text-decoration:none;font-weight:600;padding:10px 16px;border-radius:10px;transition:transform .2s var(--ease),filter .2s}
.quizlet:hover{filter:brightness(1.08)}
.quizlet:active{transform:translateY(1px)}
.counts{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.counts b{color:var(--text);font-weight:600}

details.ref{margin:28px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.ref summary{list-style:none;cursor:pointer;padding:12px 16px;font-weight:600;display:flex;align-items:center;gap:10px}
details.ref summary::-webkit-details-marker{display:none}
details.ref summary .chev{margin-left:auto;transition:transform .3s var(--ease);color:var(--muted)}
details.ref[open] summary .chev{transform:rotate(180deg)}
details.ref .body{padding:0 16px 14px;font-size:15px;max-width:72ch}
details.ref h4{margin:6px 0 6px;font-size:13px;font-weight:600;color:var(--muted)}
details.ref h4 + .flist{margin-bottom:14px}
.flist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.flist li{padding:8px 12px;font-variant-numeric:tabular-nums}
.flist li + li{border-top:1px solid var(--line)}
.flist li:nth-child(even){background:var(--sunken)}

.bar{position:sticky;top:var(--hh,112px);z-index:4;background:var(--bg);padding:16px 0 14px;margin:20px 0 4px;border-bottom:1px solid var(--line)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;padding:3px;background:var(--sunken);border-radius:10px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:500;padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.tools{display:flex;gap:6px}
.tool{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:14px;font-weight:500;padding:6px 11px;border-radius:9px;cursor:pointer}
.tool:hover{border-color:var(--line-strong)}
.tool[aria-pressed="true"]{border-color:var(--gc);color:var(--gc)}
.prog{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden;display:flex;margin-top:14px}
.prog i{display:block;height:100%;transition:width .5s var(--ease)}
.prog .g{background:var(--good)} .prog .b{background:var(--bad)} .prog .a{background:var(--gc)}
.stats{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;font-size:14px;margin-top:8px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--text);font-weight:600}
.stats .s-good{color:var(--good)} .stats .s-bad{color:var(--bad)}

h3.sec{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:44px 0 14px;line-height:1.25}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:14px;transition:border-color .3s var(--ease)}
.q.right{border-color:color-mix(in oklch,var(--good) 55%,var(--line))}
.q.wrong{border-color:color-mix(in oklch,var(--bad) 55%,var(--line))}
.stem{max-width:70ch;font-size:16.5px}
.stem p{margin:10px 0 0} .stem .qn + p{display:inline;margin:0}
.qn{font-weight:700;color:var(--gc);margin-right:6px;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;font-size:15.5px;cursor:pointer;transition:border-color .2s var(--ease),background .2s var(--ease)}
.opt:hover:not(:disabled){border-color:var(--gc);background:var(--gc-soft)}
.opt .L{display:inline-grid;place-items:center;flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line-strong);font-size:13px;font-weight:700;color:var(--muted)}
.opt .t{padding-top:1px}
.opt .mk{margin-left:auto;align-self:center}
.opt.sel{border-color:var(--gc);background:var(--gc-soft)}
.opt.sel .L{background:var(--gc);border-color:var(--gc);color:var(--on-accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .L{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.opt.ok .mk{color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .L{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.opt.no .mk{color:var(--bad)}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.no){opacity:.7}
.exp{margin-top:14px;padding:14px 16px;border-radius:10px;background:var(--sunken);font-size:15px;max-width:72ch}
.exp.fresh{animation:reveal .45s var(--ease) both}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.exp p{margin:0 0 6px} .exp p:last-child{margin:0}
.exp .v{font-weight:700;margin-right:4px}
.right .exp .v{color:var(--good)} .wrong .exp .v{color:var(--bad)}
table{border-collapse:collapse;margin:10px 0;font-size:14px;display:block;overflow-x:auto;font-variant-numeric:tabular-nums}
td,th{border:1px solid var(--line);padding:5px 10px;text-align:left}
th{background:var(--sunken);font-weight:600}
code{background:var(--sunken);padding:1px 5px;border-radius:5px;font-size:.92em}
.submit{margin-top:28px;display:flex;justify-content:center}
.empty{color:var(--muted);text-align:center;padding:48px 16px;border:1px dashed var(--line-strong);border-radius:14px;margin-top:20px}
@media (max-width:620px){
  main{padding-top:26px}
  .bar{position:static}
  nav small{display:none}
  .q{padding:16px}
  .controls{gap:8px}
  .seg button{padding:6px 9px}
  .tool span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

      <p class="brand serif">General Chemistry · Lectures 7–13</p>
      <button class="iconbtn" id="theme" aria-label="Toggle light or dark theme"><svg class="i"><use href="#i-moon"/></svg></button>

<script>
const DATA = [{"slug": "7-8", "name": "Lectures 7–8", "title": "Lewis structures, formal charge, resonance and the octet rule", "intro": "<h4>Formulas<\/h4><ul class='flist'><li>Formal charge = group valence − lone-pair electrons − number of bonds<\/li><li>Electron count on A (counting up) = valence e⁻ of A + bonds − formal charge<\/li><li>Nonbonding electrons on A (counting down) = valence e⁻ of A − bonds − formal charge<\/li><li>Bond order = shared electron pairs between two atoms, averaged over resonance structures<\/li><li>Sum of formal charges = overall charge of the species<\/li><li>Apparent electron count of hypervalent ABₙ = valence e⁻ of A + number of single bonds<\/li><\/ul><h4>Conventions<\/h4><ul class='flist'><li>Double bond counts as 2 bonds, triple bond as 3 bonds<\/li><li>Valence electrons = old group number (I–VIII) = last digit of new group number<\/li><li>Octet rule: 8 e⁻<\/li><li>Duet rule (H): 2 e⁻<\/li><li>Transition elements: 18 e⁻<\/li><\/ul>", "sections": [{"title": "Part 1: Lecture 7 (Valence Electrons, Lewis Diagrams, Dative Bonds, Formal Charge)", "qs": [{"n": 1, "stem": "<p>How many valence electrons does a sulfur atom (old Group VI, new Group 16) have?<\/p>", "opts": [["A", "2"], ["B", "4"], ["C", "6"], ["D", "16"]], "ans": "C", "exp": "<p>Sulfur is in old Group VI (new Group 16), and the number of valence electrons equals the old group number (last digit of the new group number), so 6.<\/p>"}, {"n": 2, "stem": "<p>How many core electrons does a chlorine atom (Z = 17) have?<\/p>", "opts": [["A", "7"], ["B", "10"], ["C", "17"], ["D", "18"]], "ans": "B", "exp": "<p>Core electrons correspond to the previous noble gas, [Ne] = 10. Equivalently 17 total − 7 valence = 10.<\/p>"}, {"n": 3, "stem": "<p>Which atom is valence isoelectronic with oxygen?<\/p>", "opts": [["A", "N"], ["B", "F"], ["C", "Ne"], ["D", "S"]], "ans": "D", "exp": "<p>S is in the same group as O, so both have 6 valence electrons (valence isoelectronic).<\/p>"}, {"n": 4, "stem": "<p>Which electron-counting rule applies to the transition elements?<\/p>", "opts": [["A", "The duet rule"], ["B", "The octet rule"], ["C", "The 18 electron rule"], ["D", "The sextet rule"]], "ans": "C", "exp": "<p>Hydrogen follows the duet rule and transition elements follow the 18 electron rule.<\/p>"}, {"n": 5, "stem": "<p>Who popularized Lewis' ideas by introducing the terms \"covalent bond\" and \"octet theory\"?<\/p>", "opts": [["A", "Langmuir"], ["B", "Lewis"], ["C", "Musher"], ["D", "Zumdahl"]], "ans": "A", "exp": "<p>Langmuir introduced the terms \"covalent bond\" and \"octet theory\" and popularized Lewis' concepts.<\/p>"}, {"n": 6, "stem": "<p>How many lone pairs are on the central atom of CH4, NH3, H2O and HF, in that order?<\/p>", "opts": [["A", "4, 3, 2, 1"], ["B", "0, 0, 2, 3"], ["C", "1, 1, 2, 2"], ["D", "0, 1, 2, 3"]], "ans": "D", "exp": "<p>C forms 4 bonds (0 LP), N 3 bonds (1 LP), O 2 bonds (2 LP), F 1 bond (3 LP). Lone pairs emerge as you move right from carbon.<\/p>"}, {"n": 7, "stem": "<p>Which statement best describes boron in BH3?<\/p>", "opts": [["A", "Boron has an octet and one lone pair."], ["B", "Boron has a sextet and an empty orbital, so BH3 is hypovalent and highly reactive."], ["C", "Boron has a sextet, and BH3 readily adds two more H atoms to form stable BH5."], ["D", "Boron has 8 electrons because each H contributes two electrons."]], "ans": "B", "exp": "<p>B has 3 valence electrons, forms 3 bonds, and has 3 + 3 = 6 electrons (a sextet) with an empty orbital. BH3 is highly reactive and reacts to gain an octet, not to form BH5.<\/p>"}, {"n": 8, "stem": "<p>A dative (coordinate covalent) bond is a bond in which:<\/p>", "opts": [["A", "both shared electrons come from the same atom."], ["B", "each atom contributes one electron to the shared pair."], ["C", "electrons are completely transferred from one atom to the other."], ["D", "two pairs of electrons are shared between the same two atoms."]], "ans": "A", "exp": "<p>In a dative bond a single atom (the donor) supplies both electrons, e.g. the N lone pair in H3N–BH3.<\/p>"}, {"n": 9, "stem": "<p>In the adduct H3N–BH3 drawn with a line (not an arrow), what are the formal charges on N and B?<\/p>", "opts": [["A", "N = 0, B = 0"], ["B", "N = −1, B = +1"], ["C", "N = +1, B = −1"], ["D", "N = +1, B = +1"]], "ans": "C", "exp": "<p>N: 5 − 0 − 4 = +1. B: 3 − 0 − 4 = −1.<\/p>"}, {"n": 10, "stem": "<p>In the reaction NH3 + BH3 → H3N–BH3, which species is the Lewis acid?<\/p>", "opts": [["A", "NH3, because it donates an electron pair"], ["B", "BH3, because it accepts an electron pair"], ["C", "NH3, because it accepts an electron pair"], ["D", "BH3, because it donates an electron pair"]], "ans": "B", "exp": "<p>A Lewis acid accepts an electron pair. BH3 accepts the lone pair donated by NH3 (the Lewis base).<\/p>"}, {"n": 11, "stem": "<p>What is the formal charge on oxygen in the hydronium ion, [H3O]⁺ (three O–H bonds, one lone pair)?<\/p>", "opts": [["A", "−1"], ["B", "0"], ["C", "+2"], ["D", "+1"]], "ans": "D", "exp": "<p>Formal charge = 6 − 2 (one lone pair) − 3 bonds = +1.<\/p>"}, {"n": 12, "stem": "<p>In the Lewis structure of carbon monoxide (C≡O with one lone pair on each atom), what is the formal charge on carbon?<\/p>", "opts": [["A", "−1"], ["B", "0"], ["C", "+1"], ["D", "−2"]], "ans": "A", "exp": "<p>C has 1 lone pair (2 electrons) and 3 bonds: 4 − 2 − 3 = −1. (O: 6 − 2 − 3 = +1.)<\/p>"}, {"n": 13, "stem": "<p>Which statement about CO is correct according to the lecture?<\/p>", "opts": [["A", "CO has no formal charges, exactly like N2."], ["B", "Carbon is the negative end of the CO dipole, even though oxygen is more electronegative."], ["C", "Oxygen has a negative formal charge in CO."], ["D", "Like N2, CO is cleaved by H2 to give CH3 and OH3."]], "ans": "B", "exp": "<p>The lecture notes that carbon is the negative end of the CO dipole even though O is more electronegative. CO has formal charges (C⁻, O⁺) and is not cleaved by H2 the way N2 is.<\/p>"}, {"n": 14, "stem": "<p>Which statement about formal charges is correct?<\/p>", "opts": [["A", "Formal charges are the real charges on atoms and give the electron distribution."], ["B", "Formal charges should be left out of Lewis structures because they are not real."], ["C", "A positive formal charge always means the atom is electron poor."], ["D", "Formal charges are a bookkeeping device and are not real charges."]], "ans": "D", "exp": "<p>Formal charges are not real charges and do not describe the electron distribution. They are bookkeeping, but they still must be shown in Lewis structures.<\/p>"}, {"n": 15, "stem": "<p>Using electron count = valence electrons + number of bonds − formal charge, what is the electron count on boron in [BH4]⁻?<\/p>", "opts": [["A", "6"], ["B", "7"], ["C", "8"], ["D", "9"]], "ans": "C", "exp": "<p>3 + 4 − (−1) = 8.<\/p>"}, {"n": 16, "stem": "<p>How many nonbonding (lone pair) electrons are on oxygen in [H3O]⁺?<\/p>", "opts": [["A", "0"], ["B", "2"], ["C", "4"], ["D", "6"]], "ans": "B", "exp": "<p>Nonbonding electrons = 6 − 3 − (+1) = 2, which is one lone pair.<\/p>"}, {"n": 17, "stem": "<p>What is the formal charge on nitrogen in the amide ion, [NH2]⁻ (two N–H bonds and two lone pairs on N)?<\/p>", "opts": [["A", "−1"], ["B", "0"], ["C", "+1"], ["D", "−2"]], "ans": "A", "exp": "<p>5 − 4 (two lone pairs) − 2 bonds = −1. Check: electron count = 5 + 2 − (−1) = 8.<\/p>"}, {"n": 18, "stem": "<p>What are the common valences (number of bonds for zero formal charge) of N, O and Cl, respectively?<\/p>", "opts": [["A", "5, 6, 7"], ["B", "3, 2, 2"], ["C", "1, 2, 3"], ["D", "3, 2, 1"]], "ans": "D", "exp": "<p>From the hydrides NH3, H2O and HCl, the common valences are N 3, O 2 and Cl 1.<\/p>"}, {"n": 19, "stem": "<p>In the cyanide ion, [C≡N]⁻ (one lone pair on C and one on N), what are the formal charges on C and N?<\/p>", "opts": [["A", "C = 0, N = −1"], ["B", "C = −1, N = 0"], ["C", "C = +1, N = −2"], ["D", "C = −1, N = −1"]], "ans": "B", "exp": "<p>C: 4 − 2 − 3 = −1. N: 5 − 2 − 3 = 0. Sum = −1, which matches the ion's charge.<\/p>"}, {"n": 20, "stem": "<p>Elements to the left of carbon (such as B) in their simple hydrides tend to have ______, while elements to the right of carbon (N, O, F) have ______.<\/p>", "opts": [["A", "lone pairs; empty orbitals"], ["B", "expanded octets; sextets"], ["C", "empty orbitals; lone pairs (filled orbitals)"], ["D", "empty orbitals; expanded octets"]], "ans": "C", "exp": "<p>Elements left of C (e.g. B in BH3) have empty orbitals. Elements right of C have filled orbitals, i.e. lone pairs.<\/p>"}]}, {"title": "Part 2: Lecture 8 (Drawing Rules, Resonance, Breakdown of the Octet Rule)", "qs": [{"n": 21, "stem": "<p>An oxygen atom with three bonds and one lone pair carries what formal charge?<\/p>", "opts": [["A", "−1"], ["B", "+1"], ["C", "0"], ["D", "+2"]], "ans": "B", "exp": "<p>6 − 2 − 3 = +1. This is the O⁺ motif, isoelectronic with neutral N.<\/p>"}, {"n": 22, "stem": "<p>Using the \"isoelectronic relationships\" on the common-motifs slide (same arrangement of bonds and lone pairs), which motif is isoelectronic with a neutral, four-bonded carbon atom?<\/p>", "opts": [["A", "N with 3 bonds and 1 lone pair"], ["B", "O with 2 bonds and 2 lone pairs"], ["C", "N⁺ with 4 bonds and no lone pairs"], ["D", "C⁻ with 3 bonds and 1 lone pair"]], "ans": "C", "exp": "<p>N⁺ with 4 bonds is isoelectronic with neutral C with 4 bonds, and so is B⁻ with 4 bonds. Choices A and D (3 bonds + 1 lone pair) match the C⁻/N/O⁺ series, and B matches N⁻/O, not four-bonded C. (Every one of these motifs has an octet, so \"same number of bonds and lone pairs\" is what distinguishes them.)<\/p>"}, {"n": 23, "stem": "<p>Following the lecture rules for [NO3]⁻, the trial structure has three N=O double bonds and the −1 charge on N. What is the electron count on N in this trial structure?<\/p>", "opts": [["A", "8"], ["B", "10"], ["C", "11"], ["D", "12"]], "ans": "D", "exp": "<p>Electron count = 5 + 6 bonds (three double bonds) − (−1) = 12. Moving pairs to oxygen gives 10 and then 8.<\/p>"}, {"n": 24, "stem": "<p>For the perchlorate ion [ClO4]⁻, the trial structure has four Cl=O double bonds with the −1 charge on Cl. What is the electron count on Cl?<\/p>", "opts": [["A", "16"], ["B", "15"], ["C", "12"], ["D", "8"]], "ans": "A", "exp": "<p>Cl count = 7 + 8 bonds (four double bonds) − (−1) = 16.<\/p>"}, {"n": 25, "stem": "<p>In the final octet Lewis structure of [ClO4]⁻ (four Cl–O single bonds, each O with three lone pairs), what is the formal charge on Cl?<\/p>", "opts": [["A", "−1"], ["B", "+1"], ["C", "+3"], ["D", "+7"]], "ans": "C", "exp": "<p>Cl: 7 − 0 − 4 = +3. Each O: 6 − 6 − 1 = −1. Total = +3 + 4(−1) = −1. Check: Cl count = 7 + 4 − 3 = 8.<\/p>"}, {"n": 26, "stem": "<p>What is the O–O bond order in ozone, O3?<\/p>", "opts": [["A", "1"], ["B", "1.5"], ["C", "2"], ["D", "0.5"]], "ans": "B", "exp": "<p>O3 is a hybrid of two equivalent structures, each with one single and one double O–O bond, so each bond order = (1 + 2)/2 = 1.5.<\/p>"}, {"n": 27, "stem": "<p>Which statement correctly describes resonance?<\/p>", "opts": [["A", "The molecule rapidly flips back and forth between the resonance structures."], ["B", "The double-headed arrow indicates a chemical equilibrium between the forms."], ["C", "The actual structure is a composite (average) of the resonance structures, none of which exists independently."], ["D", "Resonance structures may differ in the positions of the nuclei."]], "ans": "C", "exp": "<p>Resonance is not oscillation, and the ↔ arrow is not an equilibrium arrow. The real molecule is an average (like green from blue and yellow), and resonance structures differ only in the positions of electrons.<\/p>"}, {"n": 28, "stem": "<p>Which pair of structures are NOT resonance structures of each other?<\/p>", "opts": [["A", "The two Kekulé structures of benzene"], ["B", "O=O⁺–O⁻ and ⁻O–O⁺=O"], ["C", "Two nitrate structures that differ only in which O is double-bonded to N"], ["D", "H–C≡N and H–N≡C"]], "ans": "D", "exp": "<p>HCN and HNC have different atom connectivity (the nuclei are in different positions), so they are different molecules, not resonance structures.<\/p>"}, {"n": 29, "stem": "<p>For N2O (connectivity N–N–O), the trial structure N≡N=O gives the central nitrogen an electron count of:<\/p>", "opts": [["A", "10"], ["B", "8"], ["C", "9"], ["D", "12"]], "ans": "A", "exp": "<p>The central N has 5 bonds (3 to the terminal N and 2 to O): 5 + 5 − 0 = 10. The terminal atoms automatically have 8.<\/p>"}, {"n": 30, "stem": "<p>In the final Lewis structure of N2O, N≡N⁺–O⁻, what is the formal charge on the central nitrogen?<\/p>", "opts": [["A", "0"], ["B", "−1"], ["C", "+2"], ["D", "+1"]], "ans": "D", "exp": "<p>Central N has 4 bonds and no lone pairs: 5 − 0 − 4 = +1. O⁻: 6 − 6 − 1 = −1. Terminal N: 5 − 2 − 3 = 0.<\/p>"}, {"n": 31, "stem": "<p>In the POCl3 trial structure (P=O plus three P–Cl), phosphorus has 10 electrons. How is this fixed, and what results?<\/p>", "opts": [["A", "Move one P–O bond pair onto oxygen to give Cl3P⁺–O⁻, with P having 8 electrons."], ["B", "Put the extra electrons into phosphorus 3d orbitals."], ["C", "Remove a chlorine atom."], ["D", "Move a lone pair from O to make a P≡O triple bond."]], "ans": "A", "exp": "<p>Taking one P–O bond back to oxygen gives P⁺ (5 − 0 − 4 = +1, count 5 + 4 − 1 = 8) and O⁻. The d-orbital explanation is wrong.<\/p>"}, {"n": 32, "stem": "<p>According to the lecture, if atom Y has more than 8 electrons in a Y=X bond, converting a bond pair into a lone pair on X (Y⁺–X⁻) changes the electron counts how?<\/p>", "opts": [["A", "Y increases by 2; X decreases by 2"], ["B", "Y decreases by 2; X is unchanged"], ["C", "Y decreases by 2; X increases by 2"], ["D", "Both are unchanged"]], "ans": "B", "exp": "<p>Moving a bond pair onto X as a lone pair lowers Y's count by 2. X's count stays the same because the pair stays in X's valence shell.<\/p>"}, {"n": 33, "stem": "<p>Using the Zumdahl method for CO2, how many valence electrons remain to be placed after drawing the two C–O single bonds?<\/p>", "opts": [["A", "16"], ["B", "14"], ["C", "12"], ["D", "8"]], "ans": "C", "exp": "<p>Total = 4 + 6 + 6 = 16, and two bonds use 4 electrons, so 16 − 4 = 12 remain (6 pairs).<\/p>"}, {"n": 34, "stem": "<p>Nitric oxide (NO) cannot have an octet on every atom because:<\/p>", "opts": [["A", "it is hypervalent."], ["B", "it has 11 valence electrons, an odd number."], ["C", "nitrogen uses d orbitals."], ["D", "it has 10 valence electrons, an even number."]], "ans": "B", "exp": "<p>N (5) + O (6) = 11 valence electrons. With an odd count, at least one atom must lack an octet.<\/p>"}, {"n": 35, "stem": "<p>For NO2 (17 valence electrons), which description is the best Lewis structure according to the lecture?<\/p>", "opts": [["A", "O=N=O, with N having 9 electrons"], ["B", "O=N⁺–O⁻, with the unpaired electron on N (N has 7 electrons, each O has 8)"], ["C", "O=N–O with the unpaired electron giving one O 9 electrons"], ["D", "O–N–O with N having 4 electrons"]], "ans": "B", "exp": "<p>O=N=O puts 9 electrons on N (bad). O=N⁺–O⁻ gives N 7 electrons and both O atoms 8, which is the better structure.<\/p>"}, {"n": 36, "stem": "<p>In the BF3 resonance structure that gives boron an octet, F donates a lone pair to form a B=F bond. Which statement is correct?<\/p>", "opts": [["A", "That structure is never valid because fluorine can never carry a positive formal charge."], ["B", "It gives F a +1 formal charge and B a −1 formal charge, which is acceptable because formal charge is not real charge."], ["C", "It gives B a +1 formal charge and F a −1 formal charge."], ["D", "It is identical to the structure for BH3."]], "ans": "B", "exp": "<p>F⁺ forms 2 bonds with 2 LP: 7 − 4 − 2 = +1. B: 3 − 0 − 4 = −1. The lecture states that a positive formal charge on F is acceptable because it is not a real charge.<\/p>"}, {"n": 37, "stem": "<p>Calculations show the real (computed) charge on nitrogen in [NH4]⁺ is about:<\/p>", "opts": [["A", "+1.00"], ["B", "+0.44"], ["C", "−0.74"], ["D", "0.00"]], "ans": "C", "exp": "<p>The calculated charges are N ≈ −0.74 and each H ≈ +0.44 (−0.74 + 4 × 0.44 = +1.02 ≈ +1). N is negative because it is more electronegative than H.<\/p>"}, {"n": 38, "stem": "<p>If every S–F bond in SF6 is drawn as a shared electron pair, how many electrons appear to surround sulfur?<\/p>", "opts": [["A", "8"], ["B", "10"], ["C", "6"], ["D", "12"]], "ans": "D", "exp": "<p>6 valence electrons + 6 bonds = 12 apparent electrons. This is the \"valence expansion\" that calculations show is not real.<\/p>"}, {"n": 39, "stem": "<p>What is the best current explanation for \"hypervalent\" molecules such as SF6, PF5 and XeF2?<\/p>", "opts": [["A", "The central atom uses empty d orbitals to hold more than 8 electrons."], ["B", "The octet is maintained; the bonding just cannot be described using only 2-center-2-electron bonds."], ["C", "The octet rule does not apply to any element beyond period 2."], ["D", "These molecules are odd-electron radicals."]], "ans": "B", "exp": "<p>Calculations show there is no real valence shell expansion. The 3d orbitals are too high in energy to use, and the octet is kept, but the bonding cannot be described with only 2-center-2-electron bonds.<\/p>"}, {"n": 40, "stem": "<p>XeF2 can be described by the resonance structures F–Xe⁺ F⁻ ↔ F⁻ Xe⁺–F. What is the Xe–F bond order?<\/p>", "opts": [["A", "0.5"], ["B", "1"], ["C", "1.5"], ["D", "2"]], "ans": "A", "exp": "<p>Each structure has one Xe–F bond and one \"no-bond\" Xe⁺ F⁻ interaction. The average is (1 + 0)/2 = 0.5 per Xe–F bond, and Xe has 8 electrons in each structure.<\/p>"}]}], "count": 40, "cards": 76}, {"slug": "9-10", "name": "Lectures 9–10", "title": "Oxidation numbers, VSEPR, polarity, light and black-body radiation", "intro": "<h4>Formulas<\/h4><ul class='flist'><li>Unknown oxidation number = overall charge − Σ(known oxidation numbers)<\/li><li>Steric number SN = CN (bonded atoms) + LP (lone pairs)<\/li><li>AXₓEₑ with x + e = SN<\/li><li>c = νλ  (ν = c/λ, λ = c/ν)<\/li><li>E = hν = hc/λ<\/li><li>Planck oscillator energies: ε = nhν (n = 0, 1, 2, …)<\/li><li>Wien&#x27;s law: T·λmax = constant<\/li><li>Stefan&#x27;s law: total intensity ∝ T⁴<\/li><\/ul><h4>Constants<\/h4><ul class='flist'><li>h = 6.63 × 10⁻³⁴ J s<\/li><li>c = 3.00 × 10⁸ m s⁻¹<\/li><li>N<sub>A<\/sub> = 6.022 × 10²³ mol⁻¹<\/li><li>Wien constant = 2.90 × 10⁻³ m K<\/li><li>1 nm = 10⁻⁹ m<\/li><li>1 μm = 10⁻⁶ m<\/li><\/ul>", "sections": [{"title": "Problems", "qs": [{"n": 1, "stem": "<p>Oxidation numbers are assigned by imagining that every bond is broken:<\/p>", "opts": [["A", "homolytically, so each atom keeps one bonding electron"], ["B", "heterolytically, so the more electronegative atom gets both bonding electrons"], ["C", "so that the bonding electrons are shared equally"], ["D", "so that the less electronegative atom gets both bonding electrons"]], "ans": "B", "exp": "<p>Oxidation numbers come from heterolytic cleavage, giving both bonding electrons to the more electronegative atom (a 100% ionic assumption). Homolytic cleavage (A) gives formal charges.<\/p>"}, {"n": 2, "stem": "<p>For HCl, which set lists the formal charges, oxidation numbers, and calculated (actual) charges on H, in that order?<\/p>", "opts": [["A", "0, +1, +0.18"], ["B", "+1, 0, +0.18"], ["C", "0, +1, +1"], ["D", "+0.18, +1, 0"]], "ans": "A", "exp": "<p>Formal charge on H is 0 (equal sharing), oxidation number is +1 (100% ionic), and the calculated charge is intermediate at +0.18.<\/p>"}, {"n": 3, "stem": "<p>What is the oxidation number of nitrogen in NCl₃? (Electronegativities: N 3.04, Cl 3.16, H 2.20)<\/p>", "opts": [["A", "−3"], ["B", "0"], ["C", "+1"], ["D", "+3"]], "ans": "D", "exp": "<p>Cl (3.16) is more electronegative than N (3.04), so Cl is −1. N = 0 − 3(−1) = +3.<\/p>"}, {"n": 4, "stem": "<p>What is the oxidation number of sulfur in the sulfate ion, SO₄²⁻?<\/p>", "opts": [["A", "+4"], ["B", "−2"], ["C", "+8"], ["D", "+6"]], "ans": "D", "exp": "<p>O = −2. S = charge − Σ(known) = −2 − 4(−2) = −2 + 8 = +6.<\/p>"}, {"n": 5, "stem": "<p>What is the oxidation number of oxygen in hydrogen peroxide, H₂O₂?<\/p>", "opts": [["A", "0"], ["B", "−2"], ["C", "+1"], ["D", "−1"]], "ans": "D", "exp": "<p>Because of the O–O bond, O is not −2. With H = +1: 2(+1) + 2x = 0, so x = −1.<\/p>"}, {"n": 6, "stem": "<p>What is the oxidation number of manganese in the permanganate ion, MnO₄⁻?<\/p>", "opts": [["A", "+8"], ["B", "+6"], ["C", "+7"], ["D", "−1"]], "ans": "C", "exp": "<p>Mn = −1 − 4(−2) = −1 + 8 = +7.<\/p>"}, {"n": 7, "stem": "<p>What is the oxidation number of chromium in the dichromate ion, Cr₂O₇²⁻?<\/p>", "opts": [["A", "+6"], ["B", "+7"], ["C", "+12"], ["D", "+3"]], "ans": "A", "exp": "<p>2x + 7(−2) = −2, so 2x = +12 and x = +6.<\/p>"}, {"n": 8, "stem": "<p>Using the hydrogen rules from Lecture 9, what is the oxidation number of silicon in SiH₄?<\/p>", "opts": [["A", "−4"], ["B", "0"], ["C", "+2"], ["D", "+4"]], "ans": "D", "exp": "<p>H bonded to Si is assigned −1 (one of the exceptions). Si = 0 − 4(−1) = +4.<\/p>"}, {"n": 9, "stem": "<p>Which compound contains oxygen with a positive oxidation number?<\/p>", "opts": [["A", "H₂O"], ["B", "H₂O₂"], ["C", "OF₂"], ["D", "Na₂O"]], "ans": "C", "exp": "<p>In OF₂, F is always −1, so O = 0 − 2(−1) = +2. Oxygen is −2 in H₂O and Na₂O and −1 in H₂O₂.<\/p>"}, {"n": 10, "stem": "<p>The correct name for FeCl₃ is:<\/p>", "opts": [["A", "iron(II) chloride"], ["B", "iron(III) chloride"], ["C", "iron trichloride(I)"], ["D", "ferrous chloride"]], "ans": "B", "exp": "<p>Cl = −1, so Fe = 0 − 3(−1) = +3, written as the Roman numeral III: iron(III) chloride.<\/p>"}, {"n": 11, "stem": "<p>In the VSEPR notation AXₓEₑ, the steric number is:<\/p>", "opts": [["A", "x − e"], ["B", "x only"], ["C", "x + e"], ["D", "the total number of valence electrons divided by 2"]], "ans": "C", "exp": "<p>SN = CN + LP = x + e.<\/p>"}, {"n": 12, "stem": "<p>What are the CN, LP and SN for the central atom in NH₃?<\/p>", "opts": [["A", "CN = 3, LP = 0, SN = 3"], ["B", "CN = 3, LP = 1, SN = 4"], ["C", "CN = 4, LP = 0, SN = 4"], ["D", "CN = 3, LP = 2, SN = 5"]], "ans": "B", "exp": "<p>N bonds to 3 H atoms (CN = 3) and has one lone pair (LP = 1), so SN = 4 and it is AX₃E.<\/p>"}, {"n": 13, "stem": "<p>Which molecule has a VSEPR geometry (electron-domain geometry) that differs from its molecular geometry?<\/p>", "opts": [["A", "CH₄"], ["B", "BH₃"], ["C", "PF₅"], ["D", "H₂O"]], "ans": "D", "exp": "<p>H₂O is AX₂E₂: its electron geometry is tetrahedral, but its molecular geometry is bent. The other three have no lone pairs, so the molecular shape matches the idealized geometry.<\/p>"}, {"n": 14, "stem": "<p>Arrange the H–A–H bond angles of CH₄, NH₃ and H₂O from largest to smallest.<\/p>", "opts": [["A", "CH₄ &gt; NH₃ &gt; H₂O"], ["B", "H₂O &gt; NH₃ &gt; CH₄"], ["C", "NH₃ &gt; CH₄ &gt; H₂O"], ["D", "All are 109.5°"]], "ans": "A", "exp": "<p>CH₄ is 109.5°, NH₃ is 107° and H₂O is 104.5°. Each added lone pair compresses the H–A–H angle.<\/p>"}, {"n": 15, "stem": "<p>The bond angle decreases from CH₄ to NH₃ to H₂O because:<\/p>", "opts": [["A", "lone pairs are physically larger than bond pairs and repel more strongly"], ["B", "lone pairs are smaller than bond pairs and let the bonds move closer"], ["C", "hydrogen atoms attract each other more strongly in H₂O"], ["D", "the central atom becomes less electronegative"]], "ans": "A", "exp": "<p>A lone pair is physically larger than a bond pair, so lone pair/bond pair repulsions are greater and push the bonds closer together.<\/p>"}, {"n": 16, "stem": "<p>Which idealized geometry corresponds to a steric number of 7?<\/p>", "opts": [["A", "Octahedral"], ["B", "Trigonal bipyramidal"], ["C", "Pentagonal bipyramidal"], ["D", "Square antiprismatic"]], "ans": "C", "exp": "<p>SN = 7 gives a pentagonal bipyramid, with 72° and 90° angles. Octahedral is SN = 6 and trigonal bipyramidal is SN = 5.<\/p>"}, {"n": 17, "stem": "<p>In an AX₄E molecule such as SF₄, the lone pair is located:<\/p>", "opts": [["A", "in an axial position, because it has only two 90° interactions there"], ["B", "in an equatorial position, because it has only two 90° interactions there"], ["C", "in an axial position, because 120° interactions dominate"], ["D", "at random, because all five sites are equivalent"]], "ans": "B", "exp": "<p>An equatorial lone pair has only two 90° interactions, compared with three if it were axial. 90° interactions dominate because the domains are closer together, so the result is a see-saw shape.<\/p>"}, {"n": 18, "stem": "<p>What is the molecular shape of ClF₃?<\/p>", "opts": [["A", "Trigonal planar"], ["B", "Trigonal pyramidal"], ["C", "T-shaped"], ["D", "See-saw"]], "ans": "C", "exp": "<p>ClF₃ is AX₃E₂ (SN = 5) with both lone pairs equatorial, which gives a T-shape.<\/p>"}, {"n": 19, "stem": "<p>XeF₂ (AX₂E₃) has which molecular geometry?<\/p>", "opts": [["A", "Linear"], ["B", "Bent"], ["C", "T-shaped"], ["D", "Trigonal planar"]], "ans": "A", "exp": "<p>All three lone pairs occupy the equatorial plane, leaving the two F atoms axial at 180°, so the molecule is linear.<\/p>"}, {"n": 20, "stem": "<p>XeF₄ is square planar rather than having its lone pairs 90° apart because:<\/p>", "opts": [["A", "bond pair–bond pair repulsions are the strongest"], ["B", "lone pair–lone pair repulsions dominate, so the lone pairs go 180° apart"], ["C", "Xe has no lone pairs"], ["D", "the lone pairs prefer axial sites in a trigonal bipyramid"]], "ans": "B", "exp": "<p>XeF₄ is AX₄E₂. Lone pair–lone pair repulsion is the strongest, so the lone pairs sit 180° apart and the four F atoms form a square plane.<\/p>"}, {"n": 21, "stem": "<p>What are the VSEPR notation and molecular shape of the nitrate ion, NO₃⁻?<\/p>", "opts": [["A", "AX₃, trigonal planar"], ["B", "AX₃E, trigonal pyramidal"], ["C", "AX₄, tetrahedral"], ["D", "AX₂E, bent"]], "ans": "A", "exp": "<p>A double bond counts as one domain. CN = 3 and LP = 0, so SN = 3, AX₃, trigonal planar.<\/p>"}, {"n": 22, "stem": "<p>SO₄²⁻ can be drawn with 12, 10 or 8 electrons around S. Which statement is true?<\/p>", "opts": [["A", "Only the 8-electron structure gives a tetrahedral shape"], ["B", "The 12-electron structure gives an octahedral shape"], ["C", "All three give AX₄, tetrahedral, because VSEPR is insensitive to the Lewis structure chosen"], ["D", "The shape depends on which resonance form is most stable"]], "ans": "C", "exp": "<p>In every Lewis structure CN = 4 and LP = 0, so SN = 4 and the ion is AX₄ tetrahedral. VSEPR geometry does not depend on the Lewis structure chosen.<\/p>"}, {"n": 23, "stem": "<p>What is the molecular shape of SO₂?<\/p>", "opts": [["A", "Linear, AX₂"], ["B", "Bent, AX₂E"], ["C", "Bent, AX₂E₂"], ["D", "Trigonal planar, AX₃"]], "ans": "B", "exp": "<p>S has 2 bonded O atoms and 1 lone pair, so SN = 3 and it is AX₂E. The electron geometry is trigonal planar and the molecular shape is bent. This holds for both the 10-electron and the 8-electron Lewis structures.<\/p>"}, {"n": 24, "stem": "<p>The H–S–H bond angle in H₂S is 92°. This shows that:<\/p>", "opts": [["A", "H₂S is AX₂ and should be linear"], ["B", "VSEPR theory fails in many cases"], ["C", "sulfur has an expanded octet in H₂S"], ["D", "lone pairs are smaller than bond pairs"]], "ans": "B", "exp": "<p>H₂S is AX₂E₂ (SN = 4), so VSEPR predicts about 109.5° (somewhat less), but the actual angle is 92°. This is a cited example of VSEPR's limitations, where MO theory is more sound.<\/p>"}, {"n": 25, "stem": "<p>Which molecule is nonpolar even though it contains polar bonds?<\/p>", "opts": [["A", "H₂O"], ["B", "NH₃"], ["C", "CH₃Cl"], ["D", "BF₃"]], "ans": "D", "exp": "<p>BF₃ is trigonal planar (AX₃), so its three polar B–F bond dipoles cancel. H₂O, NH₃ and CH₃Cl are polar.<\/p>"}, {"n": 26, "stem": "<p>Which molecule is polar?<\/p>", "opts": [["A", "CO₂"], ["B", "CCl₄"], ["C", "SF₆"], ["D", "SF₄"]], "ans": "D", "exp": "<p>SF₄ is see-saw (AX₄E), so its bond dipoles do not cancel. CO₂ (linear), CCl₄ (tetrahedral) and SF₆ (octahedral) are symmetric and nonpolar.<\/p>"}, {"n": 27, "stem": "<p>The main industrial use of SF₆ (more than 8,000 tons per year) is as:<\/p>", "opts": [["A", "a refrigerant"], ["B", "a gaseous dielectric medium in high-voltage electrical equipment"], ["C", "an ultrasound contrast agent"], ["D", "a propellant in Nike \"air\" bags"]], "ans": "B", "exp": "<p>More than 8,000 of the more than 10,000 tons produced each year are used as a gaseous dielectric in high-voltage circuit breakers. Nike stopped using SF₆ in 2006 because it is a potent greenhouse gas.<\/p>"}, {"n": 28, "stem": "<p>What is the frequency of light with a wavelength of 500 nm?<\/p>", "opts": [["A", "1.5 × 10² Hz"], ["B", "1.67 × 10⁻¹⁵ Hz"], ["C", "6.0 × 10¹⁴ Hz"], ["D", "6.0 × 10⁵ Hz"]], "ans": "C", "exp": "<p>ν = c/λ = (3.00 × 10⁸ m s⁻¹)/(500 × 10⁻⁹ m) = 6.0 × 10¹⁴ s⁻¹.<\/p>"}, {"n": 29, "stem": "<p>An FM radio station broadcasts at 1.00 × 10² MHz. What is the wavelength?<\/p>", "opts": [["A", "0.333 m"], ["B", "30.0 m"], ["C", "3.00 m"], ["D", "3.00 × 10¹⁶ m"]], "ans": "C", "exp": "<p>λ = c/ν = (3.00 × 10⁸ m s⁻¹)/(1.00 × 10⁸ s⁻¹) = 3.00 m, which is in the radio range of about 1–10⁴ m.<\/p>"}, {"n": 30, "stem": "<p>Which statement about red light compared with violet light is correct?<\/p>", "opts": [["A", "Red light has higher frequency and shorter wavelength"], ["B", "Red light has lower frequency and longer wavelength"], ["C", "Red light travels faster in a vacuum"], ["D", "Red light has higher energy per photon"]], "ans": "B", "exp": "<p>Red light is at the long-wavelength (about 750 nm), low-frequency end of the visible region. All light travels at c in a vacuum, and lower frequency means lower photon energy.<\/p>"}, {"n": 31, "stem": "<p>Arrange these in order of INCREASING wavelength: X-rays, microwaves, ultraviolet, infrared.<\/p>", "opts": [["A", "X-rays &lt; ultraviolet &lt; infrared &lt; microwaves"], ["B", "microwaves &lt; infrared &lt; ultraviolet &lt; X-rays"], ["C", "ultraviolet &lt; X-rays &lt; infrared &lt; microwaves"], ["D", "X-rays &lt; infrared &lt; ultraviolet &lt; microwaves"]], "ans": "A", "exp": "<p>In increasing wavelength the order is gamma &lt; X-ray &lt; UV &lt; visible &lt; IR &lt; microwave (about 10⁻² m) &lt; radio.<\/p>"}, {"n": 32, "stem": "<p>What is the energy of one photon of light with λ = 600 nm?<\/p>", "opts": [["A", "1.99 × 10⁻²⁵ J"], ["B", "1.20 × 10⁻¹⁹ J"], ["C", "3.32 × 10⁻²⁸ J"], ["D", "3.32 × 10⁻¹⁹ J"]], "ans": "D", "exp": "<p>E = hc/λ = (6.63 × 10⁻³⁴ J s)(3.00 × 10⁸ m s⁻¹)/(600 × 10⁻⁹ m) = 3.32 × 10⁻¹⁹ J.<\/p>"}, {"n": 33, "stem": "<p>What is the energy of one mole of photons with λ = 600 nm?<\/p>", "opts": [["A", "3.32 × 10⁻¹⁹ kJ/mol"], ["B", "20.0 kJ/mol"], ["C", "200 kJ/mol"], ["D", "2.00 × 10⁶ kJ/mol"]], "ans": "C", "exp": "<p>E = (3.315 × 10⁻¹⁹ J)(6.022 × 10²³ mol⁻¹) = 1.996 × 10⁵ J/mol ≈ 200 kJ/mol.<\/p>"}, {"n": 34, "stem": "<p>A Planck oscillator has a frequency of 1.0 × 10¹³ s⁻¹. Which is an allowed energy for this oscillator?<\/p>", "opts": [["A", "1.0 × 10⁻²⁰ J"], ["B", "3.3 × 10⁻²¹ J"], ["C", "2.0 × 10⁻²⁰ J"], ["D", "5.0 × 10⁻²¹ J"]], "ans": "C", "exp": "<p>Allowed energies are ε = nhν, and hν = (6.63 × 10⁻³⁴)(1.0 × 10¹³) = 6.63 × 10⁻²¹ J. For n = 3, ε = 1.99 × 10⁻²⁰ J ≈ 2.0 × 10⁻²⁰ J. The other choices are not integer multiples of 6.63 × 10⁻²¹ J (they correspond to n ≈ 1.5, 0.5 and 0.75).<\/p>"}, {"n": 35, "stem": "<p>According to Stefan's law, if the absolute temperature of a black body is doubled, the total emitted intensity:<\/p>", "opts": [["A", "doubles"], ["B", "increases 4-fold"], ["C", "increases 8-fold"], ["D", "increases 16-fold"]], "ans": "D", "exp": "<p>By Stefan's law I ∝ T⁴, so doubling T gives 2⁴ = 16 times the intensity.<\/p>"}, {"n": 36, "stem": "<p>A black body at 800 K has λmax = 3.6 µm. Using Wien's law, what is λmax at 1000 K?<\/p>", "opts": [["A", "2.9 µm"], ["B", "4.5 µm"], ["C", "3.6 µm"], ["D", "0.36 µm"]], "ans": "A", "exp": "<p>T·λmax is constant, so λmax(1000 K) = (800 K)(3.6 µm)/(1000 K) = 2.88 µm ≈ 2.9 µm. The hotter body peaks at a shorter wavelength.<\/p>"}, {"n": 37, "stem": "<p>The surface of the Sun is about 5800 K. Using T·λmax = 2.90 × 10⁻³ m K, at what wavelength does its emission peak?<\/p>", "opts": [["A", "5.0 × 10⁻⁵ m (infrared)"], ["B", "50 nm (ultraviolet)"], ["C", "500 nm (visible)"], ["D", "2.0 × 10⁶ m (radio)"]], "ans": "C", "exp": "<p>λmax = (2.90 × 10⁻³ m K)/(5800 K) = 5.0 × 10⁻⁷ m = 500 nm, which is in the visible region (400–750 nm).<\/p>"}, {"n": 38, "stem": "<p>The \"ultraviolet catastrophe\" refers to:<\/p>", "opts": [["A", "damage to the ozone layer from UV light"], ["B", "the classical prediction that emitted intensity increases without limit as frequency increases"], ["C", "the experimental observation that hot bodies emit mostly UV light"], ["D", "the collapse of electrons into the nucleus in the Rutherford atom"]], "ans": "B", "exp": "<p>Classical (Rayleigh–Jeans) theory predicted that intensity keeps rising as frequency increases, so any warm object would emit intense UV and even X-rays. Experiment instead shows a maximum.<\/p>"}, {"n": 39, "stem": "<p>How did Planck's hypothesis avoid the ultraviolet catastrophe?<\/p>", "opts": [["A", "By assuming oscillators can absorb any amount of energy"], ["B", "By setting Planck's constant equal to zero"], ["C", "By requiring energy to be gained or lost in quanta of hν, so high-frequency oscillators are not excited in a cool body"], ["D", "By showing that black-body radiation depends on the material"]], "ans": "C", "exp": "<p>Planck proposed ε = nhν. A cool body does not have enough energy to supply the large quantum hν that a high-frequency oscillator needs, so UV emission is suppressed. If h were zero, the catastrophe would return.<\/p>"}, {"n": 40, "stem": "<p>A beam of light is made more intense without changing its wavelength. According to Planck's picture:<\/p>", "opts": [["A", "the energy of each packet increases"], ["B", "the frequency increases"], ["C", "the wavelength must decrease"], ["D", "the number of energy packets increases, but the energy per packet is unchanged"]], "ans": "D", "exp": "<p>Intensity reflects the number of energy packets. The energy of each packet, E = hν = hc/λ, depends only on frequency, so it is unchanged.<\/p>"}, {"n": 41, "stem": "<p>Why did Rutherford's planetary model of the atom face a problem under classical physics?<\/p>", "opts": [["A", "Electrons have no charge"], ["B", "An accelerating charge emits radiation and loses energy, so the electron should spiral into the nucleus"], ["C", "The nucleus is negatively charged"], ["D", "Electrons move too slowly to stay in orbit"]], "ans": "B", "exp": "<p>Classically, an orbiting electron is an accelerating charge, so it should radiate energy and spiral into the nucleus (the \"death spiral\").<\/p>"}, {"n": 42, "stem": "<p>According to Wedgwood's observations, a body glowing orange is at approximately:<\/p>", "opts": [["A", "550 °C"], ["B", "750 °C"], ["C", "900 °C"], ["D", "1200 °C"]], "ans": "C", "exp": "<p>Wedgwood's scale was 550 °C dark red, 750 °C cherry red, 900 °C orange, 1000 °C yellow and 1200 °C white.<\/p>"}]}], "count": 42, "cards": 94}, {"slug": "11-13", "name": "Lectures 11–13", "title": "Photoelectric effect, Bohr model, wave–particle duality and atomic orbitals", "intro": "<h4>Formulas<\/h4><ul class='flist'><li>Photoelectric effect: KE = hν − Φ<\/li><li>Work function: Φ = hν₀<\/li><li>Rydberg: 1/λ = R<sub>H<\/sub> (1/n₁² − 1/n₂²)<\/li><li>Bohr energy: Eₙ = −R<sub>E<\/sub> Z²/n²<\/li><li>Transition energy: ΔE = R<sub>E<\/sub> (1/n₁² − 1/n₂²) = hν = hc/λ<\/li><li>Bohr radius: rₙ = n²a₀/Z<\/li><li>Bohr angular momentum: mₑvr = nħ = nh/2π<\/li><li>de Broglie: λ = h/p = h/mv<\/li><li>de Broglie standing-wave condition: nλ = 2πr<\/li><li>Heisenberg: Δx·Δp ≥ h/4π<\/li><li>Particle in a box: Eₙ = n²h²/(8mL²)<\/li><li>Radial probability = 4πr²R²(r)<\/li><li>Allowed l: l = 0 … n − 1<\/li><li>Allowed mₗ: mₗ = −l … +l<\/li><li>Orbitals per subshell = 2l + 1<\/li><li>Orbitals per shell = n²<\/li><li>Radial nodes = n − l − 1<\/li><li>Angular nodes = l<\/li><li>Total nodes = n − 1<\/li><\/ul><h4>Constants<\/h4><ul class='flist'><li>h = 6.626 × 10⁻³⁴ J·s<\/li><li>c = 3.00 × 10⁸ m/s<\/li><li>mₑ = 9.109 × 10⁻³¹ kg<\/li><li>R<sub>E<\/sub> = 2.18 × 10⁻¹⁸ J = 13.6 eV<\/li><li>R<sub>H<\/sub> = 1.097 × 10⁷ m⁻¹ (lecture rounds to 1.10 × 10⁷ m⁻¹)<\/li><li>a₀ = 0.529 Å = 52.9 pm<\/li><li>1 Å = 10⁻¹⁰ m<\/li><\/ul>", "sections": [{"title": "Lecture 11: Photoelectric Effect, Atomic Spectra, and the Bohr Atom", "qs": [{"n": 1, "stem": "<p>A metal is illuminated with light whose frequency is above its threshold frequency. If the intensity of the light is doubled while the frequency stays the same, what happens?<\/p>", "opts": [["A", "The maximum kinetic energy of the ejected electrons doubles."], ["B", "More electrons are ejected, but their maximum kinetic energy is unchanged."], ["C", "The threshold frequency of the metal decreases."], ["D", "Electrons stop being ejected because the work function increases."]], "ans": "B", "exp": "<p>Intensity is the number of photons. More photons eject more electrons, but each photon still has the same energy hν, so KE_max = hν − Φ does not change.<\/p>"}, {"n": 2, "stem": "<p>Very intense red light shines on a metal surface, but no electrons are ejected. Weak violet light on the same metal ejects electrons immediately. Which statement best explains this?<\/p>", "opts": [["A", "Red light has a higher frequency than violet light."], ["B", "Electrons need time to build up energy from the red light."], ["C", "The energy of each red photon (hν) is less than the work function Φ, and one photon's energy is transferred to one electron."], ["D", "Intensity, not frequency, determines whether electrons are ejected."]], "ans": "C", "exp": "<p>One photon gives its energy to one electron. If hν &lt; Φ, no electron is ejected no matter how many photons arrive. Violet photons have higher ν, so hν &gt; Φ and ejection is immediate.<\/p>"}, {"n": 3, "stem": "<p>What is the energy of a single photon with a wavelength of 500 nm?<\/p>", "opts": [["A", "1.33 × 10⁻²⁷ J"], ["B", "9.94 × 10⁻²⁰ J"], ["C", "3.98 × 10⁻²⁸ J"], ["D", "3.98 × 10⁻¹⁹ J"]], "ans": "D", "exp": "<p>E = hc/λ = (6.626 × 10⁻³⁴)(3.00 × 10⁸)/(500 × 10⁻⁹ m) = 3.98 × 10⁻¹⁹ J.<\/p>"}, {"n": 4, "stem": "<p>Potassium has a threshold frequency of 5.44 × 10¹⁴ Hz. What is its work function?<\/p>", "opts": [["A", "3.60 × 10⁻¹⁹ J"], ["B", "1.22 × 10⁻⁴⁸ J"], ["C", "5.51 × 10⁻⁷ J"], ["D", "8.21 × 10⁻²⁰ J"]], "ans": "A", "exp": "<p>Φ = hν₀ = (6.626 × 10⁻³⁴ J·s)(5.44 × 10¹⁴ s⁻¹) = 3.60 × 10⁻¹⁹ J.<\/p>"}, {"n": 5, "stem": "<p>Light with a wavelength of 400 nm strikes potassium (ν₀ = 5.44 × 10¹⁴ Hz). What is the maximum kinetic energy of the ejected electrons?<\/p>", "opts": [["A", "4.97 × 10⁻¹⁹ J"], ["B", "1.36 × 10⁻¹⁹ J"], ["C", "8.58 × 10⁻¹⁹ J"], ["D", "No electrons are ejected."]], "ans": "B", "exp": "<p>E_photon = hc/λ = (6.626 × 10⁻³⁴)(3.00 × 10⁸)/(400 × 10⁻⁹) = 4.97 × 10⁻¹⁹ J. KE = hν − Φ = 4.9695 × 10⁻¹⁹ − 3.6045 × 10⁻¹⁹ = 1.36 × 10⁻¹⁹ J. (Keep the unrounded values until the end. Rounding each term first gives 1.365 and a misleading 1.37.) (Option A is the photon energy; it forgets to subtract Φ.)<\/p>"}, {"n": 6, "stem": "<p>A graph of the maximum kinetic energy of ejected electrons against the frequency of incident light is plotted for Rb, K, and Na. Which statement about the three lines is correct?<\/p>", "opts": [["A", "They have different slopes but the same x-intercept."], ["B", "They all pass through the origin."], ["C", "They have the same slope (h) but different intercepts that depend on the metal."], ["D", "Their slopes equal the work function of each metal."]], "ans": "C", "exp": "<p>KE = hν − Φ is a straight line with slope h for every metal. The x-intercept (ν₀) and the y-intercept (−Φ) depend on the metal.<\/p>"}, {"n": 7, "stem": "<p>According to classical physics, what should happen to an electron orbiting the nucleus in Rutherford's model of the atom?<\/p>", "opts": [["A", "It should continuously emit radiation, lose energy, and spiral into the nucleus."], ["B", "It should orbit forever at a fixed radius without emitting radiation."], ["C", "It should emit light only at specific wavelengths."], ["D", "It should be ejected from the atom."]], "ans": "A", "exp": "<p>Classical physics says an accelerating (circling) charge radiates energy. The electron would lose energy and spiral into the nucleus (the \"death spiral\"), so classical atoms would be unstable.<\/p>"}, {"n": 8, "stem": "<p>White light passes through a sample of cool hydrogen gas and then through a prism. What does the resulting spectrum look like?<\/p>", "opts": [["A", "Bright colored lines on a black background."], ["B", "A continuous spectrum with no features."], ["C", "A single bright line at 656 nm."], ["D", "A continuous colored spectrum crossed by dark (black) lines."]], "ans": "D", "exp": "<p>This is an absorption spectrum. The atoms absorb only photons that match their energy gaps, so those wavelengths appear as black lines on the continuous spectrum.<\/p>"}, {"n": 9, "stem": "<p>Using the Rydberg equation, find the wavelength of light emitted when a hydrogen electron falls from n = 3 to n = 2.<\/p>", "opts": [["A", "486 nm"], ["B", "656 nm"], ["C", "122 nm"], ["D", "103 nm"]], "ans": "B", "exp": "<p>1/λ = R_H(1/2² − 1/3²) = (1.097 × 10⁷)(0.25 − 0.1111) = (1.097 × 10⁷)(0.13889) = 1.524 × 10⁶ m⁻¹. So λ = 6.56 × 10⁻⁷ m = 656 nm (the red Balmer line).<\/p>"}, {"n": 10, "stem": "<p>The hydrogen emission line at 486 nm belongs to the Balmer series. Which transition produces it?<\/p>", "opts": [["A", "n = 4 → n = 2"], ["B", "n = 3 → n = 2"], ["C", "n = 4 → n = 1"], ["D", "n = 6 → n = 2"]], "ans": "A", "exp": "<p>1/λ = (1.097 × 10⁷)(1/4 − 1/16) = (1.097 × 10⁷)(0.1875) = 2.057 × 10⁶ m⁻¹, so λ = 486 nm. Balmer lines end on n = 2: 656 (3→2), 486 (4→2), 434 (5→2), 410 (6→2).<\/p>"}, {"n": 11, "stem": "<p>What is the wavelength of the photon emitted when a hydrogen electron falls from n = 2 to n = 1, and in what region of the spectrum is it?<\/p>", "opts": [["A", "656 nm, visible"], ["B", "1.64 × 10⁻¹⁸ nm, ultraviolet"], ["C", "122 nm, ultraviolet (Lyman series)"], ["D", "122 nm, infrared (Paschen series)"]], "ans": "C", "exp": "<p>ΔE = R_E(1/1² − 1/2²) = (2.18 × 10⁻¹⁸)(0.75) = 1.635 × 10⁻¹⁸ J. λ = hc/ΔE = (1.988 × 10⁻²⁵)/(1.635 × 10⁻¹⁸) = 1.22 × 10⁻⁷ m = 122 nm. Transitions to n = 1 are the Lyman series, which is in the ultraviolet.<\/p>"}, {"n": 12, "stem": "<p>According to the Bohr model, what is the radius of the n = 3 orbit of a hydrogen atom?<\/p>", "opts": [["A", "1.59 Å"], ["B", "0.176 Å"], ["C", "2.12 Å"], ["D", "4.76 Å"]], "ans": "D", "exp": "<p>rₙ = n²a₀ = 3² × 0.529 Å = 4.76 Å.<\/p>"}, {"n": 13, "stem": "<p>How much energy is needed to remove the electron from a He⁺ ion in its ground state (n = 1)?<\/p>", "opts": [["A", "2.18 × 10⁻¹⁸ J"], ["B", "4.36 × 10⁻¹⁸ J"], ["C", "8.72 × 10⁻¹⁸ J"], ["D", "5.45 × 10⁻¹⁹ J"]], "ans": "C", "exp": "<p>Eₙ = −R_E Z²/n². For He⁺, Z = 2 and n = 1, so E₁ = −(2.18 × 10⁻¹⁸)(4)/1 = −8.72 × 10⁻¹⁸ J. Removing the electron (to E = 0) takes 8.72 × 10⁻¹⁸ J.<\/p>"}, {"n": 14, "stem": "<p>What is the ground-state (n = 1) energy of Li²⁺ according to the Bohr model?<\/p>", "opts": [["A", "−13.6 eV"], ["B", "−122 eV"], ["C", "−40.8 eV"], ["D", "−4.53 eV"]], "ans": "B", "exp": "<p>E₁ = −R_E Z²/n² = −13.6 eV × 3²/1² = −13.6 × 9 = −122 eV.<\/p>"}, {"n": 15, "stem": "<p>A hydrogen atom in its ground state is hit by a photon with an energy of 1.80 × 10⁻¹⁸ J. What happens? (Hint: compare with the n = 1 → 2 and n = 1 → 3 energy gaps.)<\/p>", "opts": [["A", "The electron is promoted to n = 2 and the extra energy is kept as kinetic energy."], ["B", "The photon is not absorbed, because its energy does not exactly match any allowed transition."], ["C", "The electron is promoted to n = 3."], ["D", "The atom is ionized."]], "ans": "B", "exp": "<p>ΔE(1→2) = (2.18 × 10⁻¹⁸)(1 − 1/4) = 1.635 × 10⁻¹⁸ J. ΔE(1→3) = (2.18 × 10⁻¹⁸)(1 − 1/9) = 1.94 × 10⁻¹⁸ J. Ionization needs 2.18 × 10⁻¹⁸ J. The photon energy, 1.80 × 10⁻¹⁸ J, matches none of these, so by the resonance condition it is not absorbed.<\/p>"}, {"n": 16, "stem": "<p>Which of the following is NOT a shortcoming of the Bohr model?<\/p>", "opts": [["A", "It cannot predict the spectra of atoms with more than one electron."], ["B", "It violates the Heisenberg uncertainty principle."], ["C", "It mixes classical and nonclassical ideas, forcing quantized angular momentum to match experiment."], ["D", "It cannot account for the line spectrum of the hydrogen atom."]], "ans": "D", "exp": "<p>The Bohr model successfully explained the hydrogen line spectrum (it reproduced the Rydberg equation). A, B and C are the three shortcomings listed in the lecture.<\/p>"}, {"n": 17, "stem": "<p>What is the wavelength of light emitted when the electron in a He⁺ ion falls from n = 3 to n = 2?<\/p>", "opts": [["A", "164 nm"], ["B", "656 nm"], ["C", "328 nm"], ["D", "41.0 nm"]], "ans": "A", "exp": "<p>ΔE = R_E Z²(1/2² − 1/3²) = (2.18 × 10⁻¹⁸)(4)(0.13889) = 1.211 × 10⁻¹⁸ J. λ = hc/ΔE = (1.988 × 10⁻²⁵)/(1.211 × 10⁻¹⁸) = 1.64 × 10⁻⁷ m = 164 nm. Because of the Z² factor, this is exactly 1/4 of hydrogen's 656 nm.<\/p>"}]}, {"title": "Lecture 12: Wave–Particle Duality, Uncertainty, and the Schrödinger Equation", "qs": [{"n": 18, "stem": "<p>In a double-slit experiment, what causes a dark region in the diffraction pattern?<\/p>", "opts": [["A", "Constructive interference of waves arriving in phase."], ["B", "Destructive interference of waves arriving out of phase."], ["C", "The slits absorbing the light."], ["D", "The photoelectric effect at the screen."]], "ans": "B", "exp": "<p>When waves from the two slits arrive out of phase (crest meets trough), they cancel. This destructive interference gives a dark region, while constructive interference gives the bright lines.<\/p>"}, {"n": 19, "stem": "<p>For a standing wave on a guitar string, increasing the number of nodes causes:<\/p>", "opts": [["A", "a longer wavelength, lower frequency, and lower energy."], ["B", "a shorter wavelength but a lower energy."], ["C", "no change in energy."], ["D", "a shorter wavelength, higher frequency, and higher energy."]], "ans": "D", "exp": "<p>More nodes means a shorter wavelength, a higher frequency, and a higher energy. The particle in a box shows the same trend.<\/p>"}, {"n": 20, "stem": "<p>de Broglie explained Bohr's allowed orbits with the condition nλ = 2πr. What does this condition mean physically?<\/p>", "opts": [["A", "A whole number of electron wavelengths must fit into the orbit's circumference, otherwise the wave destroys itself through interference."], ["B", "The orbit radius must equal the electron wavelength."], ["C", "The electron must emit n photons per orbit."], ["D", "The electron's speed must equal the speed of light."]], "ans": "A", "exp": "<p>If the wavelengths do not fit the circumference a whole number of times, the wave interferes destructively with itself on successive cycles. Only orbits with 2πr = nλ survive. Combining this with Bohr's mₑvr = nh/2π gives λ = h/mₑv.<\/p>"}, {"n": 21, "stem": "<p>What is the de Broglie wavelength of an electron moving at 1.00 × 10⁶ m/s?<\/p>", "opts": [["A", "7.27 × 10⁻¹⁰ m"], ["B", "7.27 × 10⁻¹⁶ m"], ["C", "1.37 × 10⁹ m"], ["D", "6.63 × 10⁻²⁸ m"]], "ans": "A", "exp": "<p>λ = h/mv = (6.626 × 10⁻³⁴)/[(9.109 × 10⁻³¹)(1.00 × 10⁶)] = 7.27 × 10⁻¹⁰ m (7.27 Å). This is comparable to atomic spacings, so the electron's wave nature can be observed.<\/p>"}, {"n": 22, "stem": "<p>What is the de Broglie wavelength of a 0.150 kg baseball travelling at 40.0 m/s?<\/p>", "opts": [["A", "1.10 × 10⁻³² m"], ["B", "4.42 × 10⁻³⁶ m"], ["C", "1.10 × 10⁻³⁴ m"], ["D", "9.05 × 10³³ m"]], "ans": "C", "exp": "<p>λ = h/mv = (6.626 × 10⁻³⁴)/[(0.150)(40.0)] = (6.626 × 10⁻³⁴)/6.00 = 1.10 × 10⁻³⁴ m. This is immeasurably small.<\/p>"}, {"n": 23, "stem": "<p>Why do we never observe the wave behavior of a cow or a baseball?<\/p>", "opts": [["A", "Macroscopic objects have no momentum."], ["B", "Planck's constant is so small that their wavelengths are far too short to measure."], ["C", "Only charged particles have wave properties."], ["D", "Their wavelengths are too long to fit inside a laboratory."]], "ans": "B", "exp": "<p>λ = h/mv. Because h ≈ 6.6 × 10⁻³⁴ J·s is tiny and macroscopic masses are large, λ is far too small to detect. That is why electrons show wave properties and cows do not.<\/p>"}, {"n": 24, "stem": "<p>Which experiment provided direct evidence that electrons behave as waves?<\/p>", "opts": [["A", "J. J. Thomson's deflection of electrons in electric and magnetic fields."], ["B", "Hertz's ejection of electrons by ultraviolet light."], ["C", "Davisson and Germer's diffraction of electrons by a nickel crystal."], ["D", "Rutherford's scattering of alpha particles."]], "ans": "C", "exp": "<p>Diffraction is a wave property. Davisson and Germer (1927) diffracted electrons with a nickel crystal, and G. P. Thomson did the same with Al foil. J. J. Thomson's deflection experiments showed particle behavior.<\/p>"}, {"n": 25, "stem": "<p>Why can electrons and X-rays be diffracted by crystals or metal foils?<\/p>", "opts": [["A", "Both carry electric charge."], ["B", "Their wavelengths are comparable to the spacing between atoms."], ["C", "Both travel at the speed of light."], ["D", "Their wavelengths are much longer than atomic spacings."]], "ans": "B", "exp": "<p>Diffraction is strong when the wavelength is comparable to the spacing of the \"slits.\" Here those slits are the atoms in the crystal or foil.<\/p>"}, {"n": 26, "stem": "<p>What is the momentum of a photon with a wavelength of 500 nm?<\/p>", "opts": [["A", "3.98 × 10⁻¹⁹ kg·m/s"], ["B", "3.31 × 10⁻⁴⁰ kg·m/s"], ["C", "7.55 × 10²⁶ kg·m/s"], ["D", "1.33 × 10⁻²⁷ kg·m/s"]], "ans": "D", "exp": "<p>p = h/λ = (6.626 × 10⁻³⁴)/(500 × 10⁻⁹) = 1.33 × 10⁻²⁷ kg·m/s.<\/p>"}, {"n": 27, "stem": "<p>An electron is confined to a region with Δx = 1.0 × 10⁻¹⁰ m (about the size of an atom). What is the minimum uncertainty in its velocity?<\/p>", "opts": [["A", "5.8 × 10⁵ m/s"], ["B", "7.3 × 10⁶ m/s"], ["C", "5.3 × 10⁻²⁵ m/s"], ["D", "1.8 × 10⁻⁶ m/s"]], "ans": "A", "exp": "<p>Δp ≥ h/(4πΔx) = (6.626 × 10⁻³⁴)/(4π × 1.0 × 10⁻¹⁰) = 5.27 × 10⁻²⁵ kg·m/s. Δv = Δp/mₑ = (5.27 × 10⁻²⁵)/(9.109 × 10⁻³¹) = 5.8 × 10⁵ m/s. This is huge, so the electron cannot be pictured on a defined orbit.<\/p>"}, {"n": 28, "stem": "<p>Which statement correctly describes the wave function Ψ?<\/p>", "opts": [["A", "Ψ is the electron's exact trajectory."], ["B", "Ψ must always be positive and equals the probability."], ["C", "Ψ itself has no physical meaning (it may be + or −), but Ψ² is the probability density for finding the electron at a point."], ["D", "Ψ is the energy of the electron."]], "ans": "C", "exp": "<p>Ψ has no physical significance by itself and can be positive or negative. Ψ² is the probability density (Max Born's interpretation).<\/p>"}, {"n": 29, "stem": "<p>In the Schrödinger equation HΨ = EΨ, what is H?<\/p>", "opts": [["A", "Planck's constant"], ["B", "The Hamiltonian operator"], ["C", "The enthalpy"], ["D", "The Heisenberg uncertainty"]], "ans": "B", "exp": "<p>In HΨ = EΨ, H is the Hamiltonian operator, E is the energy, and Ψ is the wave function.<\/p>"}, {"n": 30, "stem": "<p>An electron is confined in a one-dimensional box with L = 1.00 nm. What is its lowest possible energy (n = 1)?<\/p>", "opts": [["A", "6.02 × 10⁻²⁰ J"], ["B", "6.02 × 10⁻³⁸ J"], ["C", "2.41 × 10⁻¹⁹ J"], ["D", "0 J"]], "ans": "A", "exp": "<p>E₁ = h²/(8mL²) = (6.626 × 10⁻³⁴)²/[8(9.109 × 10⁻³¹)(1.00 × 10⁻⁹)²] = (4.390 × 10⁻⁶⁷)/(7.287 × 10⁻⁴⁸) = 6.02 × 10⁻²⁰ J. It cannot be 0 J because of the zero point energy.<\/p>"}, {"n": 31, "stem": "<p>For a particle in a 1-D box, what is the ratio E₃/E₁?<\/p>", "opts": [["A", "3"], ["B", "6"], ["C", "9"], ["D", "1/9"]], "ans": "C", "exp": "<p>Eₙ = n²h²/(8mL²), so E₃/E₁ = 3²/1² = 9.<\/p>"}, {"n": 32, "stem": "<p>For a particle in a 1-D box in the n = 2 level, what is the probability density Ψ² at the exact center of the box?<\/p>", "opts": [["A", "A maximum, as it is for n = 1"], ["B", "Zero, because the center is a node"], ["C", "Half of its maximum value"], ["D", "The same as at every other point in the box"]], "ans": "B", "exp": "<p>For n = 2, Ψ = (2/L)^½ sin(2πx/L). At x = L/2 this is sin(π) = 0, so Ψ² = 0 and the particle has zero probability of being found at the center in this level.<\/p>"}, {"n": 33, "stem": "<p>Why can't a particle in a box have zero energy (zero point energy)?<\/p>", "opts": [["A", "Zero energy would mean exactly zero momentum (Δp = 0), so Δx would have to be infinite, but the particle is confined to the box. This violates ΔpΔx ≥ h/4π."], ["B", "The walls of the box continuously add energy to the particle."], ["C", "n = 0 gives an infinite energy."], ["D", "Ψ² would be negative."]], "ans": "A", "exp": "<p>E = 0 would mean exactly zero momentum (Δp = 0). Then ΔpΔx ≥ h/4π requires an infinite Δx, but the particle is somewhere in the box. So the lowest energy (n = 1) is above zero, and the particle is never at rest.<\/p>"}]}, {"title": "Lecture 13: Hydrogen Atom Orbitals and Quantum Numbers", "qs": [{"n": 34, "stem": "<p>Which set of quantum numbers (n, l, mₗ) is allowed?<\/p>", "opts": [["A", "(2, 2, 0)"], ["B", "(3, 1, 2)"], ["C", "(1, 0, 1)"], ["D", "(3, 2, −2)"]], "ans": "D", "exp": "<p>The rules are l = 0 … n − 1 and mₗ = −l … +l. (3, 2, −2) satisfies both. In A, l cannot equal n. In B, mₗ = 2 is larger than l = 1. In C, mₗ must be 0 when l = 0.<\/p>"}, {"n": 35, "stem": "<p>How many orbitals are in the n = 4 shell?<\/p>", "opts": [["A", "4"], ["B", "16"], ["C", "8"], ["D", "32"]], "ans": "B", "exp": "<p>A shell has n² orbitals, so 4² = 16 (4s: 1 + 4p: 3 + 4d: 5 + 4f: 7).<\/p>"}, {"n": 36, "stem": "<p>Which subshells exist in the n = 3 shell?<\/p>", "opts": [["A", "3s and 3p only"], ["B", "3p, 3d and 3f"], ["C", "3s, 3p and 3d"], ["D", "3s, 3p, 3d and 3f"]], "ans": "C", "exp": "<p>l = 0, 1, …, n − 1 gives l = 0, 1, 2 for n = 3, which are the 3s, 3p, and 3d subshells. 3f would need l = 3, and l cannot exceed n − 1 = 2.<\/p>"}, {"n": 37, "stem": "<p>What is the magnitude of the orbital angular momentum |L| of an electron in a d orbital?<\/p>", "opts": [["A", "2(h/2π)"], ["B", "√2 (h/2π)"], ["C", "√6 (h/2π)"], ["D", "6(h/2π)"]], "ans": "C", "exp": "<table><tr><th>L<\/th><th>= [l(l + 1)]^½ (h/2π). For d, l = 2, so<\/th><th>L<\/th><th>= √(2 × 3)(h/2π) = √6 (h/2π) ≈ 2.45 h/2π.<\/th><\/tr><\/table>"}, {"n": 38, "stem": "<p>Which values can the z-component of orbital angular momentum, L_z, take for an electron in a p orbital?<\/p>", "opts": [["A", "+h/2π, 0, −h/2π"], ["B", "+√2 h/2π only"], ["C", "0 only"], ["D", "+2h/2π, +h/2π, 0, −h/2π, −2h/2π"]], "ans": "A", "exp": "<p>L_z = mₗ(h/2π). For p (l = 1), mₗ = +1, 0, −1, so L_z = +h/2π, 0, −h/2π. Option D is for a d orbital, and B is the magnitude |L| for p.<\/p>"}, {"n": 39, "stem": "<p>How many radial nodes does a 3s orbital have?<\/p>", "opts": [["A", "0"], ["B", "2"], ["C", "1"], ["D", "3"]], "ans": "B", "exp": "<p>The number of radial nodes increases with n: 1s has 0, 2s has 1, and 3s has 2. In general it is n − l − 1 = 3 − 0 − 1 = 2.<\/p>"}, {"n": 40, "stem": "<p>For a hydrogen 1s electron, which statement is correct?<\/p>", "opts": [["A", "Both the point of highest probability density and the most probable distance are at the nucleus."], ["B", "The point of highest probability density is at a₀, and the most probable distance is at the nucleus."], ["C", "The probability density is zero at the nucleus."], ["D", "The point of highest probability density (Ψ²) is the nucleus, but the most probable distance (maximum of 4πr²R²) is a₀."]], "ans": "D", "exp": "<p>Ψ² for 1s is greatest at the nucleus. The radial distribution 4πr²R² includes the shell volume, and it peaks at r = a₀ (the Bohr radius).<\/p>"}, {"n": 41, "stem": "<p>Why is the radial distribution function 4πr²R²(r) zero at the nucleus, even for an s orbital?<\/p>", "opts": [["A", "Because s orbitals have a radial node at the nucleus."], ["B", "Because the volume of a spherical shell of radius r → 0 vanishes."], ["C", "Because Ψ is negative at the nucleus."], ["D", "Because the electron is repelled by the nucleus."]], "ans": "B", "exp": "<p>The radial probability is 4πr²R². The r² factor (the shell volume) makes it zero at r = 0, even though Ψ² for an s orbital is nonzero at the nucleus.<\/p>"}, {"n": 42, "stem": "<p>How do the energies of the 3s, 3p, and 3d orbitals of a hydrogen atom compare?<\/p>", "opts": [["A", "They are all equal, because in hydrogen the energy depends only on n."], ["B", "3s &lt; 3p &lt; 3d"], ["C", "3d &lt; 3p &lt; 3s"], ["D", "3s &lt; 3d &lt; 3p"]], "ans": "A", "exp": "<p>For one-electron atoms, Eₙ = −R_E Z²/n² depends only on n. All n = 3 orbitals therefore have the same energy (they are degenerate).<\/p>"}, {"n": 43, "stem": "<p>Which orbital does NOT exist?<\/p>", "opts": [["A", "2p"], ["B", "4f"], ["C", "3d"], ["D", "1p"]], "ans": "D", "exp": "<p>l must be ≤ n − 1. For n = 1, l can only be 0, so there is no 1p orbital. p orbitals first appear at n = 2.<\/p>"}, {"n": 44, "stem": "<p>How many angular nodes does each f orbital have, and for which elements are f orbitals important?<\/p>", "opts": [["A", "2; transition metals"], ["B", "1; main-group elements"], ["C", "3; lanthanides and actinides"], ["D", "0; noble gases"]], "ans": "C", "exp": "<p>The number of angular nodes equals l. For f orbitals l = 3, so each has 3 angular nodes. f orbitals are important for the lanthanides and actinides (d orbitals are the ones for the transition metals).<\/p>"}, {"n": 45, "stem": "<p>Using Eₙ = −R_E(Z²/n²), what is the energy of the n = 2 level of He⁺?<\/p>", "opts": [["A", "−5.45 × 10⁻¹⁹ J"], ["B", "−2.18 × 10⁻¹⁸ J"], ["C", "−4.36 × 10⁻¹⁸ J"], ["D", "−8.72 × 10⁻¹⁸ J"]], "ans": "B", "exp": "<p>E₂ = −R_E Z²/n² = −(2.18 × 10⁻¹⁸)(2²/2²) = −2.18 × 10⁻¹⁸ J. This is the same energy as the n = 1 level of hydrogen.<\/p>"}]}], "count": 45, "cards": 147}];
const COLORS = [['var(--g1)','var(--g1-soft)'],['var(--g2)','var(--g2-soft)'],['var(--g3)','var(--g3-soft)']];

};

  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const state = store.get('chem713', {tab:0, mode:'instant', groups:{}});
DATA.forEach(g => { state.groups[g.slug] ??= {answers:{}, submitted:false, filter:'all', order:null}; });
const save = () => store.set('chem713', state);
let fresh = null; // question number whose explanation was just revealed

const themeBtn = document.getElementById('theme');
const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
const applyTheme = t => {
  if(t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  themeBtn.innerHTML = icon(isDark() ? 'sun' : 'moon');
};
applyTheme(store.get('chem713-theme', null));
themeBtn.onclick = () => { const next = isDark() ? 'light' : 'dark'; applyTheme(next); store.set('chem713-theme', next); };

const tabs = document.getElementById('tabs');
DATA.forEach((g, i) => {
  const b = document.createElement('button');
  b.setAttribute('role','tab'); b.style.setProperty('--gc', COLORS[i][0]);
  b.innerHTML = `<span class="dot"></span>${g.name}<small>${g.count}</small>`;
  b.onclick = () => { state.tab = i; save(); fresh = null; render(); scrollTo({top:0}); };
  tabs.appendChild(b);
});

const allQs = g => g.sections.flatMap(s => s.qs);
function graded(gs, q){
  const a = gs.answers[q.n];
  if(!a || (state.mode === 'exam' && !gs.submitted)) return null;
  return a === q.ans;
}
const subtitle = g => g.title.replace(/^Lectures?\s[\d–-]+\s*(Practice Problems)?[:\s–-]*/i,'') || 'Practice problems';

function render(){
  const i = state.tab, g = DATA[i], gs = state.groups[g.slug];
  [...tabs.children].forEach((b, j) => b.setAttribute('aria-selected', j === i));
  const root = document.documentElement;
  root.style.setProperty('--gc', COLORS[i][0]); root.style.setProperty('--gc-soft', COLORS[i][1]);
  const exam = state.mode === 'exam';
  const main = document.getElementById('main');
  main.innerHTML = `
    <section class="intro">
      <h2 class="serif">${g.name}</h2>
      <p>${subtitle(g)}</p>
      <div class="meta">
        <a class="quizlet" href="${QUIZLET[g.slug]}" target="_blank" rel="noopener">${icon('book')}Study flashcards on Quizlet${icon('ext')}</a>
        <span class="counts"><b>${g.cards}</b> flashcards · <b>${g.count}</b> practice problems</span>
      </div>
      ${g.intro.trim() ? `<details class="ref"><summary>Formulas and constants${icon('chev','i chev')}</summary><div class="body">${g.intro}</div></details>` : ''}
    </section>
    <div class="bar">
      <div class="controls">
        <div class="seg" role="group" aria-label="Quiz mode">
          <button data-mode="instant" aria-pressed="${!exam}">Instant feedback</button>
          <button data-mode="exam" aria-pressed="${exam}">Exam mode</button>
        </div>
        <div class="seg" role="group" aria-label="Filter questions">
          <button data-f="all" aria-pressed="${gs.filter==='all'}">All</button>
          <button data-f="open" aria-pressed="${gs.filter==='open'}">Unanswered</button>
          <button data-f="missed" aria-pressed="${gs.filter==='missed'}">Missed</button>
        </div>
        <div class="tools">
          <button class="tool" id="shuffle" aria-pressed="${!!gs.order}" title="Shuffle question order">${icon('shuffle')}<span>Shuffle</span></button>
          <button class="tool" id="reset" title="Clear answers for this group">${icon('reset')}<span>Reset</span></button>
        </div>
      </div>
      <div class="prog" id="prog"></div>
      <div class="stats" id="stats"></div>
    </div>
    <div id="qs"></div>
    ${exam && !gs.submitted ? `<div class="submit"><button class="quizlet" id="submit">Submit and grade</button></div>` : ''}`;
  root.style.setProperty('--hh', document.querySelector('header').offsetHeight + 'px');

  main.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    if(state.mode === b.dataset.mode) return;
    state.mode = b.dataset.mode;
    DATA.forEach(x => { state.groups[x.slug].submitted = false; });
    fresh = null; save(); render();
  });
  main.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { gs.filter = b.dataset.f; fresh = null; save(); render(); });
  main.querySelector('#reset').onclick = () => {
    if(!confirm(`Clear all answers for ${g.name}?`)) return;
    gs.answers = {}; gs.submitted = false; fresh = null; save(); render();
  };
  main.querySelector('#shuffle').onclick = () => {
    if(gs.order) gs.order = null;
    else { const ns = allQs(g).map(q => q.n); for(let k = ns.length - 1; k > 0; k--){ const r = Math.floor(Math.random()*(k+1)); [ns[k], ns[r]] = [ns[r], ns[k]]; } gs.order = ns; }
    fresh = null; save(); render();
  };
  const sub = main.querySelector('#submit');
  if(sub) sub.onclick = () => {
    const left = g.count - Object.keys(gs.answers).length;
    if(left && !confirm(`${left} question${left > 1 ? 's' : ''} unanswered. Submit anyway?`)) return;
    gs.submitted = true; fresh = null; save(); render(); scrollTo({top:0, behavior:'smooth'});
  };
  drawQs(g, gs); drawStats(g, gs);
}

function drawStats(g, gs){
  let right = 0, wrong = 0;
  allQs(g).forEach(q => { const r = graded(gs, q); if(r === true) right++; else if(r === false) wrong++; });
  const answered = Object.keys(gs.answers).length, p = document.getElementById('prog'), s = document.getElementById('stats');
  if(state.mode === 'exam' && !gs.submitted){
    p.innerHTML = `<i class="a" style="width:${answered/g.count*100}%"></i>`;
    s.innerHTML = `<span><b>${answered}</b> of ${g.count} answered</span><span>Graded when you submit</span>`;
  } else {
    p.innerHTML = `<i class="g" style="width:${right/g.count*100}%"></i><i class="b" style="width:${wrong/g.count*100}%"></i>`;
    const pct = right + wrong ? Math.round(right/(right+wrong)*100) : 0;
    s.innerHTML = `<span><b class="s-good">${right}</b> correct · <b class="s-bad">${wrong}</b> missed · <b>${g.count - right - wrong}</b> left</span>`
      + `<span>${gs.submitted ? `Final <b>${right}/${g.count}</b> · ` : ''}Accuracy <b>${pct}%</b></span>`;
  }
}

function drawQs(g, gs){
  const box = document.getElementById('qs');
  const secs = gs.order
    ? [{title:'Shuffled order', qs: gs.order.map(n => allQs(g).find(q => q.n === n)).filter(Boolean)}]
    : g.sections;
  let html = '';
  secs.forEach(s => {
    const qs = s.qs.filter(q => gs.filter === 'open' ? !gs.answers[q.n] : gs.filter === 'missed' ? graded(gs, q) === false : true);
    if(!qs.length) return;
    if(s.title) html += `<h3 class="sec serif">${s.title}</h3>`;
    qs.forEach(q => { html += qHTML(gs, q); });
  });
  box.innerHTML = html || `<div class="empty">${gs.filter === 'missed' ? 'No missed questions in this group.' : 'Every question in this group is answered.'}</div>`;
  box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const n = +b.dataset.n;
    if(state.mode === 'instant' ? gs.answers[n] : gs.submitted) return;
    gs.answers[n] = b.dataset.l; fresh = n; save();
    const y = b.getBoundingClientRect().top;
    drawQs(g, gs); drawStats(g, gs);
    const nb = box.querySelector(`.opt[data-n="${n}"]`);
    if(nb) scrollBy(0, nb.getBoundingClientRect().top - y);
  });
}

function qHTML(gs, q){
  const a = gs.answers[q.n], r = graded(gs, q), done = r !== null;
  const locked = state.mode === 'instant' ? !!a : gs.submitted;
  const showExp = done || (state.mode === 'exam' && gs.submitted);
  const opts = q.opts.map(([L, t]) => {
    let c = '', mk = '';
    if(showExp){ if(L === q.ans){ c = 'ok'; mk = icon('check','i mk'); } else if(L === a){ c = 'no'; mk = icon('x','i mk'); } }
    else if(L === a) c = 'sel';
    return `<button class="opt ${c}" data-n="${q.n}" data-l="${L}" ${locked ? 'disabled' : ''}><span class="L">${L}</span><span class="t">${t}</span>${mk}</button>`;
  }).join('');
  const verdict = r === true ? 'Correct.' : r === false ? `Not quite. The answer is ${q.ans}.` : `Answer: ${q.ans}.`;
  const exp = showExp ? `<div class="exp${fresh === q.n ? ' fresh' : ''}"><span class="v">${verdict}</span>${q.exp.replace(/^<p>/, '<p style="display:inline">')}</div>` : '';
  return `<article class="q ${r === true ? 'right' : r === false ? 'wrong' : ''}"><div class="stem"><span class="qn">${q.n}.</span>${q.stem}</div><div class="opts">${opts}</div>${exp}</article>`;
}

render();
</script>
</body>
</html>
