iety"], ["D", "a violation-of-expectation response"]], "ans": "A", "exp": "<p>Searching under A after watching the toy hidden under B is the A-not-B error around 8 months.<\/p>", "tag": "Ch 5"}, {"n": 162, "stem": "<p>In the 1985 drawbridge study, why is it convincing that 5-month-olds looked longer at the \"impossible\" event?<\/p>", "opts": [["A", "The impossible event was the new, shorter swing, so the babies' interest in novelty explains it"], ["B", "The babies reached behind the screen for the hidden box, showing object permanence directly"], ["C", "The familiar motion drew longer looking, which makes sense only if they expected the box to stop it"], ["D", "The babies were too young to habituate, so any longer looking must reflect surprise"]], "ans": "C", "exp": "<p>The impossible event was the familiar motion, so novelty would predict longer looking at the shorter swing instead; A reverses the design.<\/p>", "tag": "Ch 5"}, {"n": 163, "stem": "<p>Which feature of the violation-of-expectation method moved researchers beyond Piaget's search tasks?<\/p>", "opts": [["A", "It requires the child to explain verbally where the object went"], ["B", "It uses random assignment of babies to possible and impossible events"], ["C", "It tests only children over age 2, once language has emerged"], ["D", "It requires no reaching; babies just look longer at what surprises them"]], "ans": "D", "exp": "<p>Violation of expectation measures looking time, so it requires no reaching, unlike Piaget's search task.<\/p>", "tag": "Ch 5"}, {"n": 164, "stem": "<p>In Wynn's (1992) baby math study, 5-month-olds looked longer when:<\/p>", "opts": [["A", "one doll remained after one of two was removed"], ["B", "two dolls remained after one of two was removed"], ["C", "the screen was lowered slowly"], ["D", "the dolls were replaced with toy policemen"]], "ans": "B", "exp": "<p>Babies looked longer at the surprising result (2 - 1 = 2) than at the expected one, suggesting Piaget underestimated infants.<\/p>", "tag": "Ch 5"}, {"n": 165, "stem": "<p>When the three mountains task was replaced with a familiar game of hiding a doll from toy policemen:<\/p>", "opts": [["A", "most 3½- to 5-year-olds still picked their own view"], ["B", "only formal-operational children succeeded"], ["C", "most 3½- to 5-year-olds succeeded"], ["D", "children showed the A-not-B error"]], "ans": "C", "exp": "<p>With a familiar game, most 3½- to 5-year-olds succeeded, showing the three mountains task underestimated them.<\/p>", "tag": "Ch 5"}, {"n": 166, "stem": "<p>A 9-year-old is asked, \"If snow were black, what color would a snowman be?\" and answers, \"Snow isn't black!\" According to Piaget, this child has not yet reached:<\/p>", "opts": [["A", "the sensorimotor stage"], ["B", "the preoperational stage"], ["C", "concrete operations"], ["D", "formal operations"]], "ans": "D", "exp": "<p>Reasoning about hypotheticals is the mark of formal operations, which begins around 12.<\/p>", "tag": "Ch 5"}]}, {"title": "Chapter 5 · Theory of mind: the false-belief test", "qs": [{"n": 167, "stem": "<p>In the Sally-Anne task, a typical 3-year-old says Sally will look for her marble in the box. Why?<\/p>", "opts": [["A", "The child cannot separate her own knowledge from Sally's"], ["B", "The child lacks object permanence for the marble"], ["C", "The child is using private speech to guide her answer"], ["D", "The child has accommodated a new schema"]], "ans": "A", "exp": "<p>Three-year-olds cannot separate their own knowledge of the marble's location from Sally's false belief.<\/p>", "tag": "Ch 5"}, {"n": 168, "stem": "<p>A meta-analysis of 178 studies found that, in many countries, children usually shift to passing false-belief tests between about:<\/p>", "opts": [["A", "1 and 2 years"], ["B", "6 and 7 years"], ["C", "3½ and 4½ years"], ["D", "7 and 11 years"]], "ans": "C", "exp": "<p>The shift usually occurs between about 3½ and 4½; eye-tracking claims that 1- and 2-year-olds track false beliefs have proven hard to replicate.<\/p>", "tag": "Ch 5"}, {"n": 169, "stem": "<p>According to the guide, what is the strongest predictor of passing false-belief tests earlier?<\/p>", "opts": [["A", "Number of siblings"], ["B", "Language skill"], ["C", "Amount of pretend play"], ["D", "Attachment style"]], "ans": "B", "exp": "<p>Siblings, pretend play, and mind talk all help, but language skill is the strongest predictor.<\/p>", "tag": "Ch 5"}, {"n": 170, "stem": "<p>Deaf children of hearing, non-fluently-signing parents are often delayed on theory of mind, while deaf children of fluent signers are not. What does this suggest?<\/p>", "opts": [["A", "Deafness itself delays theory of mind"], ["B", "Theory of mind is fixed by temperament"], ["C", "Talking about minds helps children discover them"], ["D", "Hearing spoken words is necessary for theory of mind"]], "ans": "C", "exp": "<p>The delay depends on fluent language at home, not deafness itself, so talking about minds helps children discover them.<\/p>", "tag": "Ch 5"}, {"n": 171, "stem": "<p>What is the current status of eye-tracking studies suggesting that 1- and 2-year-olds track false beliefs?<\/p>", "opts": [["A", "They have proven hard to replicate"], ["B", "They were confirmed by a 178-study meta-analysis"], ["C", "They showed the shift occurs at 3.5 to 4.5 months"], ["D", "They were replicated by ManyBabies 4 at chance level"]], "ans": "A", "exp": "<p>The guide says these eye-tracking studies have proven hard to replicate; ManyBabies 4 concerned the helper/hinderer study, not false belief.<\/p>", "tag": "Ch 5"}]}, {"title": "Chapter 5 · Reflecting on Piaget", "qs": [{"n": 172, "stem": "<p>Which is a revision of Piaget's theory rather than something that holds up?<\/p>", "opts": [["A", "Children are active thinkers who construct their own understanding of the world"], ["B", "The sequence of milestones holds up across many different cultures"], ["C", "Children think differently from adults, not just less"], ["D esent to hear it"], ["D", "Self-talk increases on harder tasks and predicts better performance"]], "ans": "D", "exp": "<p>More private speech on harder tasks and better performance fits Vygotsky's self-guidance view, not Piaget's fading egocentric speech.<\/p>", "tag": "Ch 5"}, {"n": 176, "stem": "<p>In the 2018 study of children wearing recorders, what predicted language scores better than the number of words heard, and what is a key caution?<\/p>", "opts": [["A", "Conversational turns; correlational, and the brain finding is activity, not structure"], ["B", "Adult words heard; the sample was too small for the result to replicate"], ["C", "Child words spoken; it used random assignment, so it may not generalize to homes"], ["D", "Television exposure; the fMRI data concerned brain structure only"]], "ans": "A", "exp": "<p>Conversational turns beat words heard; the study is correlational, and the Broca's area finding concerns activity, not structure.<\/p>", "tag": "Ch 5"}, {"n": 177, "stem": "<p>How do Piaget and Vygotsky differ on the role of language?<\/p>", "opts": [["A", "Piaget: language creates thought; Vygotsky: language reflects thought that already exists"], ["B", "Both held that language reflects thought that already exists"], ["C", "Piaget: language reflects existing thought; Vygotsky: language creates thought"], ["D", "Both held that language is irrelevant before age 7"]], "ans": "C", "exp": "<p>Piaget held that language reflects existing thought; Vygotsky held that it creates thought and becomes inner speech.<\/p>", "tag": "Ch 5"}]}, {"title": "Chapter 5 · Our moral sense: Piaget and Kohlberg", "qs": [{"n": 178, "stem": "<p>A 5-year-old says John, who accidentally broke 15 cups coming to dinner, is naughtier than Henry, who broke 1 cup sneaking jam. A 10-year-old says Henry is naughtier. Which of Piaget's shifts does this show?<\/p>", "opts": [["A", "Realism to relativism"], ["B", "Prescriptions to principles"], ["C", "Outcomes to intentions"], ["D", "Pre ed sequence.<\/p>", "tag": "Ch 5"}]}, {"title": "Chapter 5 · Moral feelings before moral reasons", "qs": [{"n": 185, "stem": "<p>What happened when Hamlin, Wynn, and Bloom's helper/hinderer study was tested in ManyBabies 4 (37 labs, 567 infants, preregistered)?<\/p>", "opts": [["A", "Only 49% chose the helper (chance), so the question remains open"], ["B", "88% of infants chose the helper, confirming the original finding"], ["C", "Infants preferred the hinderer, reversing the original result"], ["D", "It could not be run, because the method was judged unethical"]], "ans": "A", "exp": "<p>ManyBabies 4 found 49% chose the helper, chance level; the question remains open and the method may not reveal preferences.<\/p>", "tag": "Ch 5"}, {"n": 186, "stem": "<p>Why is Warneken and Tomasello's (2006) toddler-helping finding considered sturdier evidence that toddlers read intentions?<\/p>", "opts": [["A", "It was tested in 37 labs on five continents, with a preregistered plan"], ["B", "Toddlers were rewarded with a toy each time they helped"], ["C", "Toddlers did not help when the adult threw the clothespin down on purpose"], ["D", "The adult explicitly asked the toddlers for help each time"]], "ans": "C", "exp": "<p>The intentional-drop control shows toddlers helped only when the adult had an unmet goal, so they were reading intentions.<\/p>", "tag": "Ch 5"}, {"n": 187, "stem": "<p>People insist it is wrong for a family to cook and eat their dog after it was killed by a car, even though no one is harmed; when each reason is ruled out, they say \"I just know it's wrong.\" According to Haidt, this shows:<\/p>", "opts": [["A", "postconventional reasoning based on principles above particular laws"], ["B", "that reasoning weighs evidence like a judge before any judgment is made"], ["C", "egocentrism, an inability to take the family's point of view"], ["D", "moral dumbfounding: intuition first, with reasoning as its lawyer"]], "ans": "D", "exp": "<p>Judging without reasons is moral dumbfounding; Haidt's model says reasoning follows intuition like a lawyer, not a judge.<\/p>", "tag": "Ch 5"}]}], "count": 187, "cards": 366, "quizlet": "https://quizlet.com/1230928513/"}]};

const tagsOf = g => [...new Set(allQs(g).map(q => q.tag).filter(Boolean))];
function drawTags(g, gs){
  const box = document.getElementById('tags');

  const stat = t => {
    const qs = allQs(g).filter(q => !t || q.tag === t);
    let r = 0, w = 0; qs.forEach(q => { const v = graded(gs, q); if(v === true) r++; else if(v === false) w++; });
    const pct = r + w ? Math.round(r/(r+w)*100) : null;
    const cls = pct === null ? '' : pct < 70 ? 'lo' : pct >= 85 ? 'hi' : '';
    return `<span class="pct ${cls}">${pct === null ? qs.length + ' Qs' : pct + '%'}</span>`;
  };
  box.innerHTML = ['', ...tagsOf(g)].map(t => `<button class="chip" data-tag="${t}" aria-pressed="${gs.tag === t}">${t || 'All'}${stat(t)}</button>`).join('');
  box.querySelectorAll('.chip').forEach(b => b.onclick = () => { gs.tag = b.dataset.tag; fresh = null; save(); drawQs(g, gs); drawTags(g, gs); });
}
function drawStats(g, gs){
  drawTags(g, gs);
  let right = 0, wrong = 0;
  allQs(g).forEach(q => { const r = graded(gs, q); if(r === true) right++; else if(r === false) wrong++; });
  const answered = Object.keys(gs.answers).length, p = document.getElementById('prog'), s = document.getElementById('stats');
  if(state.mode === 'exam' && !gs.submitted){
    p.innerHTML = `<i class="a" style="width:${answered/g.count*100}%"></i>`;

  } else {
    p.innerHTML = `<i class="g" style="width:${right/g.count*100}%"></i><i class="b" style="width:${wrong/g.count*100}%"></i>`;
    const pct = right + wrong ? Math.round(right/(right+wrong)*100) : 0;
    s.innerHTML = `<span><b class="s-good">${right}</b> correct · <b class="s-bad">${wrong}</b> missed · <b>${g.count - right - wrong}</b> left</span>`
      + `<span>${gs.submitted ? `Final <b>${right}/${g.count}</b> · ` : ''}Accuracy <b>${pct}%</b></span>`;
  }
}

  });
  box.querySelectorAll('.flag').forEach(b => b.onclick = () => {
    const n = +b.dataset.n;
    if(gs.flags[n]) delete gs.flags[n]; else gs.flags[n] = true;
    save(); b.setAttribute('aria-pressed', !!gs.flags[n]);
  });
  box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const n = +b.dataset.n;
    if(state.mode === 'instant' ? gs.answers[n] : gs.submitted) return;
    gs.answers[n] = b.dataset.l; fresh = n; save();
    const y = b.getBoundingClientRect().top;
    drawQs(g, gs); drawStats(g, gs);
    const nb = box.querySelector(`.opt[data-n="${n}"]`);
    if(nb) scrollBy(0, nb.getBoundingClientRect().top - y);
  });
}

function qHTML(gs, q){
  const a = gs.answers[q.n], r = graded(gs, q), done = r !== null;
  const locked = state.mode === 'instant' ? !!a : gs.submitted;
  const showExp = done || (state.mode === 'exam' && gs.submitted);
  const opts = q.opts.map(([L, t]) => {
    let c = '', mk = '';
    if(showExp){ if(L === q.ans){ c = 'ok'; mk = icon('check','i mk'); } else if(L === a){ c = 'no'; mk = icon('x','i mk'); } }
    else if(L === a) c = 'sel';
    return `<button class="opt ${c}" data-n="${q.n}" data-l="${L}" ${locked ? 'disabled' : ''}><span class="L">${L}</span><span class="t">${t}</span>${mk}</button>`;
  }).join('');
  const verdict = r === true ? 'Correct.' : r === false ? `Not quite. The answer is ${q.ans}.` : `Answer: ${q.ans}.`;
  const exp = showExp ? `<div class="exp${fresh === q.n ? ' fresh' : ''}"><span class="v">${verdict}</span>${q.exp.replace(/^<p>/, '<p style="display:inline">')}</div>` : '';
  const undo = state.mode === 'instant' && a ? `<button class="undo" data-n="${q.n}">${icon('reset')}<span>Undo answer</span></button>` : '';
  const tag = q.tag ? `<span class="tag">${q.tag}</span>` : '';
  const flag = `<button class="flag" data-n="${q.n}" aria-pressed="${!!gs.flags[q.n]}" title="Flag for review" aria-label="Flag question ${q.n} for review">${icon('flag')}</button>`;
  return `<article class="q ${r === true ? 'right' : r === false ? 'wrong' : ''}${locked ? ' done' : ''}" data-n="${q.n}"><div class="qhead"><div class="stem">${tag}<span class="qn">${q.n}.</span>${q.stem}</div>${flag}</div><div class="opts">${opts}</div>${exp}${undo}</article>`;
}

render();

// Keyboard: A-D / 1-4 answer the question in view, F flags it, N jumps to the next unanswered one.
const topEdge = () => document.querySelector('header').offsetHeight + (innerWidth > 620 ? document.querySelector('.bar').offsetHeight : 0);
const inView = sel => [...document.querySelectorAll(sel)].find(el => el.getBoundingClientRect().bottom > topEdge() + 60);
addEventListener('keydown', e => {
  if(e.ctrlKey || e.metaKey || e.altKey || /input|textarea|select/i.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  const letter = {a:'A', b:'B', c:'C', d:'D', '1':'A', '2':'B', '3':'C', '4':'D'}[k];
  if(letter){
    const el = inView('#qs .q:not(.done)');
    const btn = el && el.querySelector(`.opt[data-l="${letter}"]`);
    if(btn && !btn.disabled){ e.preventDefault(); btn.click(); }
  } else if(k === 'f'){
    const el = inView('#qs .q'); if(el){ e.preventDefault(); el.querySelector('.flag').click(); }
  } else if(k === 'n'){
    const cur = inView('#qs .q');
    const all = [...document.querySelectorAll('#qs .q:not(.done)')];
    const next = all.find(x => cur && x !== cur && x.getBoundingClientRect().top > cur.getBoundingClientRect().top) || all[0];
    if(next){ e.preventDefault(); scrollBy({top: next.getBoundingClientRect().top - topEdge() - 16, behavior:'smooth'}); }
  }
});
// Remember where you were in each tab, so a reopened page lands in the same spot.
state.scroll ||= {};
requestAnimationFrame(() => scrollTo(0, state.scroll[DATA[state.tab].slug] || 0));
let scrollTimer;
addEventListener('scroll', () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => { state.scroll[DATA[state.tab].slug] = Math.round(scrollY); save(); }, 200);
}, {passive:true});
</script>
</body>
</html>
