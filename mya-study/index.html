energy of an emitted electron? (h = 6.626 × 10⁻³⁴ J·s, c = 2.9979 × 10⁸ m/s)<\/p>", "opts": [["A", "1.16 × 10⁻¹⁸ J"], ["B", "4.25 × 10⁻¹⁹ J"], ["C", "7.95 × 10⁻¹⁹ J"], ["D", "3.70 × 10⁻¹⁹ J"]], "ans": "B", "exp": "<p>E_photon = hc/λ = (6.626 × 10⁻³⁴)(2.9979 × 10⁸)/(2.50 × 10⁻⁷ m) = 7.95 × 10⁻¹⁹ J. KE = hν − hν₀ = 7.95 × 10⁻¹⁹ J − 3.70 × 10⁻¹⁹ J = 4.25 × 10⁻¹⁹ J.<\/p>", "tag": ""}, {"n": 18, "stem": "<p>What is the de Broglie wavelength of an electron (mass = 9.11 × 10⁻³¹ kg) traveling at 2.5 × 10⁶ m/s? (h = 6.626 × 10⁻³⁴ J·s)<\/p>", "opts": [["A", "1.5 × 10⁻⁵⁷ m"], ["B", "7.3 × 10⁻⁴ m"], ["C", "3.4 × 10⁹ m"], ["D", "2.9 × 10⁻¹⁰ m"]], "ans": "D", "exp": "<p>λ = h/(mv) = (6.626 × 10⁻³⁴ kg·m²/s)/[(9.11 × 10⁻³¹ kg)(2.5 × 10⁶ m/s)] = 2.9 × 10⁻¹⁰ m. (1 J = 1 kg·m²/s²)<\/p>", "tag": ""}, {"n": 19, "stem": "<p>What is the de Broglie wavelength of a 0.145-kg baseball moving at 40.0 m/s? (h = 6.626 × 10⁻³⁴ J·s)<\/p>", "opts": [["A", "1.14 × 10⁻³⁴ m"], ["B", "3.84 × 10⁻³³ m"], ["C", "8.75 × 10³³ m"], ["D", "4.57 × 10⁻³³ m"]], "ans": "A", "exp": "<p>λ = h/(mv) = (6.626 × 10⁻³⁴ kg·m²/s)/[(0.145 kg)(40.0 m/s)] = 1.14 × 10⁻³⁴ m. This is far too small to observe, so the ball behaves as a particle.<\/p>", "tag": ""}, {"n": 20, "stem": "<p>At what speed must an electron (mass = 9.11 × 10⁻³¹ kg) travel to have a de Broglie wavelength of 1.00 × 10⁻¹⁰ m, about the spacing between atoms in a crystal? (h = 6.626 × 10⁻³⁴ J·s)<\/p>", "opts": [["A", "7.27 × 10⁶ m/s"], ["B", "7.27 × 10⁻¹⁴ m/s"], ["C", "1.37 × 10⁻⁷ m/s"], ["D", "7.27 × 10⁹ m/s"]], "ans": "A", "exp": "<p>λ = h/(mv), so v = h/(mλ) = (6.626 × 10⁻³⁴ kg·m²/s)/[(9.11 × 10⁻³¹ kg)(1.00 × 10⁻¹⁰ m)] = 7.27 × 10⁶ m/s.<\/p>", "tag": ""}, {"n": 21, "stem": "<p>What is the de Broglie wavelength of a neutron (mass = 1.675 × 10⁻²⁷ kg) moving at 1.00 × 10³ m/s? (h = 6.626 × 10⁻³⁴ J·s)<\/p>", "opts": [["A", "3.96 × 10⁻⁴ m"], ["B", "3.96 × 10⁻⁷ m"], ["C", "2.53 × 10⁹ m"], ["D", "3.96 × 10⁻¹⁰ m"]], "ans": "D", "exp": "<p>λ = h/(mv) = (6.626 × 10⁻³⁴ kg·m²/s)/[(1.675 × 10⁻²⁷ kg)(1.00 × 10³ m/s)] = 3.96 × 10⁻¹⁰ m.<\/p>", "tag": ""}, {"n": 22, "stem": "<p>Using Einstein's relationship between energy and mass, what mass is associated with 1.80 × 10¹⁴ J of energy? (c = 2.9979 × 10⁸ m/s)<\/p>", "opts": [["A", "1.62 × 10³¹ kg"], ["B", "4.99 × 10² kg"], ["C", "6.00 × 10⁵ kg"], ["D", "2.00 × 10⁻³ kg"]], "ans": "D", "exp": "<p>E = mc², so m = E/c² = (1.80 × 10¹⁴ J)/(2.9979 × 10⁸ m/s)² = 2.00 × 10⁻³ kg (1 J = 1 kg·m²/s²).<\/p>", "tag": ""}, {"n": 23, "stem": "<p>Davisson and Germer directed a beam of electrons at a nickel crystal and observed a diffraction pattern. This result<\/p>", "opts": [["A", "showed that light consists only of waves"], ["B", "proved that photons have rest mass"], ["C", "showed that electrons orbit the nucleus in circular orbits"], ["D", "verified de Broglie's relationship by showing that electrons have wave properties"]], "ans": "D", "exp": "<p>A diffraction pattern can be explained only in terms of waves, so electron diffraction confirmed that electrons have an associated wavelength, λ = h/mv.<\/p>", "tag": ""}, {"n": 24, "stem": "<p>In a diffraction pattern, bright areas result from<\/p>", "opts": [["A", "destructive interference, where the waves are out of phase"], ["B", "absorption of the radiation by the crystal"], ["C", "constructive interference, where the peaks and troughs of the scattered waves are in phase"], ["D", "photons losing their momentum in collisions"]], "ans": "C", "exp": "<p>Waves in phase (peaks matching) add constructively to give bright areas; waves out of phase (peak meets trough) cancel to give dark spots.<\/p>", "tag": ""}, {"n": 25, "stem": "<p>Which statement about the dual nature of matter and energy is correct?<\/p>", "opts": [["A", "Large objects show predominantly wave properties because of their large momentum."], ["B", "Photons have the same rest mass as electrons."], ["C", "All matter exhibits both particulate and wave properties; electrons show both noticeably, while a baseball's wavelength is too small to observe."], ["D", "Only electromagnetic radiation has wave properties; matter is purely particulate."]], "ans": "C", "exp": "<p>Matter and energy are not distinct. Large pieces of matter behave mainly as particles, photons mainly as waves (no rest mass), and electrons clearly show both.<\/p>", "tag": ""}]}, {"title": "The Atomic Spectrum of Hydrogen", "qs": [{"n": 26, "stem": "<p>The hydrogen emission spectrum is a line spectrum rather than a continuous spectrum. This shows that<\/p>", "opts": [["A", "the electron in hydrogen can have any energy"], ["B", "only certain energies are allowed for the electron in the hydrogen atom (its energy is quantized)"], ["C", "hydrogen atoms emit all wavelengths of visible light"], ["D", "hydrogen absorbs light but never emits it"]], "ans": "B", "exp": "<p>A line spectrum contains only a few discrete wavelengths, which result from changes between discrete (quantized) energy levels. If any energy were allowed, the spectrum would be continuous.<\/p>", "tag": ""}, {"n": 27, "stem": "<p>Which of the following produces a continuous spectrum?<\/p>", "opts": [["A", "White light passed through a prism"], ["B", "Excited hydrogen atoms in a discharge tube"], ["C", "Sodium atoms emitting at 589 nm"], ["D", "A hydrogen atom whose electron falls from n = 6 to n = 1"]], "ans": "A", "exp": "<p>White light (like a rainbow) contains all wavelengths of visible light, giving a continuous spectrum. Excited atoms give line spectra.<\/p>", "tag": ""}]}, {"title": "The Bohr Model", "qs": [{"n": 28, "stem": "<p>Using the Bohr model, what is the energy of the electron in the n = 3 level of a hydrogen atom? (Eₙ = −2.178 × 10⁻¹⁸ J (Z²/n²))<\/p>", "opts": [["A", "−2.42 × 10⁻¹⁹ J"], ["B", "2.42 × 10⁻¹⁹ J"], ["C", "−1.96 × 10⁻¹⁷ J"], ["D", "−7.26 × 10⁻¹⁹ J"]], "ans": "A", "exp": "<p>E₃ = −2.178 × 10⁻¹⁸ J (1²/3²) = −2.42 × 10⁻¹⁹ J. The negative sign means the bound electron is lower in energy than at n = ∞ (E = 0).<\/p>", "tag": ""}, {"n": 29, "stem": "<p>An electron in a hydrogen atom falls from n = 5 to n = 2. What is the wavelength of the emitted photon? (ΔE = −2.178 × 10⁻¹⁸ J (1/n_final² − 1/n_initial²), h = 6.626 × 10⁻³⁴ J·s, c = 2.9979 × 10⁸ m/s)<\/p>", "opts": [["A", "304 nm"], ["B", "314 nm"], ["C", "95.0 nm"], ["D", "434 nm"]], "ans": "D", "exp": "<p>ΔE = −2.178 × 10⁻¹⁸ J (1/2² − 1/5²) = −4.574 × 10⁻¹⁹ J. λ = hc/|ΔE| = (6.626 × 10⁻³⁴)(2.9979 × 10⁸)/(4.574 × 10⁻¹⁹ J) = 4.343 × 10⁻⁷ m = 434 nm (visible, violet).<\/p>", "tag": ""}, {"n": 30, "stem": "<p>How much energy must a hydrogen atom absorb to move its electron from n = 2 to n = 4? (ΔE = −2.178 × 10⁻¹⁸ J (1/n_final² − 1/n_initial²))<\/p>", "opts": [["A", "−4.08 × 10⁻¹⁹ J"], ["B", "6.81 × 10⁻¹⁹ J"], ["C", "5.45 × 10⁻¹⁹ J"], ["D", "4.08 × 10⁻¹⁹ J"]], "ans": "D", "exp": "<p>ΔE = −2.178 × 10⁻¹⁸ J (1/4² − 1/2²) = −2.178 × 10⁻¹⁸ J (0.0625 − 0.2500) = 4.08 × 10⁻¹⁹ J. The positive sign shows energy is absorbed (λ = hc/ΔE = 486 nm).<\/p>", "tag": ""}, {"n": 31, "stem": "<p>What is the minimum energy needed to remove the electron from one mole of ground-state hydrogen atoms? (E = −2.178 × 10⁻¹⁸ J (Z²/n²), Nᴀ = 6.022 × 10²³ mol⁻¹)<\/p>", "opts": [["A", "1312 kJ/mol"], ["B", "2623 kJ/mol"], ["C", "2.178 × 10⁻¹⁸ kJ/mol"], ["D", "328 kJ/mol"]], "ans": "A", "exp": "<p>Removing the electron means n_final = ∞: ΔE = −2.178 × 10⁻¹⁸ J (1/∞ − 1/1²) = 2.178 × 10⁻¹⁸ J per atom. Per mole: (2.178 × 10⁻¹⁸ J)(6.022 × 10²³ mol⁻¹) = 1.312 × 10⁶ J/mol = 1312 kJ/mol.<\/p>", "tag": ""}, {"n": 32, "stem": "<p>What is the minimum energy required to remove the electron from a hydrogen atom that is in the n = 3 excited state? (ΔE = −2.178 × 10⁻¹⁸ J (1/n_final² − 1/n_initial²))<\/p>", "opts": [["A", "2.42 × 10⁻¹⁹ J"], ["B", "7.26 × 10⁻¹⁹ J"], ["C", "1.94 × 10⁻¹⁸ J"], ["D", "2.178 × 10⁻¹⁸ J"]], "ans": "A", "exp": "<p>n_initial = 3, n_final = ∞: ΔE = −2.178 × 10⁻¹⁸ J (0 − 1/3²) = 2.42 × 10⁻¹⁹ J.<\/p>", "tag": ""}, {"n": 33, "stem": "<p>Equation (12.1) applies to all one-electron species. What is the energy of the electron in the ground state (n = 1) of He⁺? (E = −2.178 × 10⁻¹⁸ J (Z²/n²))<\/p>", "opts": [["A", "−4.356 × 10⁻¹⁸ J"], ["B", "−8.712 × 10⁻¹⁸ J"], ["C", "−2.178 × 10⁻¹⁸ J"], ["D", "−5.445 × 10⁻¹⁹ J"]], "ans": "B", "exp": "<p>For He⁺, Z = 2: E₁ = −2.178 × 10⁻¹⁸ J (2²/1²) = −8.712 × 10⁻¹⁸ J.<\/p>", "tag": ""}, {"n": 34, "stem": "<p>The electron in a Li²⁺ ion (Z = 3) falls from n = 3 to n = 2. What is the wavelength of the emitted photon? (E = −2.178 × 10⁻¹⁸ J (Z²/n²), h = 6.626 × 10⁻³⁴ J·s, c = 2.9979 × 10⁸ m/s)<\/p>", "opts": [["A", "657 nm"], ["B", "219 nm"], ["C", "73.0 nm"], ["D", "24.3 nm"]], "ans": "C", "exp": "<p>ΔE = −2.178 × 10⁻¹⁸ J (3²)(1/2² − 1/3²) = −2.722 × 10⁻¹⁸ J. λ = hc/|ΔE| = (6.626 × 10⁻³⁴)(2.9979 × 10⁸)/(2.722 × 10⁻¹⁸ J) = 7.296 × 10⁻⁸ m = 73.0 nm. (Forgetting the Z² = 9 factor gives a wavelength 9 times too long, 657 nm.)<\/p>", "tag": ""}, {"n": 35, "stem": "<p>In the Bohr model, a calculated ΔE for an electron transition comes out negative. This means that<\/p>", "opts": [["A", "the atom has absorbed a photon"], ["B", "the atom has lost energy, which is carried away by an emitted photon"], ["C", "the wavelength of the photon is negative"], ["D", "the electron has moved to a level with a larger n"]], "ans": "B", "exp": "<p>ΔE = E_final − E_initial &lt; 0 means the atom lost energy and is now more stable; a photon is emitted. Use |ΔE| in λ = hc/ΔE, since a negative wavelength is meaningless.<\/p>", "tag": ""}, {"n": 36, "stem": "<p>Which statement about the Bohr model is correct?<\/p>", "opts": [["A", "It shows that electrons move in elliptical orbits around the nucleus."], ["B", "It fits the energy levels of hydrogen but fails for other atoms and is fundamentally incorrect."], ["C", "It correctly predicts the energy levels of all atoms."], ["D", "It is the basis from which the current theory of atomic structure is derived."]], "ans": "B", "exp": "<p>Bohr's model reproduced hydrogen's energy levels but did not work for other atoms. It was historically important, but modern theory is not derived from it, and electrons do not move in circular orbits.<\/p>", "tag": ""}, {"n": 37, "stem": "<p>In the hydrogen emission spectrum, the lines in the visible region correspond to transitions from higher levels down to which level?<\/p>", "opts": [["A", "n = 3"], ["B", "n = 1"], ["C", "n = 2"], ["D", "n = ∞"]], "ans": "C", "exp": "<p>The visible lines of hydrogen come from electrons falling from higher levels to n = 2. Transitions to n = 1 release more energy and lie in the ultraviolet.<\/p>", "tag": ""}]}], "count": 37, "cards": 58, "quizlet": "https://quizlet.com/1227000035/mya-chem-chapter-12-flash-cards/"}, {"subject": "chem", "slug": "ch13", "name": "Chapter 13", "title": "Bond energies, Lewis structures, resonance, octet exceptions, formal charge and VSEPR", "intro": "<h4>Formulas<\/h4><ul class='flist'><li>ΔH = ΣD(bonds broken) − ΣD(bonds formed)<\/li><li>Formal charge = valence e⁻ on free atom − valence e⁻ assigned in the molecule<\/li><li>Valence e⁻ assigned = lone-pair electrons + ½(shared electrons)<\/li><li>Sum of formal charges = overall charge of the molecule or ion<\/li><\/ul><h4>Rules<\/h4><ul class='flist'><li>Bond breaking is endothermic (+); bond forming is exothermic (−)<\/li><li>Bond energies give approximate ΔH, for gas-phase reactions only<\/li><li>Lewis step 1: sum all valence electrons<\/li><li>Lewis step 2: one electron pair per bond between bound atoms<\/li><li>Lewis step 3: place remaining electrons to satisfy the duet rule (H) and octet rule (second row)<\/li><li>B and Be are often electron-deficient; second-row elements never exceed an octet<\/li><li>Third-row and heavier elements may exceed an octet<\/li><li>Extra electrons go on the central atom<\/li><li>Best structure (second row): formal charges near zero, negative charge on the most electronegative atom<\/li><li>Lone pairs need more room than bonding pairs and compress bond angles<\/li><li>Multiple bonds count as one effective electron pair in VSEPR<\/li><\/ul><h4>VSEPR geometries<\/h4><ul class='flist'><li>2 pairs: linear, 180°<\/li><li>3 pairs: trigonal planar, 120°<\/li><li>4 pairs: tetrahedral, 109.5° (AB₃ trigonal pyramidal, AB₂ V-shaped)<\/li><li>5 pairs: trigonal bipyramidal, 90° and 120° (AB₄ see-saw, AB₃ T-shaped, AB₂ linear)<\/li><li>6 pairs: octahedral, 90° (AB₄ with 2 lone pairs: square planar)<\/li><li>Bond angles: CH₄ 109.5°, NH₃ 107°, H₂O 104.5°<\/li><\/ul>", "sections": [{"title": "Bond Energy and Enthalpy", "qs": [{"n": 1, "stem": "<p>Using D(H—H) = 432 kJ/mol, D(F—F) = 154 kJ/mol, and D(H—F) = 565 kJ/mol, estimate ΔH for H₂(g) + F₂(g) → 2HF(g).<\/p>", "opts": [["A", "+544 kJ"], ["B", "−544 kJ"], ["C", "−1130 kJ"], ["D", "+21 kJ"]], "ans": "B", "exp": "<p>Bonds broken: 1(432) + 1(154) = 586 kJ. Bonds formed: 2(565) = 1130 kJ. ΔH = 586 − 1130 = −544 kJ. (+544 has the wrong sign; −1130 ignores bond breaking.)<\/p>", "tag": ""}, {"n": 2, "stem": "<p>Using D(H—H) = 432 kJ/mol, D(Cl—Cl) = 239 kJ/mol, and D(H—Cl) = 427 kJ/mol, estimate ΔH for H₂(g) + Cl₂(g) → 2HCl(g).<\/p>", "opts": [["A", "−854 kJ"], ["B", "+244 kJ"], ["C", "−183 kJ"], ["D", "+183 kJ"]], "ans": "C", "exp": "<p>Broken: 432 + 239 = 671 kJ. Formed: 2(427) = 854 kJ. ΔH = 671 − 854 = −183 kJ.<\/p>", "tag": ""}, {"n": 3, "stem": "<p>Using D(C—H) = 413, D(Cl—Cl) = 239, D(C—Cl) = 339, and D(H—Cl) = 427 kJ/mol, estimate ΔH for CH₄(g) + Cl₂(g) → CH₃Cl(g) + HCl(g).<\/p>", "opts": [["A", "+114 kJ"], ["B", "−766 kJ"], ["C", "−1418 kJ"], ["D", "−114 kJ"]], "ans": "D", "exp": "<p>Only one C—H and one Cl—Cl bond break: 413 + 239 = 652 kJ. Formed: one C—Cl + one H—Cl = 339 + 427 = 766 kJ. ΔH = 652 − 766 = −114 kJ.<\/p>", "tag": ""}, {"n": 4, "stem": "<p>Using D(N≡N) = 941, D(H—H) = 432, and D(N—H) = 391 kJ/mol, estimate ΔH for N₂(g) + 3H₂(g) → 2NH₃(g).<\/p>", "opts": [["A", "−109 kJ"], ["B", "+109 kJ"], ["C", "−1564 kJ"], ["D", "+982 kJ"]], "ans": "A", "exp": "<p>Broken: 941 + 3(432) = 2237 kJ. Formed: 6 N—H = 6(391) = 2346 kJ. ΔH = 2237 − 2346 = −109 kJ.<\/p>", "tag": ""}, {"n": 5, "stem": "<p>Using D(C—H) = 413, D(O═O) = 495, D(C═O in CO₂) = 799, and D(O—H) = 467 kJ/mol, estimate ΔH for CH₄(g) + 2O₂(g) → CO₂(g) + 2H₂O(g).<\/p>", "opts": [["A", "+824 kJ"], ["B", "−2642 kJ"], ["C", "−824 kJ"], ["D", "−329 kJ"]], "ans": "C", "exp": "<p>Broken: 4(413) + 2(495) = 1652 + 990 = 2642 kJ. Formed: 2(799) + 4(467) = 1598 + 1868 = 3466 kJ. ΔH = 2642 − 3466 = −824 kJ.<\/p>", "tag": ""}, {"n": 6, "stem": "<p>Using D(C—H) = 413, D(Cl—Cl) = 239, D(F—F) = 154, D(C—F) = 485, D(C—Cl) = 339, D(H—F) = 565, and D(H—Cl) = 427 kJ/mol, estimate ΔH for CH₄(g) + 2Cl₂(g) + 2F₂(g) → CF₂Cl₂(g) + 2HF(g) + 2HCl(g).<\/p>", "opts": [["A", "−3632 kJ"], ["B", "+1194 kJ"], ["C", "−2438 kJ"], ["D", "−1194 kJ"]], "ans": "D", "exp": "<p>Broken: 4(413) + 2(239) + 2(154) = 1652 + 478 + 308 = 2438 kJ. Formed: 2(485) + 2(339) + 2(565) + 2(427) = 970 + 678 + 1130 + 854 = 3632 kJ. ΔH = 2438 − 3632 = −1194 kJ (Example 13.5; the value from enthalpies of formation is −1126 kJ).<\/p>", "tag": ""}, {"n": 7, "stem": "<p>In the expression ΔH = ΣD(bonds broken) − ΣD(bonds formed), which statement is correct?<\/p>", "opts": [["A", "D is negative for bonds formed and positive for bonds broken."], ["B", "D always has a positive sign; breaking bonds requires energy (endothermic) and forming bonds releases energy (exothermic)."], ["C", "Bond breaking is exothermic, so it contributes a negative term."], ["D", "The method applies equally well to reactions in solution, because bond energies include intermolecular interactions."]], "ans": "B", "exp": "<p>D (bond energy per mole of bonds) is always positive. Bond breaking requires energy (endothermic, + terms); bond formation releases energy, handled by the minus sign. The method should be limited to gas-phase reactions because bond energies don't include intermolecular interactions.<\/p>", "tag": ""}, {"n": 8, "stem": "<p>Using bond energies, ΔH for H₂(g) + F₂(g) → 2HF(g) is −544 kJ, while enthalpies of formation give −542 kJ. Why are bond-energy estimates not expected to match exactly?<\/p>", "opts": [["A", "Bond energies are averages taken from many different compounds."], ["B", "Bond energies include the energy of intermolecular forces in liquids."], ["C", "Enthalpies of formation are always less accurate than bond energies."], ["D", "Bond energies are only defined for ionic compounds."]], "ans": "A", "exp": "<p>Bond energies are averages from several compounds, so ΔH from bond energies only approximates the value from enthalpies of formation, here 2(−271) = −542 kJ.<\/p>", "tag": ""}]}, {"title": "The Localized Electron Model and Lewis Structures", "qs": [{"n": 9, "stem": "<p>In the localized electron (LE) model, electron pairs found in the space between two atoms are called:<\/p>", "opts": [["A", "lone pairs"], ["B", "core electrons"], ["C", "bonding pairs"], ["D", "resonance pairs"]], "ans": "C", "exp": "<p>Pairs in the space between two atoms are bonding pairs. Pairs localized on one atom are lone pairs.<\/p>", "tag": ""}, {"n": 10, "stem": "<p>How many valence electrons are in the Lewis structure of CF₄, and how many lone pairs does the full structure contain?<\/p>", "opts": [["A", "32 valence electrons; 12 lone pairs"], ["B", "36 valence electrons; 12 lone pairs"], ["C", "32 valence electrons; 16 lone pairs"], ["D", "28 valence electrons; 10 lone pairs"]], "ans": "A", "exp": "<p>Valence electrons: 4 + 4(7) = 32. Four C—F bonds use 8, leaving 24 electrons = 12 lone pairs (three on each F).<\/p>", "tag": ""}, {"n": 11, "stem": "<p>In drawing the Lewis structure of CO₂, how many electrons remain after the two C—O single bonds are drawn, and what is the correct final structure?<\/p>", "opts": [["A", "14 electrons; O—C≡O with one lone pair on C"], ["B", "12 electrons; each O has three lone pairs and C has none (O—C—O)"], ["C", "12 electrons; O═C═O with two lone pairs on each O"], ["D", "16 electrons; O═C═O with one lone pair on C"]], "ans": "C", "exp": "<p>CO₂ has 4 + 2(6) = 16 valence electrons; 16 − 4 = 12 remain. Three lone pairs on each O leaves C with only 4 electrons. The correct structure is O═C═O with two lone pairs on each O, so every atom has an octet.<\/p>", "tag": ""}, {"n": 12, "stem": "<p>What is the correct Lewis structure of the cyanide ion, CN⁻?<\/p>", "opts": [["A", "[:C≡N:]⁻, 10 valence electrons"], ["B", "[C═N]⁻ with two lone pairs on each atom, 8 valence electrons"], ["C", "C—N with three lone pairs on each atom, 14 valence electrons"], ["D", "[:C≡N:]⁻, 9 valence electrons"]], "ans": "A", "exp": "<p>4 + 5 + 1 = 10 valence electrons (the −1 charge adds one). C≡N uses 6 electrons, and one lone pair on each atom gives both atoms octets.<\/p>", "tag": ""}, {"n": 13, "stem": "<p>Which statement about the NO⁺ ion is correct?<\/p>", "opts": [["A", "It has 12 valence electrons and an N═O double bond."], ["B", "It has 11 valence electrons and is an odd-electron species."], ["C", "It has 9 valence electrons and an N—O single bond."], ["D", "It has 10 valence electrons and an N≡O triple bond with one lone pair on each atom."]], "ans": "D", "exp": "<p>5 + 6 − 1 = 10 valence electrons, giving [:N≡O:]⁺ with one lone pair on each atom (Example 13.6f).<\/p>", "tag": ""}, {"n": 14, "stem": "<p>Which rule describes hydrogen in Lewis structures?<\/p>", "opts": [["A", "Hydrogen follows the octet rule."], ["B", "Hydrogen follows the duet rule, sharing two electrons."], ["C", "Hydrogen can exceed the octet rule using d orbitals."], ["D", "Hydrogen always carries one lone pair."]], "ans": "B", "exp": "<p>Hydrogen follows the duet rule: it is stable sharing two electrons (a filled 1s shell).<\/p>", "tag": ""}, {"n": 15, "stem": "<p>How many valence electrons are in PCl₄⁺?<\/p>", "opts": [["A", "34"], ["B", "33"], ["C", "32"], ["D", "31"]], "ans": "C", "exp": "<p>5 + 4(7) − 1 = 32 valence electrons (the + charge removes one).<\/p>", "tag": ""}]}, {"title": "Resonance", "qs": [{"n": 16, "stem": "<p>Experiments show that all three N—O bonds in the nitrate ion (NO₃⁻) are identical. Which description is correct?<\/p>", "opts": [["A", "The ion rapidly flips among three structures, each with one double bond."], ["B", "The actual structure is the average (superposition) of three resonance structures; each N—O bond is intermediate between a single and a double bond."], ["C", "The ion has three N═O double bonds."], ["D", "The ion has three N—O single bonds and a lone pair on N."]], "ans": "B", "exp": "<p>No single Lewis structure is correct. NO₃⁻ (24 electrons) is the average of three resonance structures, so all N—O bonds are equivalent and intermediate between single and double. The molecule does not flip between them.<\/p>", "tag": ""}, {"n": 17, "stem": "<p>How many valence electrons does the nitrite ion (NO₂⁻) have, and how many equivalent resonance structures are needed to describe it?<\/p>", "opts": [["A", "17 electrons; one structure"], ["B", "18 electrons; three structures"], ["C", "18 electrons; two structures"], ["D", "16 electrons; two structures"]], "ans": "C", "exp": "<p>5 + 2(6) + 1 = 18 valence electrons. After two N—O bonds, 14 remain. Two equivalent resonance structures (the double bond on either O) are needed, so each N—O bond is intermediate.<\/p>", "tag": ""}, {"n": 18, "stem": "<p>Which species requires resonance structures to describe its bonding?<\/p>", "opts": [["A", "O₃"], ["B", "CH₄"], ["C", "H₂O"], ["D", "NH₃"]], "ans": "A", "exp": "<p>O₃ (18 electrons) has two equivalent resonance structures, with the double bond on either side. CH₄, H₂O and NH₃ each have one Lewis structure.<\/p>", "tag": ""}, {"n": 19, "stem": "<p>Which statement about resonance structures is correct?<\/p>", "opts": [["A", "Resonance structures differ in the positions of the nuclei."], ["B", "Resonance is needed because the LE model assumes electrons are localized, while in reality electrons are delocalized."], ["C", "Equivalent Lewis structures contain different numbers of single and multiple bonds."], ["D", "The double-headed arrow shows the molecule switching back and forth between structures."]], "ans": "B", "exp": "<p>Resonance compensates for the LE model's assumption that electrons are localized. The nuclei stay in the same positions, only the electron placement differs. Equivalent structures have the same numbers of single and multiple bonds.<\/p>", "tag": ""}]}, {"title": "Exceptions to the Octet Rule", "qs": [{"n": 20, "stem": "<p>Why does BF₃ react very energetically with NH₃?<\/p>", "opts": [["A", "Boron has 10 electrons around it and must lose a pair."], ["B", "Fluorine has an incomplete octet in BF₃."], ["C", "Boron has only 6 electrons around it (electron-deficient) and accepts the lone pair on N to form H₃NBF₃."], ["D", "BF₃ is an odd-electron molecule."]], "ans": "C", "exp": "<p>BF₃ has 24 valence electrons. In the preferred structure B has only 6 electrons, so it is electron-deficient. It accepts nitrogen's lone pair to form H₃NBF₃, in which B has an octet.<\/p>", "tag": ""}, {"n": 21, "stem": "<p>Which element should always be assumed to obey (and never exceed) the octet rule?<\/p>", "opts": [["A", "N"], ["B", "P"], ["C", "S"], ["D", "Xe"]], "ans": "A", "exp": "<p>C, N, O and F (second row) always obey the octet rule. Their 2s and 2p orbitals hold only 8 electrons, so they never exceed it. P, S and Xe can exceed it.<\/p>", "tag": ""}, {"n": 22, "stem": "<p>In the Lewis structure of SF₆ (48 valence electrons), how many electrons surround the sulfur atom?<\/p>", "opts": [["A", "8"], ["B", "10"], ["C", "14"], ["D", "12"]], "ans": "D", "exp": "<p>Six S—F bonds use 12 electrons, and the six F octets use the other 36. S has 6 bonding pairs = 12 electrons, so it exceeds the octet rule.<\/p>", "tag": ""}, {"n": 23, "stem": "<p>The triiodide ion, I₃⁻, has 22 valence electrons. According to the text's rule, where are the extra electrons placed, and how many lone pairs are on the central I?<\/p>", "opts": [["A", "On a terminal I; 2 lone pairs on the central I"], ["B", "On the central I; 3 lone pairs on the central I"], ["C", "On the central I; 2 lone pairs on the central I"], ["D", "Split evenly between the terminal atoms; no lone pairs on the central I"]], "ans": "B", "exp": "<p>When one of several third-row-or-heavier atoms must exceed the octet, the text places the extra electrons on the central atom. 22 − 4 (bonds) − 12 (terminal lone pairs) = 6 electrons = 3 lone pairs on the central I.<\/p>", "tag": ""}, {"n": 24, "stem": "<p>Which molecule is an odd-electron molecule that the LE model does not handle in a natural way?<\/p>", "opts": [["A", "CO₂"], ["B", "N₂"], ["C", "O₃"], ["D", "NO"]], "ans": "D", "exp": "<p>NO has 5 + 6 = 11 valence electrons, an odd number. The LE model is based on electron pairs, so it does not handle odd-electron molecules naturally. (NO₂, with 17 electrons, is another example.)<\/p>", "tag": ""}, {"n": 25, "stem": "<p>In the hyperconjugation description of SF₆, four electron-pair bonds are spread over six S—F interactions. How much covalent bond does each S—F interaction have?<\/p>", "opts": [["A", "1/2 bond"], ["B", "3/2 bond"], ["C", "1 bond"], ["D", "2/3 bond"]], "ans": "D", "exp": "<p>4 electron-pair bonds ÷ 6 S—F interactions = 2/3 covalent bond per S—F interaction, plus ionic contributions (S +2, two F at −1 in each resonance structure).<\/p>", "tag": ""}, {"n": 26, "stem": "<p>In BeCl₂ (16 valence electrons), how many electrons surround the beryllium atom?<\/p>", "opts": [["A", "6"], ["B", "4"], ["C", "8"], ["D", "2"]], "ans": "B", "exp": "<p>BeCl₂ has 2 + 2(7) = 16 electrons. Two Be—Cl bonds (4 e⁻) plus three lone pairs on each Cl (12 e⁻) use all 16, leaving Be with 4 electrons. Be is electron-deficient.<\/p>", "tag": ""}]}, {"title": "Formal Charge", "qs": [{"n": 27, "stem": "<p>In the sulfate ion Lewis structure with four S—O single bonds (32 valence electrons), what are the formal charges on S and on each O?<\/p>", "opts": [["A", "S = 0; each O = −1/2"], ["B", "S = +2; each O = −1"], ["C", "S = −2; each O = 0"], ["D", "S = +6; each O = −2"]], "ans": "B", "exp": "<p>Formal charge = valence electrons − (lone-pair electrons + ½ shared electrons). S: 6 − (0 + ½·8) = +2. O: 6 − (6 + ½·2) = −1. Check: +2 + 4(−1) = −2, the ion's charge.<\/p>", "tag": ""}, {"n": 28, "stem": "<p>In the sulfate structure with two S═O double bonds and two S—O single bonds, what is the formal charge on S?<\/p>", "opts": [["A", "0"], ["B", "+2"], ["C", "+1"], ["D", "−2"]], "ans": "A", "exp": "<p>S: 6 − (0 + ½·12) = 0. Double-bonded O: 6 − (4 + 2) = 0. Single-bonded O: −1. Sum = 0 + 0 + 0 − 1 − 1 = −2. This structure has minimum formal charges but puts 12 electrons on S. The text notes that whether it or the octet structure is better is still disputed for third-row atoms.<\/p>", "tag": ""}, {"n": 29, "stem": "<p>In the Lewis structure [:N≡O:]⁺, what are the formal charges on N and O?<\/p>", "opts": [["A", "N = +1, O = 0"], ["B", "N = 0, O = 0"], ["C", "N = −1, O = +2"], ["D", "N = 0, O = +1"]], "ans": "D", "exp": "<p>N: 5 − (2 + ½·6) = 0. O: 6 − (2 + ½·6) = +1. Sum = +1, the ion's charge.<\/p>", "tag": ""}, {"n": 30, "stem": "<p>In the Lewis structure of XeO₃ with three Xe—O single bonds and one lone pair on Xe (26 valence electrons), what is the formal charge on Xe?<\/p>", "opts": [["A", "+3"], ["B", "0"], ["C", "+6"], ["D", "−1"]], "ans": "A", "exp": "<p>Xe: 8 − (2 + ½·6) = +3. Each O (three lone pairs, one bond): 6 − (6 + 1) = −1. Sum = +3 − 3 = 0. Check: 6 + 18 + 2 = 26 electrons.<\/p>", "tag": ""}, {"n": 31, "stem": "<p>Why is CO₂ arranged as O—C—O rather than C—O—O?<\/p>", "opts": [["A", "In O═C═O, the central carbon has a lone pair that stabilizes it."], ["B", "Structures with C—O—O can't hold 16 valence electrons."], ["C", "Carbon is more electronegative than oxygen, so it must be terminal."], ["D", "In O═C═O all formal charges are 0, while every C—O—O structure gives unreasonable formal charges, such as negative C next to positive O."]], "ans": "D", "exp": "<p>O═C═O: C = 4 − (0 + 4) = 0 and O = 6 − (4 + 2) = 0. C—O—O arrangements give unreasonable formal charges (e.g., C═O═O gives C −2, central O +2). A negative carbon next to a positive oxygen contradicts oxygen's greater electronegativity.<\/p>", "tag": ""}, {"n": 32, "stem": "<p>According to the text, which statement about choosing among nonequivalent Lewis structures using formal charge is correct?<\/p>", "opts": [["A", "For all molecules, including those with third-row central atoms, the structure with minimum formal charges is definitely the correct one."], ["B", "Formal charges are the actual charges on atoms and can be measured directly."], ["C", "For second-row atoms, the best structures have formal charges as close to zero as possible with any negative formal charges on the most electronegative atoms; for third-row and heavier atoms the situation is still unclear."], ["D", "Oxidation states are better than formal charges for judging Lewis structures."]], "ans": "C", "exp": "<p>The text's rules: for second-row atoms, formal charges should be as close to zero as possible, with any negative formal charges on the most electronegative atoms. For third-row or heavier atoms (e.g., sulfate) it says the dispute is unresolved. Formal charges are only estimates. Oxidation states exaggerate charge and are unsuitable for this.<\/p>", "tag": ""}]}, {"title": "Molecular Structure: The VSEPR Model", "qs": [{"n": 33, "stem": "<p>What is the molecular structure of NH₃?<\/p>", "opts": [["A", "Tetrahedral"], ["B", "Trigonal planar"], ["C", "T-shaped"], ["D", "Trigonal pyramid"]], "ans": "D", "exp": "<p>N has 3 bonding pairs and 1 lone pair: a tetrahedral arrangement of pairs. The name comes from the positions of the atoms, so the structure is a trigonal pyramid (bond angle 107°).<\/p>", "tag": ""}, {"n": 34, "stem": "<p>The bond angles in CH₄, NH₃, and H₂O are 109.5°, 107°, and 104.5°, respectively. What explains this trend?<\/p>", "opts": [["A", "Lone pairs require more room than bonding pairs and compress the angles between bonding pairs."], ["B", "Bonding pairs require more room than lone pairs."], ["C", "Hydrogen atoms repel each other more strongly in H₂O."], ["D", "Lone pairs occupy less space because they are attached to only one nucleus."]], "ans": "A", "exp": "<p>Lone pairs (0, 1, 2) increase from CH₄ to H₂O. A lone pair is held near only one nucleus, so it takes more space and squeezes the bonding pairs together.<\/p>", "tag": ""}, {"n": 35, "stem": "<p>What is the molecular structure of XeF₄, and does it have a dipole moment?<\/p>", "opts": [["A", "Octahedral; no dipole moment"], ["B", "Tetrahedral; dipole moment"], ["C", "Square planar; no dipole moment"], ["D", "See-saw; dipole moment"]], "ans": "C", "exp": "<p>Xe: 8 + 4(7) = 36 electrons. 36 − 8 − 24 = 4, so 2 lone pairs. Six pairs give an octahedral arrangement, and the lone pairs sit 180° apart, so the structure is square planar. The polar Xe—F bonds cancel, so there is no dipole moment.<\/p>", "tag": ""}, {"n": 36, "stem": "<p>What is the molecular structure of SO₂, and does it have a dipole moment?<\/p>", "opts": [["A", "Linear (180°); no dipole moment"], ["B", "V-shaped (about 120°); dipole moment"], ["C", "Trigonal planar; no dipole moment"], ["D", "V-shaped (about 104.5°); no dipole moment"]], "ans": "B", "exp": "<p>SO₂ has 18 electrons. S has one lone pair, one single bond and one double bond (counted as one pair), so 3 effective pairs in a trigonal planar arrangement. The molecule is V-shaped, about 120° (no distortion at 120°). The bond dipoles don't cancel, so it has a dipole moment.<\/p>", "tag": ""}, {"n": 37, "stem": "<p>ClF₃ has 28 valence electrons. What is its molecular structure?<\/p>", "opts": [["A", "Trigonal planar"], ["B", "Trigonal pyramid"], ["C", "See-saw"], ["D", "T-shaped"]], "ans": "D", "exp": "<p>Cl: 28 − 6 (bonds) − 18 (F lone pairs) = 4, so 2 lone pairs on Cl. 5 pairs give a trigonal bipyramid. Three bonded atoms and two lone pairs (equatorial) give a T shape.<\/p>", "tag": ""}, {"n": 38, "stem": "<p>SF₄ has 34 valence electrons. What is its molecular structure?<\/p>", "opts": [["A", "See-saw"], ["B", "Tetrahedral"], ["C", "Square planar"], ["D", "Trigonal pyramid"]], "ans": "A", "exp": "<p>34 − 8 − 24 = 2, so 1 lone pair on S. 5 pairs (4 bonding + 1 lone) in a trigonal bipyramid give a see-saw (AB₄) structure.<\/p>", "tag": ""}, {"n": 39, "stem": "<p>In the solid state, PCl₅ exists as PCl₄⁺ and PCl₆⁻ ions. What are their molecular structures?<\/p>", "opts": [["A", "PCl₄⁺ square planar; PCl₆⁻ trigonal prismatic"], ["B", "PCl₄⁺ see-saw; PCl₆⁻ trigonal bipyramidal"], ["C", "PCl₄⁺ trigonal pyramid; PCl₆⁻ square pyramid"], ["D", "PCl₄⁺ tetrahedral; PCl₆⁻ octahedral"]], "ans": "D", "exp": "<p>PCl₄⁺: 5 + 28 − 1 = 32 electrons, 4 bonding pairs and no lone pairs on P, so tetrahedral. PCl₆⁻: 5 + 42 + 1 = 48 electrons, 6 bonding pairs, so octahedral (Example 13.12).<\/p>", "tag": ""}, {"n": 40, "stem": "<p>In VSEPR, how is a double bond in NO₃⁻ counted, and what shape results?<\/p>", "opts": [["A", "As one effective pair; trigonal planar with 120° bond angles"], ["B", "As two pairs; trigonal bipyramidal"], ["C", "As two pairs; tetrahedral with 109.5° angles"], ["D", "As one effective pair; trigonal pyramid with 107° angles"]], "ans": "A", "exp": "<p>Multiple bonds count as one effective pair. N in NO₃⁻ has 3 effective pairs, so it is trigonal planar with 120° angles, as observed. Any one resonance structure can be used.<\/p>", "tag": ""}, {"n": 41, "stem": "<p>The text says a trigonal bipyramidal arrangement of electron pairs has two different angles between adjacent pairs. What are they?<\/p>", "opts": [["A", "109.5° only"], ["B", "90° only"], ["C", "90° and 120°"], ["D", "109.5° and 180°"]], "ans": "C", "exp": "<p>A trigonal bipyramid (five pairs) has two different angles between adjacent pairs, 90° (axial–equatorial) and 120° (equatorial–equatorial). (The two axial pairs are 180° apart, but they are not adjacent.)<\/p>", "tag": ""}, {"n": 42, "stem": "<p>Phosphine (PH₃) has a Lewis structure like that of NH₃. What does experiment show, and what does it illustrate?<\/p>", "opts": [["A", "The H—P—H angles are about 107°, confirming VSEPR exactly."], ["B", "The H—P—H angles are 94°, a case where the simple VSEPR model fails."], ["C", "PH₃ is trigonal planar with 120° angles."], ["D", "PH₃ is tetrahedral with 109.5° angles."]], "ans": "B", "exp": "<p>VSEPR predicts about 107° (like NH₃), but the measured angle is 94°. This is an example of a simple model having exceptions.<\/p>", "tag": ""}]}], "count": 42, "cards": 68, "quizlet": "https://quizlet.com/1227000552/mya-chem-chapter-13-flash-cards/"}, {"subject": "chem", "slug": "8-9", "name": "Lectures 8–9", "title": "Drawing rules, resonance, octet exceptions, oxidation numbers, VSEPR and polarity", "intro": "<h4>Formulas<\/h4><ul class='flist'><li>Formal charge = valence e⁻ − lone-pair electrons − number of bonds<\/li><li>Electron count on A = valence e⁻ of A + number of bonds − formal charge<\/li><li>Nonbonding electrons on A = valence e⁻ of A − number of bonds − formal charge<\/li><li>Unknown oxidation number = charge on species − Σ(known oxidation numbers)<\/li><li>Steric number SN = CN (atoms bonded) + LP (lone pairs); VSEPR notation AXₓEₑ with x + e = SN<\/li><\/ul><h4>Conventions<\/h4><ul class='flist'><li>Common valence (bonds needed to fill the valence shell, from XHₙ): H 1, F 1, Cl 1, O 2, N 3, C 4<\/li><li>Double bond counts as 2 bonds, triple bond as 3 bonds (for electron counts); a multiple bond counts as one domain in VSEPR<\/li><li>Oxidation numbers: element = 0; F always −1; O usually −2 (not with F or in O–O bonds); H +1 with nonmetals, −1 with metals, B or Si<\/li><li>SN 2 linear · 3 trigonal planar · 4 tetrahedral · 5 trigonal bipyramidal · 6 octahedral · 7 pentagonal bipyramidal<\/li><\/ul>", "sections": [{"title": "Part 1: Lecture 8 (Drawing Rules, Resonance, Breakdown of the Octet Rule)", "qs": [{"n": 1, "stem": "<p>What is the common valence of nitrogen, i.e. the number of bonds it forms to reach an octet (as shown by its hydride)?<\/p>", "opts": [["A", "1"], ["B", "2"], ["C", "3"], ["D", "5"]], "ans": "C", "exp": "<p>Common valence = number of H atoms in the hydride XHₙ. NH₃ gives N a valence of 3 (H 1, F 1, O 2, N 3, C 4).<\/p>", "tag": "L 8"}, {"n": 2, "stem": "<p>According to the common-motifs slide, when is an atom's formal charge zero?<\/p>", "opts": [["A", "When it has no lone pairs"], ["B", "When it forms the number of bonds that corresponds to its common valence"], ["C", "When it forms exactly four bonds"], ["D", "When it is the central atom"]], "ans": "B", "exp": "<p>Formal charge is zero when the atom forms the number of bonds equal to its common valence, e.g. N with 3 bonds, O with 2.<\/p>", "tag": "L 8"}, {"n": 3, "stem": "<p>In the lecture's drawing rules, if the molecule is charged, where is the charge placed in the trial structure?<\/p>", "opts": [["A", "On the most electronegative terminal atom"], ["B", "Spread equally over all atoms"], ["C", "On a hydrogen atom"], ["D", "On the central atom"]], "ans": "D", "exp": "<p>Rule (3): place the charge on the central atom of the trial structure. The terminal atoms are automatically correct with an octet because their bonds were drawn to satisfy their common valence.<\/p>", "tag": "L 8"}, {"n": 4, "stem": "<p>What is the formal charge on an oxygen atom with one bond and three lone pairs?<\/p>", "opts": [["A", "0"], ["B", "+1"], ["C", "−1"], ["D", "−2"]], "ans": "C", "exp": "<p>6 − 6 − 1 = −1. This O⁻ motif is isoelectronic with neutral F (1 bond, 3 lone pairs).<\/p>", "tag": "L 8"}, {"n": 5, "stem": "<p>In a structure Y=X, Y has more than 8 electrons. One Y–X bond pair is moved onto X as a lone pair, giving Y⁺–X⁻. How do the electron counts change?<\/p>", "opts": [["A", "Y decreases by 2; X is unchanged"], ["B", "Y decreases by 2; X increases by 2"], ["C", "Y decreases by 1; X increases by 1"], ["D", "Y is unchanged; X increases by 2"]], "ans": "A", "exp": "<p>Turning a bond pair into a lone pair on X removes 2 electrons from Y's count. X's count is unchanged because the pair stays in X's valence shell (it just changes from bonding to nonbonding).<\/p>", "tag": "L 8"}, {"n": 6, "stem": "<p>In a structure Y–X, Y has fewer than 8 electrons. A lone pair on X is moved to form a Y=X bond. Which result is correct?<\/p>", "opts": [["A", "Y⁺ and X⁻; Y's count increases by 2"], ["B", "Y⁻ and X⁺; Y's count decreases by 2"], ["C", "Y⁻ and X⁺; Y's count increases by 2"], ["D", "No formal charges appear; X's count decreases by 2"]], "ans": "C", "exp": "<p>Y gains a bond, so its count rises by 2 and it becomes Y⁻. X gives up a lone pair to make a bond, so it becomes X⁺, but its count is unchanged.<\/p>", "tag": "L 8"}, {"n": 7, "stem": "<p>How many lone pairs are in the Lewis structure of CO₂ (O=C=O)?<\/p>", "opts": [["A", "2"], ["B", "4"], ["C", "6"], ["D", "8"]], "ans": "B", "exp": "<p>16 valence electrons (4 + 6 + 6). The two double bonds use 8, leaving 8 electrons = 4 lone pairs, two on each O. C has no lone pairs.<\/p>", "tag": "L 8"}, {"n": 8, "stem": "<p>The trial structure of POCl₃ (three P–Cl bonds and a P=O bond) puts 10 electrons on P. What is the lecture's fix?<\/p>", "opts": [["A", "Allow P to expand its octet using its 3d orbitals"], ["B", "Form a P=Cl double bond from a Cl lone pair"], ["C", "Remove one Cl atom"], ["D", "Take one of the P–O bonds back to oxygen, giving P⁺–O⁻"]], "ans": "D", "exp": "<p>Moving one P=O bond pair onto O gives P⁺ (8 electrons) and O⁻. All atoms then have octets. The d-orbital explanation is wrong.<\/p>", "tag": "L 8"}, {"n": 9, "stem": "<p>What is the bond order of each O–O bond in ozone, O₃?<\/p>", "opts": [["A", "1.5"], ["B", "1"], ["C", "1.33"], ["D", "2"]], "ans": "A", "exp": "<p>O₃ is a hybrid of two equivalent structures, each with one O–O single and one O=O double bond. Average: (1 + 2)/2 = 1.5.<\/p>", "tag": "L 8"}, {"n": 10, "stem": "<p>Which statement about resonance is correct?<\/p>", "opts": [["A", "The molecule rapidly oscillates between the resonance structures"], ["B", "The double-headed arrow indicates an equilibrium"], ["C", "Resonance structures differ in the positions of the nuclei"], ["D", "The actual structure is a composite of the resonance structures, none of which exists independently"]], "ans": "D", "exp": "<p>Resonance is not oscillation and ↔ is not an equilibrium arrow. The real molecule is an average (like green from blue and yellow). Resonance structures differ only in electron positions, never nuclei.<\/p>", "tag": "L 8"}, {"n": 11, "stem": "<p>Why is benzene drawn with a circle inside the ring?<\/p>", "opts": [["A", "All six C–C bonds are equal, so the bonding cannot be represented by a single Lewis structure"], ["B", "It has alternating short C–C and long C=C bonds"], ["C", "The circle shows the six lone pairs on carbon"], ["D", "The molecule flips rapidly between two structures"]], "ans": "A", "exp": "<p>All C–C bond lengths in benzene are equal; there is no alternation of single and double bonds. The circle shows that one Lewis structure (with lines as shared pairs) cannot properly represent the bonding.<\/p>", "tag": "L 8"}, {"n": 12, "stem": "<p>The three resonance structures of [NO₃]⁻ are related by symmetry and have the same energy. What are they called?<\/p>", "opts": [["A", "Isoelectronic"], ["B", "Degenerate"], ["C", "Hypovalent"], ["D", "Isomers"]], "ans": "B", "exp": "<p>Resonance structures related by symmetry are EQUIVALENT and have the same energy, i.e. DEGENERATE. Not all resonance structures are equivalent.<\/p>", "tag": "L 8"}, {"n": 13, "stem": "<p>In the final Lewis structure of [NO₃]⁻ (N has an octet), what are the formal charges?<\/p>", "opts": [["A", "N 0; one O 0 and two O −1"], ["B", "N −1; all three O 0"], ["C", "N +1; one O 0 and two O −1"], ["D", "N +1; all three O −1"]], "ans": "C", "exp": "<p>N has 4 bonds (one double, two single) and no lone pairs: 5 − 0 − 4 = +1, count 5 + 4 − 1 = 8. Double-bonded O: 6 − 4 − 2 = 0. Each single-bonded O: 6 − 6 − 1 = −1. Sum = +1 + 0 − 2 = −1.<\/p>", "tag": "L 8"}, {"n": 14, "stem": "<p>For N₂O (connectivity N–N–O), the trial structure N≡N=O has electron counts of 8, 10, 8. Which pair of structures results from moving electron pairs away from the central N?<\/p>", "opts": [["A", "⁻N=N⁺=O and N≡N⁺–O⁻"], ["B", "N≡N–O and N=N=O"], ["C", "N⁺≡N–O⁻ and N=N⁺=O⁻"], ["D", "⁻N≡N⁺=O and N=N–O"]], "ans": "A", "exp": "<p>Moving one N≡N pair onto the terminal N gives ⁻N=N⁺=O; moving one N=O pair onto O gives N≡N⁺–O⁻. Both have counts of 8, 8, 8, and the formal charges appear without any calculation.<\/p>", "tag": "L 8"}, {"n": 15, "stem": "<p>In the N₂O resonance structure ⁻N=N⁺=O, how many nonbonding electrons are on the terminal N?<\/p>", "opts": [["A", "2"], ["B", "4"], ["C", "6"], ["D", "0"]], "ans": "B", "exp": "<p>Nonbonding electrons = valence − bonds − formal charge = 5 − 2 − (−1) = 4 (two lone pairs). Check: count = 4 + 4 = 8.<\/p>", "tag": "L 8"}, {"n": 16, "stem": "<p>For [ClO₄]⁻, the trial structure puts the charge on Cl with four Cl=O bonds, so Cl has 16 electrons. How many bond pairs must be moved onto oxygen atoms to give Cl an octet?<\/p>", "opts": [["A", "1"], ["B", "2"], ["C", "3"], ["D", "4"]], "ans": "D", "exp": "<p>Count = 7 + 8 − (−1) = 16. Each move lowers Cl by 2: 16 → 14 → 12 → 10 → 8. Four moves give Cl³⁺ with four single bonds and four O⁻.<\/p>", "tag": "L 8"}, {"n": 17, "stem": "<p>Which is NOT one of the three situations in which the octet rule is (apparently) broken?<\/p>", "opts": [["A", "Odd-electron molecules"], ["B", "Hypovalent molecules"], ["C", "Hypervalent molecules"], ["D", "Isoelectronic molecules"]], "ans": "D", "exp": "<p>The three situations are odd-electron molecules, hypovalent (electron-deficient) molecules, and hypervalent molecules (\"valence shell expansion\").<\/p>", "tag": "L 8"}, {"n": 18, "stem": "<p>NO has 11 valence electrons. In the preferred Lewis structure, which atom lacks an octet?<\/p>", "opts": [["A", "N, with 7 electrons"], ["B", "O, with 7 electrons"], ["C", "Both N and O"], ["D", "Neither, because O has 9 electrons"]], "ans": "A", "exp": "<p>With an odd number of electrons, not every atom can have an octet. N with 7 and O with 8 is better than N with 8 and O with 9 (more than an octet is bad).<\/p>", "tag": "L 8"}, {"n": 19, "stem": "<p>Which statement about BF₃ matches the lecture?<\/p>", "opts": [["A", "BF₃ is a bona fide hypovalent molecule that cannot be fixed, like BH₃"], ["B", "A formal positive charge on fluorine is never acceptable"], ["C", "A resonance structure with a B=F bond places +1 on F and gives B an octet; this is acceptable because formal charge is not the real charge"], ["D", "In BF₃, boron has 10 electrons"]], "ans": "C", "exp": "<p>Unlike BH₃ (B: 6 electrons, truly hypovalent), F has lone pairs that can be donated to B in one resonance structure, giving B 8 electrons and F⁺. A positive formal charge on F is acceptable; it is not the real charge.<\/p>", "tag": "L 8"}, {"n": 20, "stem": "<p>What is the real (calculated) charge on nitrogen in [NH₄]⁺?<\/p>", "opts": [["A", "About −0.74"], ["B", "+1"], ["C", "About +0.44"], ["D", "0"]], "ans": "A", "exp": "<p>N is about −0.74 and each H about +0.44. N is negative because it is more electronegative than H, even though its formal charge is +1.<\/p>", "tag": "L 8"}, {"n": 21, "stem": "<p>According to the lecture, what is the correct explanation of \"hypervalent\" molecules such as SF₆, PF₅ and XeF₂?<\/p>", "opts": [["A", "The extra electrons go into the central atom's d orbitals"], ["B", "The octet is actually maintained; the bonding cannot be described with only 2-center-2-electron bonds"], ["C", "Valence shell expansion is a real phenomenon"], ["D", "These molecules have an odd number of electrons"]], "ans": "B", "exp": "<p>Calculations show there is no real valence shell expansion. The assumption that every A–B bond is a shared pair (2-center-2-electron bond) is what fails. On an exam, read \"violates the octet rule\" as \"appears to violate\".<\/p>", "tag": "L 8"}, {"n": 22, "stem": "<p>XeF₂ is described by two resonance structures, F–Xe⁺ F⁻ ↔ F⁻ Xe⁺–F. What is the Xe–F bond order and Xe's electron count?<\/p>", "opts": [["A", "Bond order 1; Xe has 10 electrons"], ["B", "Bond order 0.5; Xe has 10 electrons"], ["C", "Bond order 1.5; Xe has 8 electrons"], ["D", "Bond order 0.5; Xe has 8 electrons"]], "ans": "D", "exp": "<p>Each structure has one Xe–F bond and one \"no bond\" Xe⁺ F⁻ interaction, so each Xe–F bond order = (1 + 0)/2 = 0.5. Xe has 8 electrons in each structure.<\/p>", "tag": "L 8"}]}, {"title": "Part 2: Lecture 9 (Oxidation Numbers, VSEPR Theory, Polarity)", "qs": [{"n": 23, "stem": "<p>How do formal charge and oxidation number differ in how they treat a bonding pair?<\/p>", "opts": [["A", "Formal charge: heterolytic, the pair goes to the more electronegative atom; oxidation number: homolytic, equal sharing"], ["B", "Formal charge: homolytic, equal sharing (one electron each); oxidation number: heterolytic, the pair goes to the more electronegative atom (100% ionic)"], ["C", "Both assume equal sharing"], ["D", "Both assume the bond is 100% ionic"]], "ans": "B", "exp": "<p>Formal charge comes from breaking bonds homolytically (each partner gets one electron); oxidation number from breaking them heterolytically, giving the pair to the more electronegative atom. They are two extremes; the real charge is in between.<\/p>", "tag": "L 9"}, {"n": 24, "stem": "<p>For HCl, formal charges are 0 and 0 and oxidation numbers are +1 and −1. What is the calculated (actual) charge on H?<\/p>", "opts": [["A", "0"], ["B", "+1"], ["C", "+0.18"], ["D", "−0.18"]], "ans": "C", "exp": "<p>The calculated charges are H +0.18 and Cl −0.18, intermediate between the formal-charge extreme (equal sharing) and the oxidation-number extreme (100% ionic).<\/p>", "tag": "L 9"}, {"n": 25, "stem": "<p>What is the oxidation number of N in NCl₃?<\/p>", "opts": [["A", "−3"], ["B", "0"], ["C", "+5"], ["D", "+3"]], "ans": "D", "exp": "<p>Cl (3.16) is more electronegative than N (3.04), so Cl is −1. N = 0 − 3(−1) = +3. Compare NH₃, where N = 0 − 3(+1) = −3.<\/p>", "tag": "L 9"}, {"n": 26, "stem": "<p>What is the oxidation number of S in [SO₄]²⁻?<\/p>", "opts": [["A", "+6"], ["B", "+4"], ["C", "−2"], ["D", "+8"]], "ans": "A", "exp": "<p>O is −2. S = −2 − 4(−2) = −2 + 8 = +6.<\/p>", "tag": "L 9"}, {"n": 27, "stem": "<p>What is the oxidation number of O in H₂O₂?<\/p>", "opts": [["A", "−2"], ["B", "−1"], ["C", "0"], ["D", "+1"]], "ans": "B", "exp": "<p>O is not −2 when there is an O–O bond. H is +1, so 2(+1) + 2x = 0 gives x = −1.<\/p>", "tag": "L 9"}, {"n": 28, "stem": "<p>What is the oxidation number of H in NaH?<\/p>", "opts": [["A", "+1"], ["B", "0"], ["C", "−1"], ["D", "−2"]], "ans": "C", "exp": "<p>H is −1 when bonded to a metal (Na is +1). It is +1 when bonded to nonmetals, except B and Si, where it is also −1.<\/p>", "tag": "L 9"}, {"n": 29, "stem": "<p>Using the lecture's rule for hydrogen bonded to B or Si, what is the oxidation number of Si in SiH₄?<\/p>", "opts": [["A", "−4"], ["B", "0"], ["C", "+2"], ["D", "+4"]], "ans": "D", "exp": "<p>H bonded to Si is assigned −1. Si = 0 − 4(−1) = +4.<\/p>", "tag": "L 9"}, {"n": 30, "stem": "<p>What is the oxidation number of O in OF₂?<\/p>", "opts": [["A", "−2"], ["B", "+2"], ["C", "−1"], ["D", "0"]], "ans": "B", "exp": "<p>F is always −1. O = 0 − 2(−1) = +2. This is the exception to O being −2 (O combined with F).<\/p>", "tag": "L 9"}, {"n": 31, "stem": "<p>What is the oxidation number of Cr in [Cr₂O₇]²⁻?<\/p>", "opts": [["A", "+6"], ["B", "+7"], ["C", "+12"], ["D", "+3"]], "ans": "A", "exp": "<p>O is −2: 2x + 7(−2) = −2, so 2x = 12 and x = +6.<\/p>", "tag": "L 9"}, {"n": 32, "stem": "<p>Which is the correct name for FeCl₃?<\/p>", "opts": [["A", "Iron(II) chloride"], ["B", "Iron trichloride(I)"], ["C", "Iron(III) chloride"], ["D", "Iron(VI) chloride"]], "ans": "C", "exp": "<p>Cl is −1, so Fe = 0 − 3(−1) = +3, written as the Roman numeral III. FeCl₂ is iron(II) chloride. Oxidation numbers are also used to balance redox equations.<\/p>", "tag": "L 9"}, {"n": 33, "stem": "<p>What is the fundamental idea of VSEPR theory?<\/p>", "opts": [["A", "Molecules adopt the structure that minimizes repulsion between valence electron pairs (both bond pairs and lone pairs)"], ["B", "Only bonding pairs determine molecular shape"], ["C", "Atoms arrange to maximize the number of octets"], ["D", "Lone pairs are ignored when predicting shape"]], "ans": "A", "exp": "<p>The structure adopted is the one in which repulsion between the valence electron pairs is minimized. This applies to both bonding pairs and lone pairs.<\/p>", "tag": "L 9"}, {"n": 34, "stem": "<p>What is the steric number of N in [NO₃]⁻ (one N=O and two N–O⁻)?<\/p>", "opts": [["A", "4"], ["B", "5"], ["C", "2"], ["D", "3"]], "ans": "D", "exp": "<p>A multiple bond counts as a single electron pair (domain), so use CN, not bond pairs. CN = 3, LP = 0, SN = 3: AX₃, trigonal planar.<\/p>", "tag": "L 9"}, {"n": 35, "stem": "<p>What is the VSEPR notation for H₂O?<\/p>", "opts": [["A", "AX₂"], ["B", "AX₂E"], ["C", "AX₂E₂"], ["D", "AX₄"]], "ans": "C", "exp": "<p>O has 2 atoms bonded (X₂) and 2 lone pairs (E₂): AX₂E₂, SN = 4.<\/p>", "tag": "L 9"}, {"n": 36, "stem": "<p>For NH₃, which pairing of VSEPR (electron) geometry and molecular geometry is correct?<\/p>", "opts": [["A", "Tetrahedron; trigonal pyramid"], ["B", "Trigonal planar; trigonal planar"], ["C", "Tetrahedron; bent"], ["D", "Trigonal pyramid; tetrahedron"]], "ans": "A", "exp": "<p>NH₃ is AX₃E, SN = 4, so the VSEPR geometry is a tetrahedron. The lone pair occupies one site, so the atoms form a trigonal pyramid. With lone pairs, the molecular geometry does not match the SN geometry.<\/p>", "tag": "L 9"}, {"n": 37, "stem": "<p>Why is the H–N–H angle in NH₃ smaller than the ideal tetrahedral angle?<\/p>", "opts": [["A", "Lone pairs are smaller than bond pairs"], ["B", "Multiple bonds take up extra space"], ["C", "A lone pair is physically larger than a bond pair, so lone pair/bond pair repulsion is greater and pushes the bonds together"], ["D", "N has an expanded octet"]], "ans": "C", "exp": "<p>A lone pair is larger than a bond pair, so its repulsions are greater. The H–A–H angle decreases to minimize lone pair/bond pair repulsion.<\/p>", "tag": "L 9"}, {"n": 38, "stem": "<p>SF₄ (AX₄E) has its lone pair in an equatorial site. What is the reason, and what is the shape?<\/p>", "opts": [["A", "Axial is more spacious; trigonal pyramid"], ["B", "Equatorial has only two 90° interactions (axial would have three); see-saw"], ["C", "Equatorial has no 90° interactions; square planar"], ["D", "Equatorial minimizes 120° interactions; T-shape"]], "ans": "B", "exp": "<p>The equatorial site is more spacious, with only two 90° interactions versus three for an axial lone pair. 90° interactions matter more than 120° because they are closer. The shape is see-saw.<\/p>", "tag": "L 9"}, {"n": 39, "stem": "<p>What is the molecular shape of ClF₃?<\/p>", "opts": [["A", "Trigonal planar"], ["B", "Trigonal pyramid"], ["C", "See-saw"], ["D", "T-shape"]], "ans": "D", "exp": "<p>Cl has 7 valence electrons: 3 bonds + 2 lone pairs, so AX₃E₂ (SN = 5). Both lone pairs are equatorial, giving a T-shape.<\/p>", "tag": "L 9"}, {"n": 40, "stem": "<p>What are the VSEPR notation and shape of XeF₂?<\/p>", "opts": [["A", "AX₂E₃, linear"], ["B", "AX₂E₂, bent"], ["C", "AX₂E, bent"], ["D", "AX₂E₃, bent"]], "ans": "A", "exp": "<p>Xe: 8 valence electrons; 2 bonds use 2 of them, leaving 8 − 2 − 0 = 6 nonbonding electrons = 3 lone pairs. SN = 5, AX₂E₃. The three lone pairs take the equatorial sites, so F–Xe–F is linear.<\/p>", "tag": "L 9"}, {"n": 41, "stem": "<p>Why is XeF₄ (AX₄E₂) square planar?<\/p>", "opts": [["A", "The lone pairs are 90° apart to minimize bond pair/bond pair repulsion"], ["B", "Xe has no lone pairs"], ["C", "The two lone pairs sit 180° apart, minimizing lone pair/lone pair repulsion, which dominates because they are closest to the central atom"], ["D", "SN = 4 gives a square planar geometry"]], "ans": "C", "exp": "<p>SN = 6 (octahedral). Lone pair/lone pair repulsion is greater than lone pair/bond pair and bond pair/bond pair, so the lone pairs take opposite (180°) sites, leaving a square planar arrangement of atoms.<\/p>", "tag": "L 9"}, {"n": 42, "stem": "<p>SO₂ can be drawn with S having 10 electrons (O=S=O) or 8 electrons (O=S⁺–O⁻). What does VSEPR predict?<\/p>", "opts": [["A", "Linear for the 10-electron structure, bent for the 8-electron one"], ["B", "AX₂E with SN = 3 for both, so bent"], ["C", "AX₂ with SN = 2, so linear"], ["D", "AX₂E₂ with SN = 4, so bent"]], "ans": "B", "exp": "<p>VSEPR geometry is not sensitive to the Lewis structure chosen. Both have CN = 2 and LP = 1, so SN = 3 (trigonal planar VSEPR geometry) and the molecule is bent.<\/p>", "tag": "L 9"}, {"n": 43, "stem": "<p>Which observation shows a limitation of VSEPR theory?<\/p>", "opts": [["A", "The H–S–H angle in H₂S is 92°, far from 109.5°"], ["B", "Water is bent rather than linear"], ["C", "CH₄ is tetrahedral"], ["D", "CO₂ is linear"]], "ans": "A", "exp": "<p>VSEPR fails in many cases; H₂S's 92° angle is far from the tetrahedral 109.5°. VSEPR is best used as an aide memoire. Molecular orbital theory is more sound but lacks VSEPR's simplicity.<\/p>", "tag": "L 9"}, {"n": 44, "stem": "<p>What is the idealized geometry for a steric number of 5, and what are its two kinds of sites?<\/p>", "opts": [["A", "Octahedral; cis and trans"], ["B", "Square pyramidal; apical and basal"], ["C", "Pentagonal bipyramidal; axial and equatorial"], ["D", "Trigonal bipyramidal; axial and equatorial"]], "ans": "D", "exp": "<p>SN 5 is trigonal bipyramidal (e.g. PF₅), with two distinct sites: axial and equatorial. SN 6 is octahedral (SF₆) and SN 7 is pentagonal bipyramidal.<\/p>", "tag": "L 9"}, {"n": 45, "stem": "<p>Which molecule has polar bonds but no overall dipole moment?<\/p>", "opts": [["A", "H₂O"], ["B", "NH₃"], ["C", "HF"], ["D", "CO₂"]], "ans": "D", "exp": "<p>CO₂ is linear, so its two polar C–O bond dipoles oppose each other and cancel. In bent H₂O the bond dipoles do not fully cancel, so water is polar.<\/p>", "tag": "L 9"}, {"n": 46, "stem": "<p>When polar HF molecules are placed in an electric field, how do they orient?<\/p>", "opts": [["A", "Randomly, the field has no effect"], ["B", "With the negative (F) end closest to the positive plate"], ["C", "With the positive (H) end closest to the positive plate"], ["D", "Perpendicular to the field"]], "ans": "B", "exp": "<p>Polar molecules align so that the negative end (δ⁻ F) is closest to the positive plate and the positive end (δ⁺ H) faces the negative plate.<\/p>", "tag": "L 9"}]}], "count": 46, "cards": 101, "quizlet": "https://quizlet.com/1227360162/mya-chem-lectures-8-9-flash-cards"}, {"subject": "psych", "slug": "psych-3-5", "name": "Chapters 3–5", "title": "Consciousness · Nature, nurture and human diversity · Development", "intro": "<h4>Three running frames<\/h4><ul class='flist'><li>Ch 3: consciousness as a narrator: reads the script aloud, takes credit, only sometimes edits<\/li><li>Ch 4: universal grammar (shared, evolved) vs local dialect (genes, experience, culture)<\/li><li>Ch 5: what the child brings vs what experience adds<\/li><\/ul><h4>Four properties of consciousness (Ch 3)<\/h4><ul class='flist'><li>Intentionality: directed toward an object (always about something)<\/li><li>Unity: senses integrated into one coherent whole<\/li><li>Selectivity: includes some things, leaves others out (cocktail-party phenomenon)<\/li><li>Transience: constantly changing<\/li><\/ul><h4>Sleep stages and EEG (Ch 3)<\/h4><ul class='flist'><li>Awake: beta waves (alpha when relaxed and drowsy)<\/li><li>Stage 1: theta waves; hypnagogic state<\/li><li>Stage 2: sleep spindles and K-complexes<\/li><li>Stages 3–4: delta waves; deep slow-wave sleep; severe sleep inertia if woken<\/li><li>REM: fast sawtooth waves like waking; vivid dreams; muscle atonia<\/li><li>Across the night: deep sleep early, REM periods longer later<\/li><\/ul><h4>Drug classes and neurotransmitters (Ch 3)<\/h4><ul class='flist'><li>Alcohol (depressant): increases GABA<\/li><li>Stimulants: raise dopamine and norepinephrine<\/li><li>Opiates (narcotics): mimic endorphins<\/li><li>THC (marijuana): acts on anandamide receptors<\/li><\/ul><h4>Attachment styles (Ch 5)<\/h4><ul class='flist'><li>Secure (51.6%): explores, upset at departure, calms quickly at reunion; sensitive, responsive caregiving<\/li><li>Avoidant (14.7%): ignores or turns away at reunion, hidden stress; caregiver rebuffs bids for comfort<\/li><li>Ambivalent / resistant (10.2%): clings yet pushes away, hard to soothe; inconsistent caregiving<\/li><li>Disorganized (23.5%): no consistent strategy; frightening or frightened caregiver<\/li><\/ul><h4>Piaget&#x27;s stages (Ch 5)<\/h4><ul class='flist'><li>Sensorimotor (birth–2): senses and actions; object permanence, stranger anxiety<\/li><li>Preoperational (2–6/7): words and images, no logical operations; egocentrism, no conservation<\/li><li>Concrete operational (7–11): logic about concrete events; conservation, reversibility<\/li><li>Formal operational (12+): abstract, hypothetical reasoning<\/li><\/ul><h4>Kohlberg&#x27;s levels (Ch 5)<\/h4><ul class='flist'><li>Preconventional (before ~9): self-interest, avoid punishment or gain reward<\/li><li>Conventional (early adolescence): approval, social order, laws<\/li><li>Postconventional (only some people): principles above laws; requires formal operations<\/li><li>Scored on the reasoning, not the steal / don&#x27;t-steal answer<\/li><\/ul>", "sections": [{"title": "Chapter 3 · The mysteries of consciousness", "qs": [{"n": 1, "stem": "<p>According to the study guide, what is the defining feature of consciousness?<\/p>", "opts": [["A", "The ability to report one's mental state"], ["B", "Experience"], ["C", "Attention to the self as an object"], ["D", "Integration of information from the senses"]], "ans": "B", "exp": "<p>The guide defines consciousness as subjective experience and states that \"its defining feature is experience.\" Reportability (A) describes full consciousness, a level of consciousness rather than its defining feature.<\/p>", "tag": "Ch 3"}, {"n": 2, "stem": "<p>You cannot know whether your roommate sees red the same way you do. This is an example of<\/p>", "opts": [["A", "the mind-body problem"], ["B", "phenomenology"], ["C", "the problem of other minds"], ["D", "dualism"]], "ans": "C", "exp": "<p>The problem of other minds is the difficulty of perceiving anyone else's consciousness, which is why you cannot verify that another person sees red as you do. The mind-body problem (A) concerns how the mind relates to the brain and body.<\/p>", "tag": "Ch 3"}, {"n": 3, "stem": "<p>A chatbot's responses are judged indistinguishable from a human's. According to the guide, what does this show?<\/p>", "opts": [["A", "That it is conscious, since its conversational behavior is indistinguishable from a human's"], ["B", "That it has solved the mind-body problem"], ["C", "That it has full consciousness but not self-consciousness"], ["D", "That it can act like a mind, not that it has subjective experience"]], "ans": "D", "exp": "<p>The Turing test measures behavior, not subjective experience, so passing it shows only that a machine can act like a mind. This is the problem of other minds applied to machines.<\/p>", "tag": "Ch 3"}]}, {"title": "Chapter 3 · The nature of consciousness", "qs": [{"n": 4, "stem": "<p>At a loud party, you follow your friend's story while tuning out the conversations around you. Which property of consciousness does this illustrate?<\/p>", "opts": [["A", "Intentionality"], ["B", "Unity"], ["C", "Transience"], ["D", "Selectivity"]], "ans": "D", "exp": "<p>The cocktail-party phenomenon is the guide's example of selectivity, which includes some objects and leaves others out.<\/p>", "tag": "Ch 3"}, {"n": 5, "stem": "<p>The guide says the narrator \"is always about something.\" Which property is this?<\/p>", "opts": [["A", "Intentionality"], ["B", "Unity"], ["C", "Selectivity"], ["D", "Transience"]], "ans": "A", "exp": "<p>Intentionality means being directed toward an object, so the narrator \"is always about something.\"<\/p>", "tag": "Ch 3"}, {"n": 6, "stem": "<p>Which of the following is NOT one of the four basic properties of consciousness in the guide?<\/p>", "opts": [["A", "Unity"], ["B", "Transience"], ["C", "Reportability"], ["D", "Intentionality"]], "ans": "C", "exp": "<p>The four properties are intentionality, unity, selectivity, and transience. Reportability is not one of them.<\/p>", "tag": "Ch 3"}, {"n": 7, "stem": "<p>A rider thinks, \"Three strides to the fence; sit back and keep my leg on.\" Which level of consciousness is this?<\/p>", "opts": [["A", "Minimal consciousness"], ["B", "Self-consciousness"], ["C", "Full consciousness"], ["D", "Unconsciousness"]], "ans": "C", "exp": "<p>Full consciousness means you know your mental state and can report it, as this rider does. Self-consciousness (B) would focus on the self as an object (\"Do I look nervous?\").<\/p>", "tag": "Ch 3"}, {"n": 8, "stem": "<p>As the horse shifts beneath her, a rider's body adjusts its balance without her noticing. This is<\/p>", "opts": [["A", "full consciousness"], ["B", "minimal consciousness"], ["C", "self-consciousness"], ["D", "the hypnagogic state"]], "ans": "B", "exp": "<p>Minimal consciousness is low-level sensory awareness and responsiveness that happens without noticing. In the guide's riding example, it is the body balancing unnoticed.<\/p>", "tag": "Ch 3"}]}, {"title": "Chapter 3 · Conscious contents", "qs": [{"n": 9, "stem": "<p>Experience sampling (EMA) studies, in which people report their thoughts at random moments, found that consciousness is dominated by<\/p>", "opts": [["A", "the immediate environment"], ["B", "memories of the past"], ["C", "thoughts about the self"], ["D", "plans for the future"]], "ans": "A", "exp": "<p>The EMA finding in the guide is that consciousness is dominated by the immediate environment.<\/p>", "tag": "Ch 3"}, {"n": 10, "stem": "<p>The default network is best described as brain areas that<\/p>", "opts": [["A", "are active only when a person is concentrating hard on a demanding task"], ["B", "filter out minor background sounds so that a sleeper stays asleep"], ["C", "are active when a person has no specific task, as during daydreaming"], ["D", "let System 2 check System 1's drafts and catch errors before acting"]], "ans": "C", "exp": "<p>The default network is active when a person has no specific task, as seen with fMRI at rest. It is associated with thinking about the self, social life, the past, and the future.<\/p>", "tag": "Ch 3"}, {"n": 11, "stem": "<p>In the white bear study (Wegner et al., 1987), what was the key comparison?<\/p>", "opts": [["A", "Participants who rang a bell each time they thought of the bear versus participants who stayed silent"], ["B", "Participants who first tried to suppress the thought versus those simply asked to think about it"], ["C", "Participants distracted by a second task versus participants who were not distracted"], ["D", "Participants shown a picture of a white bear versus participants shown a picture of a dog"]], "ans": "B", "exp": "<p>The design compared prior suppression with simply thinking about the bear. The suppression group later thought about the bear more, which is the rebound effect. All participants rang the bell, so A is not the comparison.<\/p>", "tag": "Ch 3"}, {"n": 12, "stem": "<p>What did the 2020 meta-analysis of 31 studies conclude about the white bear rebound effect?<\/p>", "opts": [["A", "The effect failed to replicate once larger, preregistered studies were included"], ["B", "The effect is larger than the classic graph suggests"], ["C", "The effect appears only in athletes"], ["D", "The rebound is real but smaller than the classic graph suggests"]], "ans": "D", "exp": "<p>The 2020 meta-analysis confirmed the rebound but found it smaller than the classic graph suggests. It did not fail to replicate (A), and the effect was not larger (B).<\/p>", "tag": "Ch 3"}, {"n": 13, "stem": "<p>According to Wegner's theory of ironic processes, why does mental control sometimes backfire?<\/p>", "opts": [["A", "The process that monitors for errors can itself produce them"], ["B", "Repressed desires slip through as errors"], ["C", "Random neural noise accumulates before the decision"], ["D", "The prefrontal cortex shuts down whenever we try to control thoughts"]], "ans": "A", "exp": "<p>Ironic processes occur because the monitoring process that searches for errors can itself produce them. Repression (B) belongs to Freud's theory, which is unsupported.<\/p>", "tag": "Ch 3"}, {"n": 14, "stem": "<p>A student studying in a noisy cafeteria keeps telling himself to relax before his exam. Per the guide, what is the most likely result?<\/p>", "opts": [["A", "He relaxes faster because the noise masks anxious thoughts"], ["B", "He becomes more anxious"], ["C", "His thoughts shift to the default network"], ["D", "He relaxes, because mental control works best when attention is divided"]], "ans": "B", "exp": "<p>Ironic effects are most likely under distraction or stress. The guide notes that distracted people trying to relax became more anxious, so D has it backward.<\/p>", "tag": "Ch 3"}, {"n": 15, "stem": "<p>A golf coach wants to avoid ironic errors under pressure. Based on the guide, which instruction is best?<\/p>", "opts": [["A", "\"Don't hit it into the water.\""], ["B", "\"Whatever you do, don't think about the water.\""], ["C", "\"Aim for the center of the green.\""], ["D", "\"Try to suppress any thought of missing.\""]], "ans": "C", "exp": "<p>The guide states that instructions about what to do work better than instructions about what to avoid. Options A, B, and D all name the outcome to avoid.<\/p>", "tag": "Ch 3"}]}, {"title": "Chapter 3 · The unconscious mind", "qs": [{"n": 16, "stem": "<p>How does the modern cognitive unconscious differ from Freud's dynamic unconscious?<\/p>", "opts": [["A", "The cognitive unconscious works mainly through repression, keeping unacceptable memories out of awareness; Freud's does not"], ["B", "The cognitive unconscious is fast, automatic processing with no hidden agenda; Freud's is a hidden author with its own agenda"], ["C", "Freud's dynamic unconscious is the current scientific view, and the cognitive unconscious has been abandoned"], ["D", "The cognitive unconscious treats Freudian slips as the best evidence of hidden desires and inner conflict"]], "ans": "B", "exp": "<p>The guide's metaphors are a writers' room with no hidden agenda (cognitive) versus one hidden author with its own agenda (Freudian). Freud's view is not supported by research, so C is wrong.<\/p>", "tag": "Ch 3"}, {"n": 17, "stem": "<p>What evidence did Freud offer for the dynamic unconscious?<\/p>", "opts": [["A", "Freudian slips"], ["B", "The Libet clock experiment"], ["C", "The cocktail-party phenomenon"], ["D", "Experience sampling"]], "ans": "A", "exp": "<p>The guide lists Freudian slips as the evidence offered for the dynamic unconscious and repression.<\/p>", "tag": "Ch 3"}, {"n": 18, "stem": "<p>Pfungst (1907) found that Clever Hans answered correctly only when<\/p>", "opts": [["A", "von Osten, his owner and trainer, was the one asking the question"], ["B", "the problem was simple addition rather than multiplication or division"], ["C", "Hans was rewarded with food after every correct answer"], ["D", "the questioner knew the answer and Hans could see the questioner"]], "ans": "D", "exp": "<p>Pfungst's tests showed that Hans succeeded only when both were true, and he answered even for strangers, which rules out A.<\/p>", "tag": "Ch 3"}, {"n": 19, "stem": "<p>What was really happening in the Clever Hans case?<\/p>", "opts": [["A", "Von Osten deliberately signaled the answers with a secret, practiced cue"], ["B", "Hans could really count small numbers but needed von Osten's help for large ones"], ["C", "Questioners unknowingly relaxed at the right number, and Hans stopped tapping"], ["D", "Hans had memorized the answers to the questions he was most often asked"]], "ans": "C", "exp": "<p>Questioners tensed while Hans tapped and relaxed at the right number, and no one, not even von Osten, knew they were giving the answer away. That rules out deliberate signaling (A).<\/p>", "tag": "Ch 3"}, {"n": 20, "stem": "<p>The Clever Hans case is most directly a reason for which research practice?<\/p>", "opts": [["A", "Double-blind procedures"], ["B", "Experience sampling"], ["C", "Meta-analysis"], ["D", "Content analysis of diaries"]], "ans": "A", "exp": "<p>The Clever Hans effect, in which an observer's unintentional cues shape the behavior being observed, is one reason for double-blind procedures.<\/p>", "tag": "Ch 3"}]}, {"title": "Chapter 3 · Dual-process theories and conscious will", "qs": [{"n": 21, "stem": "<p>A student types a text to a friend, rereads it, catches an autocorrect error, and fixes it before sending. Which process did the checking?<\/p>", "opts": [["A", "System 1"], ["B", "The default network"], ["C", "System 2"], ["D", "Minimal consciousness"]], "ans": "C", "exp": "<p>Rereading a text before sending it is the guide's example of System 2 acting as editor, checking a draft and catching errors.<\/p>", "tag": "Ch 3"}, {"n": 22, "stem": "<p>According to the guide, when is the System 2 \"editor\" most likely to skip its check?<\/p>", "opts": [["A", "When the person is well rested and focused"], ["B", "When the person is tired, rushed, or distracted"], ["C", "Only during Stage 4 sleep"], ["D", "Only when System 1 is inactive"]], "ans": "B", "exp": "<p>Editing takes effort, so the editor skips the check when the person is tired, rushed, or distracted.<\/p>", "tag": "Ch 3"}, {"n": 23, "stem": "<p>In the dual-process framework, which statement is accurate?<\/p>", "opts": [["A", "System 1 operates only when System 2 is switched off, as in sleep or distraction"], ["B", "Both systems share a single neural pathway and take turns using it during the day"], ["C", "System 2 produces the quick first drafts, and System 1 checks them"], ["D", "Both are continuously active while awake and use different neural pathways"]], "ans": "D", "exp": "<p>The guide states that both systems are continuously active while we are awake and draw on different neural pathways. System 1, not System 2, produces the first drafts (C).<\/p>", "tag": "Ch 3"}, {"n": 24, "stem": "<p>In Libet et al. (1983), how were the three events timed?<\/p>", "opts": [["A", "EEG for brain activity, EMG for the movement, and the clock-dot report for the conscious wish"], ["B", "fMRI for brain activity, a button press for the movement, and a verbal report for the wish"], ["C", "EMG for brain activity, EEG for the movement, and a stopwatch for the conscious wish"], ["D", "A stopwatch held by the participant, used to time all three events"]], "ans": "A", "exp": "<p>EEG timed the brain's readiness signal, EMG timed the finger movement, and participants reported the clock-dot position when they first felt the wish to move.<\/p>", "tag": "Ch 3"}, {"n": 25, "stem": "<p>Which ordering of Libet's findings is correct, relative to the finger movement?<\/p>", "opts": [["A", "Conscious wish about 535 ms before; brain activity about 204 ms before"], ["B", "Brain activity about 535 ms before; conscious wish about 204 ms before"], ["C", "Brain activity and conscious wish both about 204 ms before"], ["D", "Conscious wish first, then brain activity, then movement"]], "ans": "B", "exp": "<p>The readiness signal began about 535 ms before the movement and the conscious wish about 204 ms before. A reverses the two numbers.<\/p>", "tag": "Ch 3"}, {"n": 26, "stem": "<p>What is the current status of Libet's findings, per the guide?<\/p>", "opts": [["A", "The timing failed to replicate"], ["B", "The findings prove that free will is an illusion"], ["C", "The timing replicates, but the meaning is debated"], ["D", "Libet withdrew the findings after Schurger et al. (2021)"]], "ans": "C", "exp": "<p>The guide says the timing replicates but its meaning is debated. The findings do not prove that free will is an illusion (B).<\/p>", "tag": "Ch 3"}, {"n": 27, "stem": "<p>The accumulator view (Schurger et al., 2021) reinterprets Libet's early brain signal as<\/p>", "opts": [["A", "a conscious veto that stops an action already under way"], ["B", "random neural noise building up, with the decision made near the movement"], ["C", "evidence that a repressed desire was secretly driving the finger movement"], ["D", "activity in the default network as the mind wanders before acting"]], "ans": "B", "exp": "<p>Schurger et al. (2021) argue that the early signal may be accumulating random noise and that the real decision comes close to the movement.<\/p>", "tag": "Ch 3"}, {"n": 28, "stem": "<p>Libet's \"free won't\" proposal holds that<\/p>", "opts": [["A", "consciousness may still veto an action already under way"], ["B", "unconscious processes can block conscious decisions"], ["C", "people cannot stop an action once the readiness signal begins"], ["D", "hypnosis removes the ability to refuse"]], "ans": "A", "exp": "<p>\"Free won't\" is Libet's argument that consciousness may still veto an action already under way.<\/p>", "tag": "Ch 3"}, {"n": 29, "stem": "<p>Maya thinks \"I'll turn on the light\" just before her hand flips the switch. The thought matched the action, and nothing else seemed to prompt it, so she concludes her thought caused the movement. Which conditions of apparent mental causation are present?<\/p>", "opts": [["A", "Repression, rebound, and selectivity"], ["B", "Intentionality, unity, and transience"], ["C", "Tolerance, dependence, and withdrawal"], ["D", "Priority, consistency, and exclusivity"]], "ans": "D", "exp": "<p>The thought came first (priority), it fit the action (consistency), and no other cause was obvious (exclusivity) (Wegner &amp; Wheatley, 1999). Option B lists the properties of consciousness.<\/p>", "tag": "Ch 3"}]}, {"title": "Chapter 3 · Sleep and dreaming", "qs": [{"n": 30, "stem": "<p>A person drifting off sees brief flashes of geometric shapes and has floating thoughts that don't quite make sense. This is the<\/p>", "opts": [["A", "hypnopompic state"], ["B", "hypnagogic state"], ["C", "REM state"], ["D", "hypnic jerk"]], "ans": "B", "exp": "<p>The hypnagogic state is pre-sleep consciousness with geometric flashes and floating thoughts. The hypnopompic state (A) is post-sleep, when dream imagery lingers after the eyes open.<\/p>", "tag": "Ch 3"}, {"n": 31, "stem": "<p>Which EEG pattern matches Stage 2 sleep?<\/p>", "opts": [["A", "Theta waves"], ["B", "Delta waves"], ["C", "Sleep spindles and K-complexes"], ["D", "Fast, sawtooth waves"]], "ans": "C", "exp": "<p>Stage 2 is marked by sleep spindles and K-complexes. Theta waves (A) mark Stage 1.<\/p>", "tag": "Ch 3"}, {"n": 32, "stem": "<p>A dog barks outside, but a sleeper briefly registers it and stays asleep because the sound is harmless. Which EEG feature is responsible?<\/p>", "opts": [["A", "K-complexes"], ["B", "Sleep spindles"], ["C", "Alpha waves"], ["D", "Delta waves"]], "ans": "A", "exp": "<p>K-complexes act as \"security guards\" that assess sudden, louder sounds and reset the cortex if the sound is harmless. Spindles (B) block minor sounds such as a passing car.<\/p>", "tag": "Ch 3"}, {"n": 33, "stem": "<p>Which description of REM (\"paradoxical sleep\") matches the guide?<\/p>", "opts": [["A", "The sleeper is easy to wake but remembers nothing"], ["B", "The EEG shows the slowest, most synchronized waves of the night while dreams are vivid"], ["C", "The sleeper walks around with eyes open"], ["D", "The EEG resembles waking beta waves while voluntary muscles are paralyzed"]], "ans": "D", "exp": "<p>REM shows fast, sawtooth waves that resemble waking beta waves, yet the voluntary muscles are paralyzed (muscle atonia).<\/p>", "tag": "Ch 3"}, {"n": 34, "stem": "<p>Why is being woken from Stage 4 so different from being woken from REM?<\/p>", "opts": [["A", "Stage 4 brings severe sleep inertia; from REM, the brain is near waking pace and you wake alert"], ["B", "Stage 4 sleepers are instantly alert, while REM sleepers are groggy for 10 to 15 minutes"], ["C", "Both cause the same 10 to 15 minutes of confusion, but Stage 4 dreams are easier to remember"], ["D", "REM sleepers are paralyzed by muscle atonia, so they cannot be woken until REM ends"]], "ans": "A", "exp": "<p>Waking from deep sleep brings severe sleep inertia, with 10 to 15 minutes of grogginess. REM sleepers wake quickly alert and remember the dream clearly. B reverses the two.<\/p>", "tag": "Ch 3"}, {"n": 35, "stem": "<p>How does sleep typically change across the night, according to the guide?<\/p>", "opts": [["A", "REM dominates early; deep sleep grows longer in later cycles"], ["B", "All stages occupy roughly equal time in every cycle of the night"], ["C", "Deep stages dominate early; REM periods grow longer in later cycles"], ["D", "Stages 3 and 4 increase steadily until waking, while REM periods shrink"]], "ans": "C", "exp": "<p>Deep stages dominate early in the night, REM periods lengthen in later cycles, and stages 3 and 4 largely disappear by about halfway through.<\/p>", "tag": "Ch 3"}, {"n": 36, "stem": "<p>Ellman et al. (1991) woke humans and rats whenever REM began. After only a few days, they observed<\/p>", "opts": [["A", "improved memory consolidation"], ["B", "memory problems and excess aggression"], ["C", "narcolepsy and sleep paralysis"], ["D", "no measurable effects on mood or memory"]], "ans": "B", "e
