xp": "<p>Being woken whenever REM began produced memory problems and excess aggression in both humans and rats within a few days.<\/p>", "tag": "Ch 3"}, {"n": 37, "stem": "<p>A middle-aged man with higher weight snores loudly, and his partner notices he stops breathing for brief periods at night. He is unaware of it. The most likely disorder is<\/p>", "opts": [["A", "insomnia"], ["B", "narcolepsy"], ["C", "sleep apnea"], ["D", "sleep terrors"]], "ans": "C", "exp": "<p>Sleep apnea is brief stopping of breathing caused by airway obstruction, which also produces snoring. It is most common in middle-aged men with higher weight and often goes unnoticed by the sleeper.<\/p>", "tag": "Ch 3"}, {"n": 38, "stem": "<p>According to the guide, what does a real sleepwalker look like?<\/p>", "opts": [["A", "Arms stretched out, eyes closed"], ["B", "Walking normally with eyes open, sometimes with a glassy stare"], ["C", "Shuffling slowly with arms limp, unable to respond to anything"], ["D", "Running in panic with intense emotional arousal, then waking abruptly"]], "ans": "B", "exp": "<p>The guide states that real sleepwalkers walk normally with their eyes open, not with arms out and eyes closed (A).<\/p>", "tag": "Ch 3"}, {"n": 39, "stem": "<p>Which of the following is NOT one of the six sleep disorders covered in the guide?<\/p>", "opts": [["A", "Narcolepsy"], ["B", "Sleep paralysis"], ["C", "Somnambulism"], ["D", "Hypnic jerk"]], "ans": "D", "exp": "<p>The six disorders are insomnia, sleep apnea, somnambulism, narcolepsy, sleep paralysis, and sleep terrors. A hypnic jerk is a sensation of dropping as you drift off, listed with the pre-sleep states, not a disorder.<\/p>", "tag": "Ch 3"}]}, {"title": "Chapter 3 · Dream consciousness and dream theories", "qs": [{"n": 40, "stem": "<p>In a dream you fly by flapping your arms and never think \"this is impossible.\" Which brain change best explains this?<\/p>", "opts": [["A", "Deactivation of the prefrontal cortex in REM"], ["B", "High activity in the amygdala during REM"], ["C", "Activation of the motor cortex during REM"], ["D", "Increased delta waves"]], "ans": "A", "exp": "<p>Uncritical acceptance happens because the prefrontal cortex, which supports judgment and checking, is deactivated in REM. The editor is asleep. The amygdala (B) explains emotion, not acceptance.<\/p>", "tag": "Ch 3"}, {"n": 41, "stem": "<p>The intense emotion of dreams is linked in the guide to which REM brain change?<\/p>", "opts": [["A", "Deactivation of the visual association areas"], ["B", "High activity in the amygdala"], ["C", "Reduced brainstem activity"], ["D", "Activation of the glymphatic system"]], "ans": "B", "exp": "<p>The guide links dreams' intense emotion to the amygdala being highly active in REM. Visual association areas (A) are activated, not deactivated, in REM.<\/p>", "tag": "Ch 3"}, {"n": 42, "stem": "<p>Which of the following is NOT one of the five characteristics of dream consciousness?<\/p>", "opts": [["A", "Intense emotion, such as terror or euphoria"], ["B", "Uncritical acceptance"], ["C", "Difficulty remembering the dream on waking"], ["D", "Heightened self-reflection and critical judgment"]], "ans": "D", "exp": "<p>The five characteristics are intense emotion, illogical thought, fully formed meaningful sensation, uncritical acceptance, and difficulty remembering on waking. Critical judgment is reduced in dreams because the prefrontal cortex is deactivated.<\/p>", "tag": "Ch 3"}, {"n": 43, "stem": "<p>Meaidi et al. (2014) compared the dreams of sighted, late-blind, and congenitally blind people. What did they find for the congenitally blind?<\/p>", "opts": [["A", "Their dreams contained as many visual impressions as sighted people's dreams did"], ["B", "They reported no dreams at all, since dreaming requires visual imagery"], ["C", "Visual impressions were rare (about 20%), offset by more sound and touch"], ["D", "Their dreams contained no nightmares, because threats are mostly visual"]], "ans": "C", "exp": "<p>Visual impressions appear in about 20% of congenitally blind people's dreams (versus about 75% for the late blind and 100% for sighted people), and they make up for it with more auditory and tactile content. They also have nightmares in nearly 25% of their dreams, so D is wrong.<\/p>", "tag": "Ch 3"}, {"n": 44, "stem": "<p>Which theory holds that dreams begin with random neural activity and meaning is added as the mind interprets it?<\/p>", "opts": [["A", "Freud's theory"], ["B", "Neurocognitive theory"], ["C", "NEXTUP"], ["D", "Activation-synthesis"]], "ans": "D", "exp": "<p>Activation-synthesis says random activity comes first and meaning is added afterward. Freud (A) says meaning comes first, in disguise.<\/p>", "tag": "Ch 3"}, {"n": 45, "stem": "<p>Content analysis of tens of thousands of dream diaries found that 70-80% of dreams dramatize ordinary waking concerns. Which theory does this support?<\/p>", "opts": [["A", "Neurocognitive theory"], ["B", "Threat-simulation theory"], ["C", "Freud's theory"], ["D", "Activation-synthesis"]], "ans": "A", "exp": "<p>Domhoff's neurocognitive theory holds that the default network produces dreams similar to waking life, and the diary data support it.<\/p>", "tag": "Ch 3"}, {"n": 46, "stem": "<p>A researcher argues that dreams of being chased exist so the dreamer can practice escape and avoidance. Which theory is this?<\/p>", "opts": [["A", "NEXTUP"], ["B", "Activation-synthesis"], ["C", "Freud's theory"], ["D", "Threat-simulation theory"]], "ans": "D", "exp": "<p>Threat-simulation theory holds that dreams simulate likely threats so we can practice escape and avoidance. NEXTUP (A) is about exploring weak memory associations.<\/p>", "tag": "Ch 3"}, {"n": 47, "stem": "<p>Amnesic patients who play Tetris before bed dream of falling blocks even though they cannot remember playing. This is evidence cited for<\/p>", "opts": [["A", "Freud's wish-fulfillment theory"], ["B", "threat-simulation theory"], ["C", "NEXTUP (Stickgold &amp; Zadra, 2021)"], ["D", "the rebound effect"]], "ans": "C", "exp": "<p>The Tetris finding supports NEXTUP's claim that REM actively explores memory networks, even for experiences the person cannot consciously recall.<\/p>", "tag": "Ch 3"}]}, {"title": "Chapter 3 · Drugs and consciousness", "qs": [{"n": 48, "stem": "<p>A heavy coffee drinker keeps drinking coffee mainly to avoid the headache and fatigue she gets without it. This illustrates<\/p>", "opts": [["A", "positive reinforcement"], ["B", "negative reinforcement"], ["C", "drug tolerance"], ["D", "psychological dependence"]], "ans": "B", "exp": "<p>Negative reinforcement is continuing drug use to reduce or eliminate withdrawal symptoms. Positive reinforcement (A) is using because the drug feels good.<\/p>", "tag": "Ch 3"}, {"n": 49, "stem": "<p>Months after physical withdrawal symptoms have ended, a former smoker still feels a strong desire to smoke. This is<\/p>", "opts": [["A", "physical dependence"], ["B", "drug tolerance"], ["C", "psychological dependence"], ["D", "negative reinforcement"]], "ans": "C", "exp": "<p>Psychological dependence is a strong desire to return to the drug after the physical withdrawal symptoms are gone.<\/p>", "tag": "Ch 3"}, {"n": 50, "stem": "<p>What did Robins et al. (1980) find about soldiers who became addicted to heroin in Vietnam?<\/p>", "opts": [["A", "Most relapsed within a year of returning home, showing that addiction is permanent"], ["B", "Many left the habit behind on returning home, showing that the environment matters"], ["C", "Those with a genetic predisposition never recovered, whatever their surroundings"], ["D", "Most switched to marijuana, which then acted as a gateway drug"]], "ans": "B", "exp": "<p>Many soldiers left heroin behind on returning home, which shows that the environment matters.<\/p>", "tag": "Ch 3"}, {"n": 51, "stem": "<p>Which pairing of drug class and neurotransmitter link is correct, per the guide?<\/p>", "opts": [["A", "Stimulants: increase GABA"], ["B", "Opiates: act on receptors normally activated by anandamide"], ["C", "Alcohol: raises dopamine and norepinephrine"], ["D", "THC: acts on anandamide receptors"]], "ans": "D", "exp": "<p>THC acts on receptors normally activated by anandamide. Alcohol increases GABA, stimulants raise dopamine and norepinephrine, and opiates mimic endorphins, so A, B, and C are mismatched.<\/p>", "tag": "Ch 3"}, {"n": 52, "stem": "<p>Why is withdrawal from narcotics (opiates) severe, according to the guide?<\/p>", "opts": [["A", "Opiates flood endorphin receptors, which weakens them and may lower endorphin output"], ["B", "Opiates permanently damage serotonin neurons, so mood cannot recover"], ["C", "Opiates increase GABA, and the brain then stops producing its own GABA"], ["D", "Opiates produce little tolerance, so users keep taking dangerously large doses"]], "ans": "A", "exp": "<p>Opiates are closely related to endorphins, and flooding the endorphin receptors reduces their effectiveness and may depress endorphin production. Serotonin damage (B) is linked to Ecstasy.<\/p>", "tag": "Ch 3"}, {"n": 53, "stem": "<p>Which drug class is described as producing little tolerance or dependence, with overdose deaths rare?<\/p>", "opts": [["A", "Depressants"], ["B", "Stimulants"], ["C", "Narcotics"], ["D", "Hallucinogens"]], "ans": "D", "exp": "<p>Hallucinogens produce little tolerance or dependence, and overdose deaths are rare. Depressants (A) produce both physical and psychological dependence.<\/p>", "tag": "Ch 3"}, {"n": 54, "stem": "<p>Participants who believe they drank alcohol, but actually drank a placebo, act more uninhibited. This supports<\/p>", "opts": [["A", "alcohol myopia"], ["B", "expectancy theory"], ["C", "the gateway drug hypothesis"], ["D", "negative reinforcement"]], "ans": "B", "exp": "<p>Expectancy theory holds that alcohol's effects can be produced by expectations alone, as when people who only think they drank act uninhibited.<\/p>", "tag": "Ch 3"}, {"n": 55, "stem": "<p>After a few drinks, a man who had a mildly disappointing day begins sobbing at the bar, unable to weigh the sad thought against anything else. This best illustrates<\/p>", "opts": [["A", "alcohol myopia"], ["B", "expectancy theory"], ["C", "physical dependence"], ["D", "drug tolerance"]], "ans": "A", "exp": "<p>Alcohol myopia narrows attention to whatever is most salient, as in the guide's \"crying in the bar\" example, where a minor sad thought takes over.<\/p>", "tag": "Ch 3"}]}, {"title": "Chapter 3 · Hypnosis", "qs": [{"n": 56, "stem": "<p>Which of the following is NOT an effect of hypnosis described in the guide?<\/p>", "opts": [["A", "Posthypnotic amnesia"], ["B", "Hypnotic analgesia"], ["C", "Improved accuracy of memory"], ["D", "A feeling that actions are happening on their own"]], "ans": "C", "exp": "<p>Hypnosis does not improve memory accuracy. It can raise confidence and create false memories. The other three options are effects listed in the guide.<\/p>", "tag": "Ch 3"}, {"n": 57, "stem": "<p>What does the guide say about hypnotic susceptibility?<\/p>", "opts": [["A", "It is highest in people high in extraversion and openness"], ["B", "It is about the same for everyone who agrees to be hypnotized"], ["C", "It can be predicted from a person's Big Five personality traits"], ["D", "It varies greatly and is not predictable from personality traits"]], "ans": "D", "exp": "<p>Susceptibility varies greatly between people and is not predictable from personality traits.<\/p>", "tag": "Ch 3"}, {"n": 58, "stem": "<p>In Kosslyn et al. (2000), what happened when hypnotized participants were told to see color in a gray image?<\/p>", "opts": [["A", "Activity changed in color-processing areas of the brain"], ["B", "Nothing changed in the brain, showing hypnosis is only role-playing"], ["C", "They lost the ability to see any color"], ["D", "Their memory for the image became more accurate"]], "ans": "A", "exp": "<p>Suggestions to see color in a gray image changed activity in color-processing areas, which shows that hypnosis can alter brain activity.<\/p>", "tag": "Ch 3"}]}, {"title": "Chapter 4 · Our shared grammar: evolutionary psychology", "qs": [{"n": 59, "stem": "<p>In Herodotus's story, Greeks were horrified at the idea of burning their dead fathers and Callatians at the idea of eating theirs. In the guide's framework, what does this story illustrate?<\/p>", "opts": [["A", "That moral values are entirely learned from culture, with no shared human basis underneath"], ["B", "That opposite customs (dialect) can express one shared duty to honor parents (grammar)"], ["C", "That one culture's funeral practice was more adaptive than the other's and so spread further"], ["D", "That evolution produces fixed, identical behaviors that every society shows"]], "ans": "B", "exp": "<p>The Greeks and Callatians had opposite customs (dialect) but shared the same duty to honor their parents (grammar). Evolution builds a shared toolkit, not fixed identical behaviors, so D is wrong.<\/p>", "tag": "Ch 4"}, {"n": 60, "stem": "<p>According to the guide, evolutionary psychology is the study of the evolution of behavior and the mind using principles of natural selection, and it focuses mostly on:<\/p>", "opts": [["A", "why individuals within a family differ in personality"], ["B", "how culture changes values within a single lifetime"], ["C", "how experience changes gene expression without altering DNA"], ["D", "what makes humans alike"]], "ans": "D", "exp": "<p>The guide defines evolutionary psychology as focusing mostly on what makes humans alike. Explaining individual differences or within-lifetime change belongs to experience and culture.<\/p>", "tag": "Ch 4"}, {"n": 61, "stem": "<p>Which statement matches the guide's definition of natural selection?<\/p>", "opts": [["A", "Inherited traits that aid survival and reproduction in an environment are most likely passed on"], ["B", "Traits an organism acquires through experience during its lifetime are passed on to its offspring"], ["C", "Experience changes how much a gene is read, and these changes build up across generations"], ["D", "Organisms deliberately develop the traits that their environment requires in order to survive"]], "ans": "A", "exp": "<p>This is the guide's definition. B describes inheritance of acquired traits, which is not natural selection, and C describes epigenetics.<\/p>", "tag": "Ch 4"}, {"n": 62, "stem": "<p>Which definition of a mutation matches the guide?<\/p>", "opts": [["A", "A random error in gene replication; one source of variation for selection"], ["B", "A change in how much a gene is read, caused by experience"], ["C", "The only source of genetic variation that natural selection can act on"], ["D", "An inherited trait that improves survival in a particular environment"]], "ans": "A", "exp": "<p>A mutation is a random error in gene replication and is one source of variation. C is wrong because new gene combinations at conception are another source.<\/p>", "tag": "Ch 4"}, {"n": 63, "stem": "<p>Glocker et al. (2009) morphed real infant photos to look more or less babyish. What did they find?<\/p>", "opts": [["A", "Only mothers showed stronger reward-center responses to more babyish faces, reflecting experience with infants"], ["B", "Less babyish faces were rated as more trustworthy and activated the reward center more"], ["C", "More babyish faces activated the reward center (nucleus accumbens) more, even in women without children"], ["D", "More babyish faces activated the amygdala, signaling threat rather than reward"]], "ans": "C", "exp": "<p>More babyish faces activated the nucleus accumbens more strongly, even in women who had never had children. Because the effect did not depend on being a mother, A is wrong.<\/p>", "tag": "Ch 4"}, {"n": 64, "stem": "<p>Holt-Lunstad et al. (2010) combined data from many studies on social ties. Which finding did they report?<\/p>", "opts": [["A", "Lonely people were 50% more likely to develop a phobia, comparable to the risk from early trauma"], ["B", "Social ties predicted survival only in people over 65, and only for married people"], ["C", "Strong ties made people 50% more likely to be alive about 7.5 years later"], ["D", "Strong social ties improved happiness but had no measurable effect on survival"]], "ans": "C", "exp": "<p>Strong social ties meant being 50% more likely to be alive about 7.5 years later, an effect comparable to quitting smoking. This is the key evidence for the need to belong.<\/p>", "tag": "Ch 4"}, {"n": 65, "stem": "<p>Cacioppo's evolutionary account of loneliness holds that loneliness:<\/p>", "opts": [["A", "evolved as a warning signal, like hunger, because for our ancestors isolation could mean death"], ["B", "is a cultural byproduct of modern individualism with no evolutionary basis"], ["C", "evolved to push people toward independence from groups so they could explore new territory"], ["D", "is a mismatch caused by the spread of sweet and fatty foods"]], "ans": "A", "exp": "<p>Cacioppo argues loneliness evolved as a warning signal, like hunger, because isolation could mean death for our ancestors.<\/p>", "tag": "Ch 4"}, {"n": 66, "stem": "<p>Fessler et al. (2005) found that women in the first trimester of pregnancy are more easily disgusted, especially by food. Why is the first trimester the key comparison?<\/p>", "opts": [["A", "It is when food cravings are strongest, so food is simply noticed more often"], ["B", "It is when women are most socially isolated and most vigilant"], ["C", "It is when hormones make every emotion stronger to an equal degree"], ["D", "It is when immunity is lowest, so disease avoidance should be most active"]], "ans": "D", "exp": "<p>Immunity is lowest in the first trimester, which is when a disease-avoidance system should be most active. That is the logic behind treating disgust as disease avoidance.<\/p>", "tag": "Ch 4"}, {"n": 67, "stem": "<p>In Belyaev's farm-fox experiment, foxes were bred only for tameness toward humans. Within generations they also showed floppy ears, curly tails, and piebald coats. What does this show?<\/p>", "opts": [["A", "The breeders selected for floppy ears and spotted coats as well as for tameness"], ["B", "Selection can act on behavior quickly, and unselected traits can come along with it"], ["C", "Tameness is learned from human handlers each generation rather than inherited"], ["D", "The appearance traits came first and then caused the foxes to become tame"]], "ans": "B", "exp": "<p>The foxes were selected only for tameness, so the floppy ears, curly tails, and piebald coats came along unselected. A is wrong because appearance was never selected.<\/p>", "tag": "Ch 4"}, {"n": 68, "stem": "<p>European and East African herders both evolved lactase persistence, but through different mutations. This is an example of:<\/p>", "opts": [["A", "convergent adaptation"], ["B", "overimitation"], ["C", "epigenetic inheritance"], ["D", "evolutionary mismatch"]], "ans": "A", "exp": "<p>Separate groups facing the same pressure evolved the same trait through different genetic routes, which is the definition of convergent adaptation.<\/p>", "tag": "Ch 4"}, {"n": 69, "stem": "<p>Why does the guide also treat lactase persistence as an example of nature times nurture?<\/p>", "opts": [["A", "Drinking milk turned on the lactase gene within each herder's lifetime"], ["B", "Milk changed the methyl tags on herders' lactase gene, and the tags were then inherited"], ["C", "Children learned to tolerate milk by imitating their parents"], ["D", "A cultural practice (herding) changed the environment, which then selected the genes"]], "ans": "D", "exp": "<p>Herding, a cultural practice, changed the environment, and that environment selected the genes. A describes expression, but the milk example is selection, not expression.<\/p>", "tag": "Ch 4"}]}, {"title": "Chapter 4 · A capacity to learn", "qs": [{"n": 70, "stem": "<p>In Horner and Whiten's (2005) study, what happened in the clear-box condition?<\/p>", "opts": [["A", "Both chimpanzees and children skipped the useless poke once they could see it did nothing"], ["B", "Both chimpanzees and children copied both steps, just as in the opaque box"], ["C", "Chimpanzees skipped the useless poke; children kept copying it"], ["D", "Children skipped the useless poke, but chimpanzees kept copying it"]], "ans": "C", "exp": "<p>In the clear box, chimps skipped the visibly useless poke while children kept copying it, even when they thought no one was watching.<\/p>", "tag": "Ch 4"}, {"n": 71, "stem": "<p>Why was the clear box essential to Horner and Whiten's design?<\/p>", "opts": [["A", "It let the researchers hide the reward so that the chimpanzees could not simply grab it"], ["B", "It showed who copied faithfully, because only then was the step visibly useless"], ["C", "It made the task easier, so that the young children could succeed as often as the chimpanzees"], ["D", "It kept the demonstrator hidden, so participants could not copy the demonstrator's facial cues"]], "ans": "B", "exp": "<p>In the opaque box, copying both steps is sensible for anyone. Only a visibly useless step reveals faithful copying (overimitation).<\/p>", "tag": "Ch 4"}, {"n": 72, "stem": "<p>A child watches a parent tap a cake pan three times before putting it in the oven and does the same, even though the tapping clearly does nothing. According to the guide, why might this tendency be valuable?<\/p>", "opts": [["A", "It shows that children understand the purpose of every step they copy, even hidden ones"], ["B", "It is a sign of weak reasoning that disappears once children have learned their culture"], ["C", "It shows that children copy only those behaviors that have been rewarded in the past"], ["D", "It lets skills, rituals, and traditions pass on even when no one understands every step"]], "ans": "D", "exp": "<p>Overimitation looks inefficient, but it lets skills, rituals, and traditions pass on even when no one understands every step, which makes it a foundation of culture.<\/p>", "tag": "Ch 4"}]}, {"title": "Chapter 4 · Our genetic legacy and mismatch", "qs": [{"n": 73, "stem": "<p>Which is an example of evolutionary mismatch as the guide describes it?<\/p>", "opts": [["A", "Cravings for sweet and fatty foods, once rare, now feeding obesity and diabetes"], ["B", "Children adopting their friends' accents instead of their immigrant parents' accents"], ["C", "Japanese students encoding a fish together with its background in the aquarium study"], ["D", "Foxes developing floppy ears and curly tails after being bred only for tameness"]], "ans": "A", "exp": "<p>Sweet and fat cravings were adaptive when those foods were scarce and are mismatched now that they are everywhere. The other options are peer influence, cultural perception, and the domestication package.<\/p>", "tag": "Ch 4"}, {"n": 74, "stem": "<p>Cook and Mineka (1989) edited videos so that the identical fear reaction appeared to be directed at either a toy snake or crocodile, or at flowers or a toy rabbit. What did the editing accomplish?<\/p>", "opts": [["A", "It made the toy snake look more realistic and threatening than the flowers did"], ["B", "It kept the model's fear identical, so only the object differed between conditions"], ["C", "It let the monkeys see the real snakes that the model's fear had been aimed at"], ["D", "It hid the model monkey's fear so that only the objects themselves were visible"]], "ans": "B", "exp": "<p>Editing kept the fear reaction identical, so only the object differed. Any difference in learning must then come from the object itself.<\/p>", "tag": "Ch 4"}, {"n": 75, "stem": "<p>What did Cook and Mineka's monkeys learn, and what does it show?<\/p>", "opts": [["A", "They feared all four objects equally, showing that monkeys copy any fear they see"], ["B", "They feared none of the objects, because lab-raised monkeys never develop snake fear"], ["C", "They feared the snake and crocodile but not the flowers or rabbit: prepared learning"], ["D", "They feared the flowers and rabbit more, because those objects were less familiar"]], "ans": "C", "exp": "<p>The monkeys learned to fear the snake and crocodile but not the flowers or rabbit, so they were not just copying any fear they saw. They were prepared to learn fears of ancestral dangers.<\/p>", "tag": "Ch 4"}]}, {"title": "Chapter 4 · A universal moral grammar?", "qs": [{"n": 76, "stem": "<p>Mikhail (2007) compared moral judgment to the grammar of language. His central claim is that people everywhere may share:<\/p>", "opts": [["A", "unconscious, intuitive principles for judging actions, which they often cannot explain"], ["B", "identical moral rules that every culture weighs in exactly the same way"], ["C", "explicit moral rules that are taught directly through religion and law"], ["D", "moral rules that vary randomly from one culture to the next, with no common core"]], "ans": "A", "exp": "<p>Mikhail proposed shared, unconscious, intuitive principles, such as intended harm versus side effect, applied even when people cannot explain them. B is wrong because cultures weigh moral principles differently.<\/p>", "tag": "Ch 4"}, {"n": 77, "stem": "<p>Curry, Mullins, and Whitehouse (2019) found seven cooperative behaviors judged morally good in all 60 societies they studied. Which of the following was NOT one of the seven?<\/p>", "opts": [["A", "Deferring to superiors"], ["B", "Being brave"], ["C", "Respecting others' property"], ["D", "Forgiving one's enemies"]], "ans": "D", "exp": "<p>The seven are helping family, helping your group, returning favors, being brave, deferring to superiors, dividing resources fairly, and respecting others' property. Forgiving enemies is not on the list.<\/p>", "tag": "Ch 4"}, {"n": 78, "stem": "<p>According to Curry et al. (2019), how do cultures differ with respect to the seven cooperative behaviors?<\/p>", "opts": [["A", "Some cultures treat several of the seven behaviors as morally bad rather than good"], ["B", "They weigh them differently, such as family loyalty versus fairness to strangers"], ["C", "Only Western cultures endorse all seven; other cultures endorse just a few"], ["D", "Cultures differ only in whether the behaviors are observed there at all"]], "ans": "B", "exp": "<p>All seven were judged good wherever they were observed, and none was treated as bad, but cultures weigh them differently. A contradicts the finding.<\/p>", "tag": "Ch 4"}]}, {"title": "Chapter 4 · The trolley dilemmas", "qs": [{"n": 79, "stem": "<p>In every version of the trolley dilemma, five people die unless one person dies instead. Why does the guide stress that the outcome never changes?<\/p>", "opts": [["A", "Because a constant outcome makes the dilemmas easier and faster for participants to answer"], ["B", "Because it shows that people care only about how many lives are saved"], ["C", "Because only how the one person dies changes, so judgment differences must come from that"], ["D", "Because it ensures that all participants give the same answer to every version"]], "ans": "C", "exp": "<p>Holding the outcome constant means that only the manner of death varies, so any difference in judgment must come from that.<\/p>", "tag": "Ch 4"}, {"n": 80, "stem": "<p>The comparison between the Switch and Loop dilemmas isolates which factor?<\/p>", "opts": [["A", "Personal force used to cause the death"], ["B", "The number of lives saved"], ["C", "Whether the participant is being watched"], ["D", "Whether the death is a side effect or a means"]], "ans": "D", "exp": "<p>In Switch the death is a side effect, and in Loop it is a means. Personal force (A) is what separates Loop from Footbridge.<\/p>", "tag": "Ch 4"}, {"n": 81, "stem": "<p>The comparison between the Loop and Footbridge dilemmas isolates which factor?<\/p>", "opts": [["A", "Personal force"], ["B", "Side effect versus means"], ["C", "Whether the person could jump clear"], ["D", "The number of people on the main track"]], "ans": "A", "exp": "<p>Both Loop and Footbridge use the death as a means, and only Footbridge adds personal force.<\/p>", "tag": "Ch 4"}, {"n": 82, "stem": "<p>In one dilemma, if the man on the side track jumped clear, the trolley would loop around and kill the five; you only pull a lever. How does the guide classify his death?<\/p>", "opts": [["A", "A side effect without personal force"], ["B", "A means plus personal force"], ["C", "A means, but with no personal force"], ["D", "A side effect plus personal force"]], "ans": "C", "exp": "<p>This is the Loop dilemma: his body is the brake (a means), but pulling a lever involves no personal force.<\/p>", "tag": "Ch 4"}, {"n": 83, "stem": "<p>Awad et al. (2020) surveyed about 70,000 people in 42 countries. What were the average percentages saying sacrifice was acceptable?<\/p>", "opts": [["A", "Switch 51%, Loop 72%, Footbridge 81%"], ["B", "Switch 81%, Loop 72%, Footbridge 51%"], ["C", "Switch 72%, Loop 81%, Footbridge 51%"], ["D", "Switch 81%, Loop 51%, Footbridge 72%"]], "ans": "B", "exp": "<p>The averages were Switch 81%, Loop 72%, Footbridge 51%, with approval falling as harm becomes a means and then adds personal force.<\/p>", "tag": "Ch 4"}, {"n": 84, "stem": "<p>In Awad et al. (2020), what was the \"universal grammar\" and what was the \"local dialect\"?<\/p>", "opts": [["A", "The ordering Switch &gt; Loop &gt; Footbridge held in every country; the level of approval varied"], ["B", "The level of approval was the same everywhere; the ordering varied by country"], ["C", "Every country approved of Footbridge more than Switch; only the size of the gap varied"], ["D", "Nothing was universal; both ordering and level varied"]], "ans": "A", "exp": "<p>The ordering Switch &gt; Loop &gt; Footbridge held in all 42 countries, which is the grammar. The level varied, which is the dialect.<\/p>", "tag": "Ch 4"}, {"n": 85, "stem": "<p>Relational mobility predicted country differences in Awad et al. (2020). Which statement about relational mobility is correct?<\/p>", "opts": [["A", "It is a personality trait measured separately in each individual participant"], ["B", "It is highest in East Asia and the Middle East, where farming was settled"], ["C", "It is simply another name for individualism, measured at the country level"], ["D", "It describes how freely people in a society can form and leave relationships"]], "ans": "D", "exp": "<p>Relational mobility describes a society, not an individual. It is high in the Americas, Europe, and Australia/New Zealand and low in East Asia and the Middle East, so B is wrong.<\/p>", "tag": "Ch 4"}, {"n": 86, "stem": "<p>Why were people in low relational mobility societies less willing to endorse pushing the man?<\/p>", "opts": [["A", "They had received more formal education in moral philosophy and ethics"], ["B", "They feared being marked as cold or dangerous, a reputation they could not escape"], ["C", "They cared less about saving the five people on the main track than other people did"], ["D", "They were less familiar with trolleys and found the scenarios confusing"]], "ans": "B", "exp": "<p>In low-mobility societies you cannot escape your reputation, so endorsing pushing could mark you as cold or dangerous.<\/p>", "tag": "Ch 4"}, {"n": 87, "stem": "<p>Claessens et al. (2020) reanalyzed Awad's data, accounting for the fact that neighboring countries are not independent data points. What did they find?<\/p>", "opts": [["A", "The universal Switch &gt; Loop &gt; Footbridge ordering disappeared in several regions"], ["B", "Relational mobility predicted all three dilemmas even more strongly than before"], ["C", "Relational mobility predicted only Footbridge judgments; the universal ordering held"], ["D", "GDP replaced relational mobility as the best predictor of all three dilemmas"]], "ans": "C", "exp": "<p>After accounting for non-independence of neighboring countries, relational mobility predicted only Footbridge judgments. The universal ordering was not challenged, so A is wrong.<\/p>", "tag": "Ch 4"}, {"n": 88, "stem": "<p>Which of the following is a limitation of Awad et al. (2020) noted in the guide?<\/p>", "opts": [["A", "The sample came from only one country, so cross-cultural claims were untested"], ["B", "The dilemmas were presented in only one language, English"], ["C", "It measured actual behavior, so it cannot speak to moral judgments"], ["D", "The online sample was self-selected: mostly male, young, and college-educated"]], "ans": "D", "exp": "<p>The sample was self-selected online, about 75% men, 75% under 32, and 73% college-educated. The study also measured hypothetical judgments, not behavior, so C is wrong.<\/p>", "tag": "Ch 4"}]}, {"title": "Chapter 4 · The Glauconian tyrant revisited: who would push the man?", "qs": [{"n": 89, "stem": "<p>Everett, Pizarro, and Crockett (2016) found that people who refused to sacrifice the one were judged more trustworthy and were given more money in a trust game. What does this suggest?<\/p>", "opts": [["A", "Trust games are unrelated to moral judgments, so the result is likely a fluke"], ["B", "People who refuse to sacrifice are simply better at economic games"], ["C", "Moral judgments are social signals: a pusher might treat you as a means to an end"], ["D", "Utilitarian answers are seen as the most trustworthy in economic exchanges"]], "ans": "C", "exp": "<p>Refusers were trusted more and given more money, which suggests moral judgments signal how a person might treat you.<\/p>", "tag": "Ch 4"}, {"n": 90, "stem": "<p>Bartels and Pizarro (2011) found that preference for sacrifice correlated with psychopathy and Machiavellianism. Why does the guide say this result alone is not the full story?<\/p>", "opts": [["A", "The sample was too small to detect any reliable correlation"], ["B", "A \"yes\" can come from concern for outcomes or from weak aversion to harm"], ["C", "The correlation reversed when later studies tried to replicate it"], ["D", "Psychopathy was measured only in prisoners, not in the student sample"]], "ans": "B", "exp": "<p>A \"yes\" to sacrifice can reflect concern for outcomes or weak harm aversion, and the correlation alone cannot tell which. Process dissociation was needed to separate them.<\/p>", "tag": "Ch 4"}, {"n": 91, "stem": "<p>Conway et al. (2018) used process dissociation to separately measure concern for outcomes and aversion to harm. What did they find?<\/p>", "opts": [["A", "Psychopathy went with greater concern for saving lives"], ["B", "Utilitarian philosophers showed weaker harm aversion than psychopathic individuals"], ["C", "Concern for outcomes and harm aversion could not be separated"], ["D", "Psychopathy went with weaker harm aversion, not greater concern for lives"]], "ans": "D", "exp": "<p>Psychopathy was linked to weaker harm aversion, not greater concern for lives. It was utilitarian philosophers who showed genuine concern for the greater good, so B is wrong.<\/p>", "tag": "Ch 4"}, {"n": 92, "stem": "<p>A utilitarian philosopher and a person high in psychopathy both say they would push the man in Footbridge. What is the correct interpretation, according to the guide?<\/p>", "opts": [["A", "Same answer, different reasons: concern for the greater good versus weak aversion to harm"], ["B", "Utilitarian philosophers are, in effect, psychopaths, since both give the same answer"], ["C", "Both are motivated by greater concern for saving lives than most people have"], ["D", "Both lack knowledge of the moral grammar that most people share"]], "ans": "A", "exp": "<p>Same answer, different reasons. The guide explicitly says this does not mean utilitarians are psychopaths.<\/p>", "tag": "Ch 4"}, {"n": 93, "stem": "<p>Cima et al. (2010) found that psychopathic offenders make the same moral judgments as other people. What does the guide conclude?<\/p>", "opts": [["A", "Psychopathy has no relation to moral behavior"], ["B", "They know the moral grammar but do not feel its pull"], ["C", "Their judgments are copied from others to avoid detection"], ["D", "They lack the universal moral grammar entirely"]], "ans": "B", "exp": "<p>Psychopathic offenders know the moral grammar and judge as others do, but they do not feel its pull (knowing vs. caring).<\/p>", "tag": "Ch 4"}, {"n": 94, "stem": "<p>Bereczkei et al. (2010) and White (2014) found that people high in Machiavellianism or psychopathy helped more when observed and less when anonymous. How do these findings connect to Glaucon's tyrant?<\/p>", "opts": [["A", "They show that anonymity makes everyone behave worse, to the same degree"], ["B", "They show that these people have unusually high empathy when observed"], ["C", "They fit \"the height of injustice is to seem just without being so\""], ["D", "They show that prosocial people, too, help only when they are observed"]], "ans": "C", "exp": "<p>They acted good mainly when seen, which fits Glaucon's tyrant, who seems just without being so. D is wrong because prosocial people behaved the same either way.<\/p>", "tag": "Ch 4"}]}, {"title": "Chapter 4 · Our experiences: genes and environment shape each other", "qs": [{"n": 95, "stem": "<p>Every cell in your body contains the same DNA, yet a brain cell and a skin cell are very different. According to the guide, what explains the difference?<\/p>", "opts": [["A", "Each cell type carries a different set of genes, created by mutations during development"], ["B", "They differ in gene expression: how much each gene is read and used"], ["C", "Natural selection has favored different genes in each type of cell over many generations"], ["D", "Methyl tags rewrite the DNA sequence in different ways in each type of cell"]], "ans": "B", "exp": "<p>Gene expression is how much a gene is read and used to build its product. Every cell has the same DNA (about 20,000 genes); a brain cell and a skin cell differ in expression. Methyl tags (D) lower expression without changing the DNA sequence.<\/p>", "tag": "Ch 4"}, {"n": 96, "stem": "<p>Which pairing of example and mechanism is correct?<\/p>", "opts": [["A", "Mother rats' licking: natural selection across generations"], ["B", "Lactase persistence: epigenetic change within a lifetime"], ["C", "Enriched cages: natural selection across generations"], ["D", "Mother rats' licking: epigenetic change within a lifetime"]], "ans": "D", "exp": "<p>Licking changes gene expression epigenetically within a pup's lifetime. Lactase persistence is selection across generations, and enrichment changes brain structure, not which genes spread.<\/p>", "tag": "Ch 4"}, {"n": 97, "stem": "<p>According to Evershed et al. (2022), what best explains why the milk gene spread?<\/p>", "opts": [["A", "Milk was simply a valuable everyday food for herders in ordinary times"], ["B", "Milk use began at the same time the gene appeared, about 3,000 years ago"], ["C", "Famine and disease, when milk-induced diarrhea could be deadly"], ["D", "People without the gene could not digest any milk at all, even as adults"]], "ans": "C", "exp": "<p>The timing of the gene's spread matched famine and disease, when milk-induced diarrhea could be deadly. A is the \"obvious answer\" the guide calls incomplete.<\/p>", "tag": "Ch 4"}, {"n": 98, "stem": "<p>Which evidence from Evershed et al. (2022) undercut the obvious \"milk is a valuable food\" explanation?<\/p>", "opts": [["A", "Ancient DNA showed the variant became common as soon as dairying began"], ["B", "Adults without the variant drank about as much milk, with little harm"], ["C", "Pottery residues showed Europeans began using milk only about 3,000 years ago"], ["D", "Heavier milk use lined up closely with stronger selection for the gene"]], "ans": "B", "exp": "<p>If most adults without the variant drink milk with little harm, carrying the variant gave little advantage on ordinary days, so \"milk is a valuable food\" cannot explain strong selection. C is wrong because milk use goes back about 9,000 years.<\/p>", "tag": "Ch 4"}, {"n": 99, "stem": "<p>Evershed et al. found that Europeans used milk for about 9,000 years, while the lactase variant stayed rare until about 3,000 years ago. What general lesson does the guide draw?<\/p>", "opts": [["A", "Culture has no influence on which genes spread in a population"], ["B", "Milk use caused the lactase mutation directly in those who drank it"], ["C", "Genes always change first, and culture then adapts to them"], ["D", "Natural selection often works through the worst times, not ordinary days"]], "ans": "D", "exp": "<p>Selection often works through crises rather than ordinary days. Culture created the milk, and crises decided who could safely live on it.<\/p>", "tag": "Ch 4"}]}, {"title": "Chapter 4 · Experience shapes the brain", "qs": [{"n": 100, "stem": "<p>Rosenzweig, Krech, and colleagues raised rats either together in cages with daily-changing toys or alone in bare cages. What mainly accounted for the enriched rats' heavier, thicker cortex?<\/p>", "opts": [["A", "More dendrites, synapses, glia, and blood vessels, not mostly more neurons"], ["B", "Mostly a larger number of neurons, produced by the extra stimulation"], ["C", "Growth of the hippocampus alone, with the rest of the cortex unchanged"], ["D", "Fewer but much larger neurons, each with a thicker cell body"]], "ans": "A", "exp": "<p>The enriched cortex was heavier mainly because of more of everything around the neurons, such as dendrites, synapses, glia, and blood vessels, not mostly more neurons.<\/p>", "tag": "Ch 4"}, {"n": 101, "stem": "<p>Maguire et al. (2000) found that licensed London taxi drivers had a larger posterior hippocampus, larger with more years driving. Why was this not enough to show that learning the city caused the growth?<\/p>", "opts": [["A", "The hippocampus is not involved in spatial memory or navigation"], ["B", "It was correlational: people with big hippocampi might choose the job"], ["C", "Years of driving were not measured, so no dose-response could be seen"], ["D", "Licensed drivers' hippocampi were actually smaller than other people's"]], "ans": "B", "exp": "<p>A cross-sectional link between driving and hippocampal size cannot rule out selection into the job. Even the \"more years, bigger hippocampus\" finding is still correlational.<\/p>", "tag": "Ch 4"}, {"n": 102, "stem": "<p>Woollett and Maguire (2011) followed taxi trainees and controls for 3 to 4 years. Why is this the causal evidence?<\/p>", "opts": [["A", "It compared drivers with many years of experience to drivers with only a few years"], ["B", "It randomly assigned some volunteers to learn The Knowledge and others not to"], ["C", "It tracked the same people before and after; only trainees who passed showed growth"], ["D", "It showed that all trainees, whether or not they passed, grew larger hippocampi"]], "ans": "C", "exp": "<p>Measuring the same people before and after learning rules out selection, and growth appeared only in the trainees who passed. There was no random assignment, so B is wrong.<\/p>", "tag": "Ch 4"}, {"n": 103, "stem": "<p>A 45-year-old learns to play the violin and the relevant brain connections strengthen. Which concept from the guide does this illustrate?<\/p>", "opts": [["A", "Overimitation of skilled musicians"], ["B", "Prepared learning of musical sounds"], ["C", "Plasticity, which does not end in childhood"], ["D", "Convergent adaptation in adulthood"]], "ans": "C", "exp": "<p>Plasticity means neural tissue reorganizes with experience, and brain development does not end in childhood, so used connections strengthen in adults too.<\/p>", "tag": "Ch 4"}]}, {"title": "Chapter 4 · Epigenetics: how a mother's care reaches her pups' genes", "qs": [{"n": 104, "stem": "<p>What do methyl tags do, according to the guide?<\/p>", "opts": [["A", "They change the sequence of the DNA itself, creating a new version of the gene"], ["B", "They attach to the end of a gene and increase how often it is read"], ["C", "They create new genes in response to experience, adding to the genome"], ["D", "They attach to the start of a gene and make it harder to read, lowering expression"]], "ans": "D", "exp": "<p>Methyl tags attach to the start of a gene and lower expression without changing the DNA, so A is wrong.<\/p>", "tag": "Ch 4"}, {"n": 105, "stem": "<p>Which sequence correctly traces how a high-licking mother rat produces a calm adult?<\/p>", "opts": [["A", "Licking removes methyl tags, expression rises, more stress receptors form, and the adult recovers faster"], ["B", "Licking adds methyl tags, expression falls, fewer receptors form, and the adult never reacts to danger"], ["C", "Licking alters the DNA sequence of the stress-brake gene, and the new sequence is then inherited"], ["D", "Licking raises stress hormone levels, which permanently shut off the pup's stress response"]], "ans": "A", "exp": "<p>Licking removes tags, raising expression of the stress-brake gene. More receptors mean more brakes, and the adult is calm: it still reacts to danger but recovers faster.<\/p>", "tag": "Ch 4"}, {"n": 106, "stem": "<p>In the rat-pup licking research, pups were swapped at birth between high- and low-licking mothers. What did this cross-fostering design rule out, and how?<\/p>", "opts": [["A", "The role of stress hormones: swapped pups produced none at all"], ["B", "Inherited genes: swapped pups grew up like the mother who raised them"], ["C", "The role of care: swapped pups grew up like their biological mothers"], ["D", "Methylation: tags turned out identical in all of the swapped pups"]], "ans": "B", "exp": "<p>Swapped pups resembled their rearing mother, which separates inherited genes from received care. C states the opposite of the finding.<\/p>", "tag": "Ch 4"}, {"n": 107, "stem": "<p>Which statement about the licking effect is correct according to the guide?<\/p>", "opts": [["A", "It disappears soon after the licking stops, once the pups are weaned"], ["B", "It is caused by a permanent change in the DNA sequence of the pups' stress gene"], ["C", "It lasts into adulthood and cannot be undone once it is established"], ["D", "It lasts into adulthood, yet a drug that removes methyl tags can reverse it"]], "ans": "D", "exp": "<p>The effect persists into adulthood long after licking stops, yet it is reversible with a drug that removes methyl tags.<\/p>", "tag": "Ch 4"}, {"n": 108, "stem": "<p>What is the current status of the human evidence from McGowan et al. (2009), who found more methylation and lower expression of the stress-brake gene in people who died by suicide and had been abused as children?<\/p>", "opts": [["A", "It is a large randomized experiment that settles the question in humans"], ["B", "It contradicts the rat findings, showing less methylation after abuse"], ["C", "It is suggestive, but small and correlational"], ["D", "It has been retracted because the samples were contaminated"]], "ans": "C", "exp": "<p>The guide calls the human finding suggestive but small and correlational, and says the strong evidence comes from rats.<\/p>", "tag": "Ch 4"}, {"n": 109, "stem": "<p>A student concludes from the licking study that \"genes don't matter, only care does.\" Why does the guide call this wrong?<\/p>", "opts": [["A", "Because the rats' DNA sequence actually changed in response to licking"], ["B", "Because care changed the same gene's expression; without the gene, nothing would be regulated"], ["C", "Because cross-fostering showed that the calm temperament was inherited from the biological mother"], ["D", "Because the licking effect has been found only in humans, not in rats"]], "ans": "B", "exp": "<p>The gene was the same and care changed its expression. Without the gene there would be nothing for experience to regulate.<\/p>", "tag": "Ch 4"}]}, {"title": "Chapter 4 · How much credit or blame do parents deserve?", "qs": [{"n": 110, "stem": "<p>In the Bucharest Early Intervention Project, institutionalized children were randomly assigned to foster care or to remain in the orphanage. Why can the foster children's gains be credited to care itself?<\/p>", "opts": [["A", "Because random assignment made the groups comparable, so differences reflect care"], ["B", "Because the foster children were chosen for their higher initial IQ scores"], ["C", "Because all of the children eventually left the orphanage anyway"], ["D", "Because the foster children were matched with identical twins who stayed behind"]], "ans": "A", "exp": "<p>Random assignment means the groups differed only in care, so the IQ and attachment gains can be credited to care itself.<\/p>", "tag": "Ch 4"}, {"n": 111, "stem": "<p>What did the Minnesota twin studies find about identical twins separated early?<\/p>", "opts": [["A", "They were much less similar in personality than twins raised together"], ["B", "They differed mainly because of their different adoptive parents' styles"], ["C", "They were about as similar in personality as twins raised together"], ["D", "They were similar in values and religion, but not in personality"]], "ans": "C", "exp": "<p>Twins raised apart were about as similar as twins raised together, and shared family environment explains less than 10% of personality differences.<\/p>", "tag": "Ch 4"}, {"n": 112, "stem": "<p>Twin studies suggest parents matter little for personality, yet the Bucharest project found that foster care raised IQ. How does the guide reconcile these?<\/p>", "opts": [["A", "The twin studies were flawed and their results should be set aside"], ["B", "IQ is shaped by genes, whereas personality is shaped by the home"], ["C", "The Bucharest project lacked a control group, so its result is unreliable"], ["D", "They sample different ranges: ordinary homes vs. severe deprivation"]], "ans": "D", "exp": "<p>The two kinds of study sample different ranges of environment, ordinary homes versus severe deprivation. Parents matter most at the extremes.<\/p>", "tag": "Ch 4"}, {"n": 113, "stem": "<p>According to the guide, parents strongly shape all of the following EXCEPT:<\/p>", "opts": [["A", "political views and party loyalty"], ["B", "personality (in ordinary homes)"], ["C", "religious beliefs and practice"], ["D", "values and everyday manners"]], "ans": "B", "exp": "<p>Within the normal range of decent homes, home differences matter little for personality. Parents do strongly shape politics, religion, values, and manners.<\/p>", "tag": "Ch 4"}, {"n": 114, "stem": "<p>Two siblings raised in the same home turn out quite different in personality. According to the guide, where do most of the non-genetic differences in personality come from?<\/p>", "opts": [["A", "Shared family environment, such as the parents' income and the household's rules"], ["B", "Epigenetic tags inherited from grandparents, which differ between siblings"], ["C", "Nonshared experiences, such as different friends, teachers, and chance events"], ["D", "Prepared learning, which makes each sibling fear different things"]], "ans": "C", "exp": "<p>Roughly half of personality differences come from genes, and most of the rest from nonshared experiences that even siblings do not share: friends, teachers, chance events, and different treatment by parents. Shared family environment (A) explains less than 10%.<\/p>", "tag": "Ch 4"}]}, {"title": "Chapter 4 · Peer influence", "qs": [{"n": 115, "stem": "<p>Children of immigrant parents usually end up speaking with the accent of their friends, not their parents. This is the best everyday evidence for:<\/p>", "opts": [["A", "Harris's group socialization theory"], ["B", "prepared learning of language sounds"], ["C", "epigenetic effects of parents' speech"], ["D", "the restricted range of adoptive homes"]], "ans": "A", "exp": "<p>The accent example shows the playground beating the home, which is the best everyday evidence for Harris's group socialization theory.<\/p>", "tag": "Ch 4"}, {"n": 116, "stem": "<p>According to Judith Rich Harris, how do parents still matter?<\/p>", "opts": [["A", "Mainly through the personality traits they teach directly"], ["B", "Mainly through methylation of their children's genes"], ["C", "They do not matter at all, even through where they choose to live"], ["D", "Partly by choosing the neighborhood and school"]], "ans": "D", "exp": "<p>Harris argued that parents matter partly by choosing the neighborhood and school, which determine the peers. C overstates her view.<\/p>", "tag": "Ch 4"}]}, {"title": "Chapter 4 · Our dialects: culture", "qs": [{"n": 117, "stem": "<p>Faced with a long commute, Jon quits and finds a new job closer to home, while Mei reorganizes her expectations and adjusts her schedule. Which coping methods do these represent, according to the individualism-collectivism table?<\/p>", "opts": [["A", "Jon: accommodate to reality (collectivism); Mei: change reality (individualism)"], ["B", "Both: change reality (individualism)"], ["C", "Jon: change reality (individualism); Mei: accommodate to reality (collectivism)"], ["D", "Both: accommodate to reality (collectivism)"]], "ans": "C", "exp": "<p>Individualism's coping method is to change reality, and collectivism's is to accommodate to reality.<\/p>", "tag": "Ch 4"}, {"n": 118, "stem": "<p>Someone from a collectivist culture is most likely to explain a coworker's behavior by referring to:<\/p>", "opts": [["A", "the social norms and roles that apply"], ["B", "the coworker's personality and attitudes"], ["C", "the coworker's genes"], ["D", "the coworker's personal uniqueness"]], "ans": "A", "exp": "<p>In collectivist cultures, behavior is attributed to social norms and roles. Personality and attitudes (B) is the individualist pattern.<\/p>", "tag": "Ch 4"}, {"n": 119, "stem": "<p>In Kim and Markus's (1999) pen study, airport travelers chose a pen as thanks for completing a survey; most of the pens were one color and a few were another. What did the original study find, and what does it show about culture?<\/p>", "opts": [["A", "European Americans tended to pick the uncommon pen and East Asians the common one, showing that culture shapes the self"], ["B", "East Asians tended to pick the uncommon pen and European Americans the common one, showing that culture shapes the self"], ["C", "Both groups picked pens at random, showing that culture does not affect simple choices"], ["D", "European Americans tended to pick the common pen, showing that culture shapes color perception"]], "ans": "A", "exp": "<p>European Americans tended to choose the uncommon pen and East Asians the common one, showing the independent versus interdependent self. B reverses the finding.<\/p>", "tag": "Ch 4"}, {"n": 120, "stem": "<p>What did the 2022 replication of Kim and Markus's (1999) pen study find?<\/p>", "opts": [["A", "The pattern reversed, with East Asians now preferring the unique pen"], ["B", "The same pattern but smaller, possibly reflecting growing individualism"], ["C", "No cultural difference at all in which pen people chose"], ["D", "A larger effect than the original, especially among Chinese participants"]], "ans": "B", "exp": "<p>The replication found the same pattern but smaller, with more Chinese participants choosing the unique pen, possibly reflecting growing individualism.<\/p>", "tag": "Ch 4"}, {"n": 121, "stem": "<p>In Shweder and Bourne's (1982) study, how did Oriya adults in Bhubaneswar, India, describe people they knew?<\/p>", "opts": [["A", "With abstract, stable traits, such as \"She is friendly\" or \"He is ambitious\""], ["B", "With concrete actions in relationships, such as \"She brings cakes to my family\""], ["C", "Mainly by physical appearance, such as height and dress"], ["D", "Mainly by occupation and social status"]], "ans": "B", "exp": "<p>Oriya adults used concrete actions in contexts and relationships. Abstract traits (A) were the American pattern.<\/p>", "tag": "Ch 4"}, {"n": 122, "stem": "<p>In Masuda and Nisbett's (2001) aquarium study, Japanese students were worse than Americans at recognizing the focal fish on a new background. What does this reflect?<\/p>", "opts": [["A", "Weaker memory overall for everything in the scenes"], ["B", "Less attention to the scenes"], ["C", "Analytic attention focused on the fish alone"], ["D", "Holistic encoding of the fish together with its setting"]], "ans": "D", "exp": "<p>Japanese students encoded the fish together with its context (holistic attention), so a new background hurt recognition. The guide says this is not weaker memory (A).<\/p>", "tag": "Ch 4"}]}, {"title": "Chapter 4 · Culture changes, and fast", "qs": [{"n": 123, "stem": "<p>Name trends, word use in books, and approval of interracial marriage (about 4% in 1958 to 94% in 2021) all shifted within decades. What does the guide say these changes show?<\/p>", "opts": [["A", "Natural selection can change values within a few generations"], ["B", "Individualism is decreasing as societies grow wealthier"], ["C", "Cultural change is always positive"], ["D", "Culture can change too fast to be genetic"]], "ans": "D", "exp": "<p>These shifts happened within decades, too fast to be genetic. As societies grow wealthier, values tend to shift toward individualism, so B is wrong, and not all changes are positive, so C is wrong.<\/p>", "tag": "Ch 4"}]}, {"title": "Chapter 4 · Universal grammar, local dialects: putting it together", "qs": [{"n": 124, "stem": "<p>Which pair of examples best shows the guide's final point that nature and nurture \"write each other\"?<\/p>", "opts": [["A", "Enriched cages thickened rats' cortex, and learning the city enlarged trainees' hippocampi"], ["B", "Americans picked the unique pen, and Japanese students encoded fish together with their background"], ["C", "Herding changed which genes spread, and a mother's care changed how her pups' genes were read"], ["D", "Babyish faces activate the reward center, and strong social ties predict survival"]], "ans": "C", "exp": "<p>Culture (herding) changed which genes spread, and care changed how genes were read, so each force reshapes the other. The other pairs illustrate a single force.<\/p>", "tag": "Ch 4"}]}, {"title": "Chapter 5 · Our first bond: attachment", "qs": [{"n": 125, "stem": "<p>According to the study guide, attachment in young children is defined behaviorally as:<\/p>", "opts": [["A", "a biologically based pattern of emotional reactivity that is visible from birth"], ["B", "an emotional tie, shown by seeking closeness to the caregiver and distress on separation"], ["C", "a sense, built through reliable care, that the world is predictable and people can be counted on"], ["D", "the tendency to bond strongly to the first moving object seen after birth"]], "ans": "B", "exp": "<p>The guide defines attachment as an emotional tie shown by seeking closeness and separation distress; A is temperament and C is Erikson's basic trust.<\/p>", "tag": "Ch 5"}, {"n": 126, "stem": "<p>A 9-month-old who happily smiled at everyone a few months ago now cries when an unfamiliar neighbor approaches. Which explanation fits the guide?<\/p>", "opts": [["A", "She now has schemas for familiar faces and is starting to crawl: stranger anxiety"], ["B", "She has entered the preoperational stage and become egocentric about other people's views"], ["C", "She has an avoidant attachment style"], ["D", "She is showing separation distress, which begins only after object permanence is complete at 18 months"]], "ans": "A", "exp": "<p>Stranger anxiety begins by about 8 months, when infants have schemas for familiar faces and are starting to crawl away from safety.<\/p>", "tag": "Ch 5"}, {"n": 127, "stem": "<p>A toddler at a playground wanders off to explore the slide, glances back at his father every minute or so, and keeps playing. Which sign of a bond is this?<\/p>", "opts": [["A", "Safe haven"], ["B", "Proximity seeking"], ["C", "Separation distress"], ["D", "Secure base"]], "ans": "D", "exp": "<p>Exploring from the caregiver and checking back is a secure base; a safe haven is returning when frightened.<\/p>", "tag": "Ch 5"}, {"n": 128, "stem": "<p>The \"cupboard love\" theory held that infants love the mother because:<\/p>", "opts": [["A", "she provides soft body contact"], ["B", "she is the first moving object they see"], ["C", "she provides food"], ["D", "she responds sensitively to their signals"]], "ans": "C", "exp": "<p>Cupboard love is the Freudian and behaviorist view that infants love the mother because she provides food.<\/p>", "tag": "Ch 5"}, {"n": 129, "stem": "<p>Which term best describes the human case, in which an early experience has an especially large effect but missing it does not close the door forever?<\/p>", "opts": [["A", "Sensitive period"], ["B", "Imprinting window"], ["C", "Internal working model"], ["D", "Critical period"]], "ans": "A", "exp": "<p>A sensitive period has an especially large effect without closing the door forever; a critical period is the rigid window seen in imprinting.<\/p>", "tag": "Ch 5"}]}, {"title": "Chapter 5 · Taking apart cupboard love", "qs": [{"n": 130, "stem": "<p>Why did Lorenz's incubator-hatched goslings, which followed Lorenz everywhere, count as evidence against cupboard love?<\/p>", "opts": [["A", "Lorenz fed the goslings by hand, so the bond came from food"], ["B", "Goslings feed themselves, so the bond could not have come from food"], ["C", "The goslings followed their real mother once she reappeared"], ["D", "The goslings bonded only after a critical period of several weeks"]], "ans": "B", "exp": "<p>Goslings feed themselves, so their bond to Lorenz could not come from food; nature supplied the readiness, experience the target.<\/p>", "tag": "Ch 5"}, {"n": 131, "stem": "<p>Which two lines of research undermined the \"cupboard love\" theory?<\/p>", "opts": [["A", "Ainsworth's Strange Situation and van den Boom's training experiment"], ["B", "Sroufe's longitudinal study and Hazan and Shaver's adult love survey"], ["C", "Lorenz's goslings and Harlow's cloth- and wire-mother monkeys"], ["D", "Bowlby's internal working model and Madigan's 2023 meta-analysis"]], "ans": "C", "exp": "<p>Lorenz's goslings (which feed themselves) and Harlow's monkeys (which chose comfort over food) both showed the bond does not come from food.<\/p>", "tag": "Ch 5"}, {"n": 132, "stem": "<p>Hess exposed ducklings to a moving, quacking model duck at different ages. What did he find, and what did later work add?<\/p>", "opts": [["A", "Imprinting peaked about 13 to 16 hours after hatching; later work found birds can re-imprint"], ["B", "Imprinting was equally strong at any age; later work showed that human babies imprint the same way"], ["C", "Imprinting peaked at about 8 months; later work showed it can never be reversed once formed"], ["D", "Imprinting occurred only to real mother ducks; later work showed that models never produce it"]], "ans": "A", "exp": "<p>Hess found peak imprinting at about 13 to 16 hours after hatching, and later work showed birds can re-imprint.<\/p>", "tag": "Ch 5"}, {"n": 133, "stem": "<p>What is the key design logic of Harlow's cloth- and wire-mother study?<\/p>", "opts": [["A", "Monkeys were raised in total isolation to test whether food alone was enough for normal development"], ["B", "Monkeys were randomly assigned to sensitive or insensitive real mothers"], ["C", "Food came from one mother and comfort from the other, so the infants' choice separated the two"], ["D", "A noisy toy was introduced to see which of the two mothers the infants feared more"]], "ans": "C", "exp": "<p>The key logic is dissociation: food from one mother, comfort from the other, and infants chose comfort; D describes the separate fear test.<\/p>", "tag": "Ch 5"}, {"n": 134, "stem": "<p>In Harlow's study, infants whose bottle was on the wire mother:<\/p>", "opts": [["A", "fed there, then went back to cling to the cloth mother"], ["B", "stayed with the wire mother because it provided food"], ["C", "showed no preference between the two mothers"], ["D", "refused to feed and became ill"]], "ans": "A", "exp": "<p>Wire-fed infants fed there and then returned to cling to the cloth mother, showing contact comfort, not food, built the bond.<\/p>", "tag": "Ch 5"}, {"n": 135, "stem": "<p>When a noisy drum-beating toy was placed in the cage, Harlow's infants ran to the cloth mother, calmed down, and then approached the toy. This illustrates:<\/p>", "opts": [["A", "a secure base"], ["B", "a safe haven"], ["C", "imprinting"], ["D", "stranger anxiety"]], "ans": "B", "exp": "<p>Running to the cloth mother when frightened is a safe haven; exploring from her in the strange room is a secure base.<\/p>", "tag": "Ch 5"}, {"n": 136, "stem": "<p>In Harlow's strange-room test, what was the lesson about secure attachment?<\/p>", "opts": [["A", "Secure attachment makes a baby clingier and less willing to explore"], ["B", "Infants explored equally whether or not the cloth mother was present"], ["C", "Infants with the wire mother explored more because they were less attached"], ["D", "Secure attachment makes a baby braver, not clingier"]], "ans": "D", "exp": "<p>With the cloth mother present infants explored and checked back, so secure attachment makes a baby braver, not clingier.<\/p>", "tag": "Ch 5"}, {"n": 137, "stem": "<p>Which statement about Harlow's total-isolation studies is NOT consistent with the guide?<\/p>", "opts": [["A", "Monkeys isolated for 3 months were terrified at first but adjusted within weeks"], ["B", "Monkeys isolated for 6 to 12 months showed lasting damage, and most were neglectful or abusive as mothers"], ["C", "Monkeys isolated for 6 to 12 months never recovered, no matter what intervention was tried"], ["D", "Paired with younger, gentle monkeys, many recovered within about 6 months"]], "ans": "C", "exp": "<p>This is the false statement: many 6- to 12-month isolates recovered within about 6 months when paired with younger, gentle monkeys.<\/p>", "tag": "Ch 5"}]}, {"title": "Chapter 5 · Bowlby and the internal working model", "qs": [{"n": 138, "stem": "<p>Bowlby assigned two functions to attachment. Which pairing is correct?<\/p>", "opts": [["A", "It provides food (nature) and teaches the baby its first words (nurture)"], ["B", "It keeps babies alive (nature) and teaches them what to expect (nurture)"], ["C", "It produces imprinting (nature) and stranger anxiety (nurture)"], ["D", "It builds temperament (nature) and later moral reasoning (nurture)"]], "ans": "B", "exp": "<p>Bowlby said the bond keeps babies alive (nature) and teaches them what to expect, forming the internal working model (nurture).<\/p>", "tag": "Ch 5"}, {"n": 139, "stem": "<p>A baby whose cries are met with annoyed or unreliable responses comes to expect \"I can't count on people.\" Bowlby called this set of expectations:<\/p>", "opts": [["A", "an expectation of basic trust"], ["B", "an early face schema"], ["C", "an internal working model"], ["D", "an absence of contact comfort"]], "ans": "C", "exp": "<p>The internal working model is Bowlby's term for these expectations; basic trust is Erikson's term.<\/p>", "tag": "Ch 5"}]}, {"title": "Chapter 5 · Ainsworth's Strange Situation and attachment styles", "qs": [{"n": 140, "stem": "<p>In the Strange Situation, what is the purpose of the scene in which a kind stranger enters and the parent leaves?<\/p>", "opts": [["A", "To test whether the baby uses the parent as a secure base for play"], ["B", "To produce the most stressful moment of the procedure"], ["C", "To determine the attachment style from the baby's reaction"], ["D", "To show the bond is to that particular person, not just any adult"]], "ans": "D", "exp": "<p>If the baby still wants the parent when a kind stranger is present, the bond is to that person, not just any adult; B is the alone scene.<\/p>", "tag": "Ch 5"}, {"n": 141, "stem": "<p>Which scene of the Strange Situation is the key moment that defines the attachment style?<\/p>", "opts": [["A", "Play"], ["B", "Reunion"], ["C", "Alone"], ["D", "Stranger in, parent out"]], "ans": "B", "exp": "<p>The reunion is the key moment; the baby's reaction to the returning parent defines the style.<\/p>", "tag": "Ch 5"}, {"n": 142, "stem": "<p>At reunion, a 1-year-old wants to be picked up but then pushes the parent away, stays angry, and is hard to soothe. The baby was very upset at the departure. This baby is most likely classified as:<\/p>", "opts": [["A", "ambivalent/resistant, linked to inconsistent caregiving"], ["B", "avoidant, linked to caregiving that rebuffs bids for comfort"], ["C", "disorganized, linked to a frightening or frightened caregiver"], ["D", "secure, linked to sensitive caregiving"]], "ans": "A", "exp": "<p>Wanting to be held but pushing away and staying angry is ambivalent/resistant, linked to inconsistent care.<\/p>", "tag": "Ch 5"}, {"n": 143, "stem": "<p>A 1-year-old shows little distress when the parent leaves and turns away when the parent returns. Heart-rate monitoring, however, shows elevated stress. This pattern best fits:<\/p>", "opts": [["A", "secure attachment"], ["B", "ambivalent attachment"], ["C", "avoidant attachment"], ["D", "disorganized attachment"]], "ans": "C", "exp": "<p>Avoidant infants show little visible distress and ignore the parent at reunion, but heart-rate data suggest stress is present but hidden.<\/p>", "tag": "Ch 5"}, {"n": 144, "stem": "<p>At reunion, an infant approaches the parent, then backs away, then freezes in place, showing no consistent strategy. Which is true of this style?<\/p>", "opts": [["A", "It was one of Ainsworth's original three styles and is linked to inconsistent care"], ["B", "It is a form of secure attachment seen in temperamentally irritable babies"], ["C", "It is linked to caregiving that rebuffs or ignores the baby's bids for comfort"], ["D", "It was added later by Main and Solomon; linked to a frightening or frightened caregiver"]], "ans": "D", "exp": "<p>Disorganized attachment has no consistent strategy, was added later by Main and Solomon, and is linked to a frightening or frightened caregiver.<\/p>", "tag": "Ch 5"}, {"n": 145, "stem": "<p>Madigan et al. (2023) pooled 20,720 parent-child pairs from 285+ studies. What did they find about the proportion of securely attached children?<\/p>", "opts": [["A", "About two-thirds were secure, confirming the figure from Ainsworth's early studies"], ["B", "About half (51.6%) were secure, not the often-repeated two-thirds"], ["C", "About a quarter were secure, with avoidant the most common style overall"], ["D", "Proportions could not be estimated because styles differed by the child's sex"]], "ans": "B", "exp": "<p>Pooling 20,720 pairs, Madigan found 51.6% secure, so secure is about half, not the two-thirds from small early studies.<\/p>", "tag": "Ch 5"}, {"n": 146, "stem": "<p>In Madigan et al. (2023), which attachment style was the second most common after secure?<\/p>", "opts": [["A", "Disorganized (23.5%)"], ["B", "Avoidant (14.7%)"], ["C", "Ambivalent (10.2%)"], ["D", "Avoidant and ambivalent were tied"]], "ans": "A", "exp": "<p>Disorganized (23.5%) came second, ahead of avoidant (14.7%) and ambivalent (10.2%).<\/p>", "tag": "Ch 5"}, {"n": 147, "stem": "<p>Which finding did Madigan et al. (2023) report?<\/p>", "opts": [["A", "Girls were more often secure than boys, especially in North American samples"], ["B", "Attachment to fathers was less secure than attachment to mothers in every region"], ["C", "Results were identical across every world region, with no regional differences"], ["D", "Maltreatment and parental mental illness predicted more disorganized attachment"]], "ans": "D", "exp": "<p>These factors predicted disorganized attachment; the study found no mother-father or boy-girl differences, and regions did differ.<\/p>", "tag": "Ch 5"}]}, {"title": "Chapter 5 · Is attachment style the result of parenting?", "qs": [{"n": 148, "stem": "<p>Why does Ainsworth's finding that sensitive mothers had secure babies NOT by itself show that sensitivity causes security?<\/p>", "opts": [["A", "Her samples included only fathers"], ["B", "It is a correlation: easy babies might make mothers look sensitive"], ["C", "She never observed the reunion scene"], ["D", "Sensitivity was measured after the babies were randomly assigned"]], "ans": "B", "exp": "<p>Ainsworth's finding is correlational, and an easy baby could make a mother look sensitive, so direction is unclear.<\/p>", "tag": "Ch 5"}, {"n": 149, "stem": "<p>In van den Boom's experiment, what made the conclusion causal?<\/p>", "opts": [["A", "Selecting only highly irritable newborns for the study"], ["B", "Following the babies all the way into adulthood"], ["C", "Studying only low-income families, so income was constant"], ["D", "Randomly assigning half the mothers to training"]], "ans": "D", "exp": "<p>Random assignment balanced temperament across groups, so the only systematic difference was the training.<\/p>", "tag": "Ch 5"}, {"n": 150, "stem": "<p>What did van den Boom find at 12 months?<\/p>", "opts": [["A", "62% of babies were secure with training vs. 22% without"], ["B", "22% were secure with training vs. 62% without"], ["C", "Training had no effect, because the babies were temperamentally irritable"], ["D", "About half were secure in both groups"]], "ans": "A", "exp": "<p>At 12 months 62% of trained mothers' babies were secure vs. 22% of untrained mothers' babies.<\/p>", "tag": "Ch 5"}]}, {"title": "Chapter 5 · Attachment and later life", "qs": [{"n": 151, "stem": "<p>In Hazan and Shaver's study of adult love, what did newspaper readers do, and what did their choices relate to?<\/p>", "opts": [["A", "They completed a Strange Situation with their partners; choices related to their partners' temperament"], ["B", "They chose secure, avoidant, or anxious descriptions; choices related to recalled ties with parents"], ["C", "They kept diaries for two days; choices related to conversational turns"], ["D", "They judged the Heinz dilemma; choices related to their moral stage"]], "ans": "B", "exp": "<p>Readers picked secure, avoidant, or anxious descriptions, and their choices related to recalled relationships with parents.<\/p>", "tag": "Ch 5"}, {"n": 152, "stem": "<p>Which conclusion about attachment and later life best matches the guide's caution?<\/p>", "opts": [["A", "Links are real but modest; the working model is a starting point, not a life sentence"], ["B", "Infant attachment style fixes adult relationship style permanently, as the working model predicts"], ["C", "Infant attachment has no measurable relation to any later social or emotional outcome"], ["D", "Only disorganized attachment predicts anything later in life; the other styles fade"]], "ans": "A", "exp": "<p>The guide says links are real but modest and attachment can shift with divorce, loss, or a new stable relationship.<\/p>", "tag": "Ch 5"}, {"n": 153, "stem": "<p>In the 2023 follow-up of the Bucharest Early Intervention Project, what was the strongest factor by adolescence?<\/p>", "opts": [["A", "Age at placement into foster care"], ["B", "Sex of the child"], ["C", "Stability: staying with the original foster family"], ["D", "Whether the child was placed together with a sibling"]], "ans": "C", "exp": "<p>Earlier placement helped, but that advantage weakened by adolescence, when stability with the original foster family mattered most.<\/p>", "tag": "Ch 5"}, {"n": 154, "stem": "<p>Putting the Bucharest follow-up together with the imprinting research, which conclusion about timing in human attachment does the guide draw?<\/p>", "opts": [["A", "Humans have a critical period: children placed in foster care after about 6 months show no benefit"], ["B", "Timing does not matter for humans; only the quality of care at the time of testing matters"], ["C", "A sensitive period: earlier is better, later is better than never, and stability keeps mattering"], ["D", "Humans imprint on the first caregiver they see, so later placements cannot form real bonds"]], "ans": "C", "exp": "<p>Humans do not imprint with a window that slams shut. There is a sensitive period (earlier placement helps, but later is still better than never) plus an ongoing need for a stable, responsive caregiver. Children placed between 6 and 31 months benefited, which rules out A, and by adolescence stability with the original foster family was the strongest factor.<\/p>", "tag": "Ch 5"}]}, {"title": "Chapter 5 · Our growing mind: Piaget", "qs": [{"n": 155, "stem": "<p>A toddler who knows \"doggy\" sees a cow and says \"Doggy!\" Later, told \"No, that's a cow; cows are big and say moo,\" she splits the category. The first and second steps are, respectively:<\/p>", "opts": [["A", "accommodation, then assimilation"], ["B", "assimilation, then accommodation"], ["C", "conservation, then egocentrism"], ["D", "object permanence, then conservation"]], "ans": "B", "exp": "<p>Calling a cow \"doggy\" fits it to an existing schema (assimilation); splitting the category adjusts the schema (accommodation).<\/p>", "tag": "Ch 5"}, {"n": 156, "stem": "<p>A child uses a banana as a pretend telephone but insists a tall, thin glass holds more milk than the short, wide glass it was poured from. Which Piagetian stage fits best?<\/p>", "opts": [["A", "Sensorimotor"], ["B", "Concrete operational"], ["C", "Preoperational"], ["D", "Formal operational"]], "ans": "C", "exp": "<p>Pretend play with no conservation yet marks the preoperational stage.<\/p>", "tag": "Ch 5"}, {"n": 157, "stem": "<p>A child reasons \"If 8 + 4 = 12, then 12 minus 4 must be 8\" and says of poured milk, \"It's the same. You just poured it.\" Which stage and concept are shown?<\/p>", "opts": [["A", "Concrete operational; reversibility and conservation"], ["B", "Preoperational; egocentrism"], ["C", "Formal operational; hypothetical and abstract reasoning"], ["D", "Sensorimotor; object permanence"]], "ans": "A", "exp": "<p>Reversibility and conservation are key phenomena of the concrete operational stage.<\/p>", "tag": "Ch 5"}, {"n": 158, "stem": "<p>In the pendulum problem, a teenager changes the string length while holding weight and drop height constant, then tests the next variable. This shows:<\/p>", "opts": [["A", "concrete operational conservation of mass and number"], ["B", "preoperational egocentrism about others' viewpoints"], ["C", "assimilation of the pendulum into an existing schema"], ["D", "formal operational reasoning: the logic of an experiment"]], "ans": "D", "exp": "<p>Changing one variable at a time while holding others constant is formal-operational reasoning, the logic of an experiment.<\/p>", "tag": "Ch 5"}, {"n": 159, "stem": "<p>According to the guide, what did Piaget care about most regarding his stages?<\/p>", "opts": [["A", "The exact ages at which each stage begins and ends in every child"], ["B", "The order of the stages, which he thought was the same for every child"], ["C", "Differences in stage timing between Western and non-Western cultures"], ["D", "How direct teaching could speed children through the stages"]], "ans": "B", "exp": "<p>The guide says ages are approximate and Piaget cared about the order, which he believed was the same for every child.<\/p>", "tag": "Ch 5"}, {"n": 160, "stem": "<p>Which pairing of Piagetian stage and approximate age is correct?<\/p>", "opts": [["A", "Sensorimotor: about 2 to 6 or 7"], ["B", "Preoperational: birth to about 2"], ["C", "Formal operational: about 7 to 11"], ["D", "Concrete operational: about 7 to 11"]], "ans": "D", "exp": "<p>Sensorimotor is birth to about 2, preoperational about 2 to 6 or 7, concrete operational about 7 to 11, and formal operational about 12 through adulthood.<\/p>", "tag": "Ch 5"}]}, {"title": "Chapter 5 · Testing Piaget's stages", "qs": [{"n": 161, "stem": "<p>An 8-month-old repeatedly finds a toy hidden under cloth A. The toy is then hidden under cloth B while she watches, and she searches under A. This is:<\/p>", "opts": [["A", "the A-not-B error"], ["B", "a failure of conservation"], ["C", "stranger anx
